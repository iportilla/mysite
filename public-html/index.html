// ------ WEEK 1: Mac Basics & Navigation ------

EXERCISE_HELP['1-0'] = '<strong>Goal:</strong> Learn to launch any app instantly using Spotlight Search &mdash; no clicking through folders needed.<ol><li>Press <kbd>&#8984;</kbd>+<kbd>Space</kbd> (the Command key plus the Space bar) at the same time. A small search bar will appear in the center of your screen.</li><li>Type <strong>System Settings</strong> (you usually only need to type the first few letters before it appears).</li><li>Press <kbd>Return</kbd> to open it.</li><li>Once System Settings opens, look at the left sidebar. Click on a few sections to explore &mdash; try <strong>General</strong>, <strong>Displays</strong>, and <strong>Accessibility</strong>. You don\'t need to change anything; just get a feel for where things are.</li><li>When you\'re done exploring, close System Settings by pressing <kbd>&#8984;</kbd>+<kbd>Q</kbd> or clicking the red circle in the top-left corner of the window.</li></ol><div class="expected-result">&checkmark; Expected result: System Settings opens and you can browse different sections. You now know how to quickly open any app on your Mac without searching through folders.</div>';

EXERCISE_HELP['1-1'] = '<strong>Goal:</strong> Customize your Dock so the apps you use most (like Word and Excel) are easy to reach, and remove clutter you don\'t need.<ol><li>First, let\'s <strong>add Microsoft Word</strong> to your Dock. Press <kbd>&#8984;</kbd>+<kbd>Space</kbd> to open Spotlight, type <strong>Word</strong>, but instead of pressing Return, look at the top result that says <strong>Microsoft Word</strong>. Now open Finder instead: click the blue smiley-face icon in your Dock, then go to <strong>Applications</strong> in the left sidebar. Scroll down to find <strong>Microsoft Word</strong>. Drag its icon down onto the <strong>left side</strong> of your Dock (left of the thin dividing line near the Trash).</li><li>Do the same for <strong>Microsoft Excel</strong> &mdash; find it in Applications and drag it to the Dock, placing it next to Word.</li><li>To <strong>remove apps you don\'t use</strong> (like Keynote, GarageBand, or iMovie if you never open them): right-click (or hold <kbd>Control</kbd> and click) on the app icon in the Dock, hover over <strong>Options</strong>, then click <strong>Remove from Dock</strong>. This only removes the shortcut &mdash; the app stays on your Mac.</li><li>To <strong>adjust Dock size</strong>: open <strong>System Settings</strong> (use Spotlight!), click <strong>Desktop &amp; Dock</strong> in the left sidebar, and drag the <strong>Size</strong> slider left or right until it looks comfortable. A slightly smaller Dock gives you more screen space for documents.</li></ol><div class="expected-result">&checkmark; Expected result: Word and Excel are now in your Dock for easy access, unused apps are removed, and the Dock is a comfortable size. Your Dock should feel like YOUR workspace.</div>';

EXERCISE_HELP['1-2'] = '<strong>Goal:</strong> Set up Hot Corners so you can trigger useful actions just by moving your mouse to a screen corner &mdash; no clicking required.<ol><li>Open <strong>System Settings</strong> (press <kbd>&#8984;</kbd>+<kbd>Space</kbd>, type <strong>System Settings</strong>, press <kbd>Return</kbd>).</li><li>In the left sidebar, click <strong>Desktop &amp; Dock</strong>.</li><li>Scroll all the way down to the bottom of the right panel. You\'ll see a button labeled <strong>Hot Corners&hellip;</strong> &mdash; click it.</li><li>A small window pops up showing all four corners of your screen. Click the dropdown menu next to the <strong>bottom-left corner</strong> and choose <strong>Mission Control</strong>. This will show all your open windows at a glance.</li><li>Click the dropdown for the <strong>bottom-right corner</strong> and choose <strong>Desktop</strong>. This will sweep all windows aside so you can see your Desktop instantly.</li><li>Click <strong>Done</strong> to save.</li><li>Now test them! Move your mouse firmly into the <strong>bottom-left corner</strong> &mdash; you should see all your open windows spread out (Mission Control). Move your mouse to the <strong>bottom-right corner</strong> &mdash; all windows should slide away, revealing your Desktop.</li></ol><div class="expected-result">&checkmark; Expected result: Moving your mouse to the bottom-left corner shows Mission Control (all open windows). Moving to the bottom-right corner shows your Desktop. These save real time during a busy workday.</div>';

EXERCISE_HELP['1-3'] = '<strong>Goal:</strong> Build muscle memory for the 10 most important Mac keyboard shortcuts. These will save you significant time every day.<ol><li>Open <strong>Notes</strong> (press <kbd>&#8984;</kbd>+<kbd>Space</kbd>, type <strong>Notes</strong>, press <kbd>Return</kbd>). Create a new note by pressing <kbd>&#8984;</kbd>+<kbd>N</kbd>.</li><li>Type a sentence like: <em>I am practicing keyboard shortcuts today.</em></li><li>Now practice each shortcut <strong>at least twice</strong>:<br/>&bull; <kbd>&#8984;</kbd>+<kbd>C</kbd> &mdash; <strong>Copy</strong>: First, highlight your sentence (click at the start, hold <kbd>Shift</kbd>, click at the end). Then press <kbd>&#8984;</kbd>+<kbd>C</kbd>.<br/>&bull; <kbd>&#8984;</kbd>+<kbd>V</kbd> &mdash; <strong>Paste</strong>: Click below your text and press <kbd>&#8984;</kbd>+<kbd>V</kbd>. Your sentence appears again.<br/>&bull; <kbd>&#8984;</kbd>+<kbd>Z</kbd> &mdash; <strong>Undo</strong>: Press this to undo the paste. Press it again to undo more.<br/>&bull; <kbd>&#8984;</kbd>+<kbd>S</kbd> &mdash; <strong>Save</strong>: Notes auto-saves, but try it &mdash; it works in Word and other apps.<br/>&bull; <kbd>&#8984;</kbd>+<kbd>Q</kbd> &mdash; <strong>Quit app</strong>: Don\'t press this yet (we\'re still in Notes!).<br/>&bull; <kbd>&#8984;</kbd>+<kbd>W</kbd> &mdash; <strong>Close window</strong>: Closes the current window without quitting the app.<br/>&bull; <kbd>&#8984;</kbd>+<kbd>Tab</kbd> &mdash; <strong>Switch apps</strong>: Hold <kbd>&#8984;</kbd> and tap <kbd>Tab</kbd> to cycle through open apps. Release to switch.<br/>&bull; <kbd>&#8984;</kbd>+<kbd>Space</kbd> &mdash; <strong>Spotlight</strong>: You already know this one!<br/>&bull; <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>3</kbd> &mdash; <strong>Full screenshot</strong>: Takes a picture of your entire screen.<br/>&bull; <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>4</kbd> &mdash; <strong>Area screenshot</strong>: Crosshair appears; drag to capture a region.</li><li>Go through the list again so each shortcut has been practiced at least twice.</li></ol><div class="expected-result">&checkmark; Expected result: You\'ve practiced all 10 shortcuts at least twice each. The Copy/Paste/Undo cycle should already feel more natural. These shortcuts work in virtually every Mac app you\'ll use.</div>';

EXERCISE_HELP['1-4'] = '<strong>Goal:</strong> Take a full-screen screenshot and learn where your Mac saves it.<ol><li>Make sure something is visible on your screen &mdash; maybe your Notes app or your Desktop.</li><li>Press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>3</kbd> all at the same time. You\'ll hear a camera shutter sound (if your volume is on) and see a small thumbnail briefly appear in the bottom-right corner of your screen.</li><li>Your screenshot is automatically saved to your <strong>Desktop</strong>. Look for a file named something like <strong>Screenshot 2026-02-15 at 10.30.00&nbsp;AM.png</strong> (the date and time will reflect when you took it).</li><li>Double-click the screenshot file on your Desktop to open it in <strong>Preview</strong>. You should see an image of your entire screen.</li><li><strong>Tip:</strong> If you click the small thumbnail that briefly appears in the corner right after taking the screenshot, you can annotate or crop it before it saves. But if you miss it, that\'s fine &mdash; the file is already on your Desktop.</li></ol><div class="expected-result">&checkmark; Expected result: A .png screenshot file appears on your Desktop showing everything that was on your screen. Double-clicking it opens the image in Preview. This is very useful for documenting tech issues or saving things you see on screen.</div>';

EXERCISE_HELP['1-5'] = '<strong>Goal:</strong> Take a screenshot of just a specific area of your screen &mdash; perfect for capturing just what you need.<ol><li>Press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>4</kbd> all at the same time. Your cursor will change into a small crosshair (+) symbol.</li><li>Click and <strong>hold</strong> your mouse button at the top-left corner of the area you want to capture.</li><li>While holding the mouse button, <strong>drag</strong> diagonally to the bottom-right corner of the area you want. You\'ll see a highlighted rectangle showing what will be captured, along with the pixel dimensions.</li><li>Release the mouse button. You\'ll hear the shutter sound and see the thumbnail preview in the bottom-right corner.</li><li>Find the screenshot on your <strong>Desktop</strong>, just like the full screenshot.</li><li><strong>Bonus tip:</strong> If you start dragging and change your mind, press <kbd>Esc</kbd> to cancel without taking a screenshot. Also, if you press <kbd>Space</kbd> after pressing <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>4</kbd>, the crosshair turns into a camera icon &mdash; click any window to capture just that window with a nice shadow effect.</li></ol><div class="expected-result">&checkmark; Expected result: A screenshot of just the area you selected appears on your Desktop. This is great for capturing a specific paragraph, image, or section of a webpage without including everything else.</div>';

EXERCISE_HELP['1-6'] = '<strong>Goal:</strong> Learn to use Mission Control and multiple Desktops to organize your workspace &mdash; like having separate physical desks for different tasks.<ol><li><strong>Open Mission Control</strong> using one of these methods:<br/>&bull; Move your mouse to your Hot Corner (bottom-left, if you set it up in Exercise 1-2), <strong>OR</strong><br/>&bull; Swipe <strong>up</strong> with <strong>three fingers</strong> on your trackpad, <strong>OR</strong><br/>&bull; Press <kbd>Control</kbd>+<kbd>&uarr;</kbd> (Control plus the Up arrow key).</li><li>You\'ll see all your open windows spread out, and at the top of the screen you\'ll see a bar showing your current Desktop(s).</li><li>Move your mouse to the <strong>top-right area</strong> of the screen. You\'ll see a <strong>+</strong> button appear. Click it to create a <strong>second Desktop</strong>.</li><li>Click on <strong>Desktop 2</strong> at the top to switch to it. Notice it\'s empty &mdash; like a fresh workspace.</li><li><strong>Switch between Desktops</strong> by swiping <strong>left or right</strong> with <strong>three fingers</strong> on your trackpad. Or press <kbd>Control</kbd>+<kbd>&larr;</kbd> or <kbd>Control</kbd>+<kbd>&rarr;</kbd>.</li><li><strong>Practical idea:</strong> You could keep your clinical documents on Desktop 1 and your email/web browsing on Desktop 2 to reduce distraction during focused work.</li></ol><div class="expected-result">&checkmark; Expected result: You have two Desktops and can switch between them smoothly using a three-finger swipe or the keyboard shortcuts. Mission Control shows all your windows at a glance. This is a powerful way to stay organized during a busy day.</div>';

EXERCISE_HELP['1-7'] = '<strong>Goal:</strong> Install a free app from the App Store and learn to find all your apps using Launchpad.<ol><li>Open the <strong>App Store</strong> &mdash; click its icon in your Dock (blue circle with a white "A") or use Spotlight (<kbd>&#8984;</kbd>+<kbd>Space</kbd>, type <strong>App Store</strong>).</li><li>Click the <strong>Search</strong> field in the top-left corner and type <strong>Amphetamine</strong>. This is a free, highly-rated app that keeps your Mac awake &mdash; very useful during telehealth sessions so your screen doesn\'t go to sleep mid-call.</li><li>Find <strong>Amphetamine</strong> by William Gustafson (it has a pill icon). Click the <strong>Get</strong> button, then click <strong>Install</strong>. You may need to enter your Apple ID password or use Touch ID.</li><li>Wait for the download to complete. Once installed, the button will say <strong>Open</strong>. Click it to launch Amphetamine. You\'ll see a small pill icon appear in your <strong>menu bar</strong> (top-right of your screen). Click it to start a session that keeps your Mac awake.</li><li>Now let\'s find <strong>Launchpad</strong>: click the <strong>Launchpad</strong> icon in your Dock (it looks like a grid of colorful squares, like an iPhone home screen). This shows all your installed apps. You can type to search, or swipe left/right to see more pages.</li><li>Press <kbd>Esc</kbd> to close Launchpad when you\'re done.</li></ol><div class="expected-result">&checkmark; Expected result: Amphetamine is installed and its icon appears in your menu bar at the top of the screen. You can activate it before telehealth sessions. Launchpad shows all your apps in a familiar grid view.</div>';

// ------ WEEK 2: File Management & Organization ------

EXERCISE_HELP['2-0'] = '<strong>Goal:</strong> Make file extensions visible so you can always tell what type a file is &mdash; .docx, .pdf, .xlsx, etc.<ol><li>Open <strong>Finder</strong> by clicking the blue smiley-face icon in your Dock.</li><li>With Finder in the foreground (its name should appear next to the Apple menu at the top-left), click <strong>Finder</strong> in the menu bar at the very top of your screen, then click <strong>Settings&hellip;</strong> (or press <kbd>&#8984;</kbd>+<kbd>,</kbd>).</li><li>In the Finder Settings window, click the <strong>Advanced</strong> tab (the last tab on the right).</li><li>Check the box next to <strong>&ldquo;Show all filename extensions&rdquo;</strong>.</li><li>Close the Settings window. Now look at any files in Finder &mdash; you should see extensions like <strong>.pdf</strong>, <strong>.docx</strong>, <strong>.png</strong> after each filename.</li></ol><div class="expected-result">&checkmark; Expected result: All files in Finder now show their extensions. A file that used to just say &ldquo;Treatment Plan&rdquo; now says &ldquo;Treatment Plan.docx&rdquo; &mdash; so you always know exactly what kind of file you\'re looking at.</div>';

EXERCISE_HELP['2-1'] = '<strong>Goal:</strong> Create an organized folder structure in your Documents folder that matches how you actually work.<ol><li>Open <strong>Finder</strong> (blue smiley face in Dock) and click <strong>Documents</strong> in the left sidebar.</li><li>Create the main <strong>Practice</strong> folder: either right-click in the empty space and choose <strong>New Folder</strong>, or press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>. Name it <strong>Practice</strong>.</li><li>Double-click <strong>Practice</strong> to open it. Now create four subfolders inside it using <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> for each:<br/>&bull; <strong>Templates</strong> (for treatment plans, intake forms, etc.)<br/>&bull; <strong>CE Materials</strong> (for continuing education documents)<br/>&bull; <strong>Client Resources</strong> (for handouts and worksheets you share with clients)<br/>&bull; <strong>Professional Development</strong> (for training certificates, notes from conferences)</li><li>Go back to Documents (click <strong>Documents</strong> in the sidebar or press <kbd>&#8984;</kbd>+<kbd>&uarr;</kbd>).</li><li>Create two more folders at the Documents level:<br/>&bull; <strong>Research</strong><br/>&bull; <strong>Personal</strong></li></ol><div class="expected-result">&checkmark; Expected result: Your Documents folder now contains three folders: Practice (with 4 subfolders), Research, and Personal. This gives everything a clear home, just like a well-organized filing cabinet in your office.</div>';

EXERCISE_HELP['2-2'] = '<strong>Goal:</strong> Clean up your Desktop by moving loose files into the folders you just created. A clean Desktop helps you focus.<ol><li>Open <strong>Finder</strong> and click <strong>Desktop</strong> in the left sidebar to see all the files currently on your Desktop.</li><li>Look at each file and decide where it belongs:<br/>&bull; Documents and PDFs related to your practice &rarr; move to the appropriate subfolder in <strong>Practice</strong><br/>&bull; Research articles &rarr; move to <strong>Research</strong><br/>&bull; Personal items &rarr; move to <strong>Personal</strong><br/>&bull; Screenshots you no longer need &rarr; move to Trash</li><li>To <strong>move a file</strong>: click and drag it onto the appropriate folder in the Finder sidebar (like Documents), then navigate into that folder and its subfolders. Or: right-click the file, choose <strong>Move to&hellip;</strong> if available, or use <strong>Copy</strong> (<kbd>&#8984;</kbd>+<kbd>C</kbd>) then navigate to the destination and use <strong>Move Item Here</strong> (<kbd>&#8984;</kbd>+<kbd>Option</kbd>+<kbd>V</kbd>).</li><li>Continue until you have <strong>5 or fewer items</strong> remaining on your Desktop. Keep only things you\'re actively working on this week.</li></ol><div class="expected-result">&checkmark; Expected result: Your Desktop has 5 or fewer items on it. Everything else is filed away in your organized folder structure. A clean Desktop feels calming and makes it easier to find what you actually need.</div>';

EXERCISE_HELP['2-3'] = '<strong>Goal:</strong> Clean out your Downloads folder, which tends to accumulate clutter over time.<ol><li>Open <strong>Finder</strong> and click <strong>Downloads</strong> in the left sidebar.</li><li>Sort by date so the newest files are on top: click <strong>View</strong> in the menu bar, choose <strong>Sort By</strong>, then select <strong>Date Added</strong>. Or, if you\'re in list view, click the <strong>Date Added</strong> column header.</li><li>Go through the files <strong>starting with the oldest</strong> (scroll to the bottom):<br/>&bull; Important documents (CE certificates, insurance forms, etc.) &rarr; move to the appropriate folder in your Documents structure<br/>&bull; Installer files (.dmg, .pkg) for apps you\'ve already installed &rarr; safe to delete<br/>&bull; Duplicate downloads &rarr; delete the extras<br/>&bull; Files you don\'t recognize or need &rarr; delete them</li><li>To delete files: select them and press <kbd>&#8984;</kbd>+<kbd>Delete</kbd> (this moves them to Trash).</li><li>When you\'re done cleaning, <strong>empty the Trash</strong>: right-click the Trash icon in your Dock and choose <strong>Empty Trash</strong>, or press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>Delete</kbd> in Finder.</li></ol><div class="expected-result">&checkmark; Expected result: Your Downloads folder is significantly smaller. Important files have been moved to proper folders, and unnecessary files are gone. The Trash has been emptied to free up disk space.</div>';

EXERCISE_HELP['2-4'] = '<strong>Goal:</strong> Set up iCloud Drive so your important files are backed up to the cloud and accessible from your iPhone too.<ol><li>Open <strong>System Settings</strong> (<kbd>&#8984;</kbd>+<kbd>Space</kbd>, type <strong>System Settings</strong>).</li><li>Click on <strong>your name</strong> at the very top of the left sidebar (it shows your Apple ID name and photo). If you\'re not signed in, you\'ll need to sign in with your Apple ID first.</li><li>Click <strong>iCloud</strong>.</li><li>Click <strong>iCloud Drive</strong>. Make sure the toggle is turned <strong>ON</strong> (green).</li><li>Below the toggle, you\'ll see <strong>&ldquo;Sync this Mac&rdquo;</strong> and optionally <strong>&ldquo;Desktop &amp; Documents Folders&rdquo;</strong>. If you turn on Desktop &amp; Documents, your files in those folders will automatically sync to iCloud and be available on your iPhone. This is recommended if you have enough iCloud storage (5 GB is free; you may want 50 GB for $0.99/month).</li><li>Click <strong>Done</strong> when finished. Files will begin syncing in the background &mdash; you\'ll see a small progress circle next to files in Finder as they upload.</li></ol><div class="expected-result">&checkmark; Expected result: iCloud Drive is turned on in System Settings. If you enabled Desktop &amp; Documents sync, those files will gradually appear in the Files app on your iPhone. This gives you an automatic backup and access to files from either device.</div>';

EXERCISE_HELP['2-5'] = '<strong>Goal:</strong> Use AirDrop to wirelessly send a photo from your Mac to your iPhone &mdash; instant, no email or cables needed.<ol><li>First, make sure <strong>both devices are ready</strong>:<br/>&bull; On your <strong>iPhone</strong>: open Control Center (swipe down from the top-right corner), make sure <strong>Wi-Fi</strong> and <strong>Bluetooth</strong> are both on (blue icons). Press and hold the network settings box (Wi-Fi/Bluetooth area), then tap <strong>AirDrop</strong> and select <strong>Contacts Only</strong> or <strong>Everyone for 10 Minutes</strong>.<br/>&bull; On your <strong>Mac</strong>: make sure Wi-Fi and Bluetooth are on (check the icons in your menu bar at the top-right).</li><li>On your Mac, open <strong>Finder</strong> and find a photo (check your Desktop for a screenshot from earlier exercises, or look in your Photos library).</li><li>Right-click the photo, hover over <strong>Share&hellip;</strong>, and click <strong>AirDrop</strong>.</li><li>A window will appear showing nearby Apple devices. You should see your <strong>iPhone</strong> listed. Click on it.</li><li>On your iPhone, you\'ll see a notification asking if you want to accept the file. Tap <strong>Accept</strong>. The photo will open or be saved to your Photos app.</li></ol><div class="expected-result">&checkmark; Expected result: The photo appears on your iPhone within seconds. AirDrop is incredibly useful for sending files between your Mac and iPhone &mdash; no email attachments or cables required.</div>';

EXERCISE_HELP['2-6'] = '<strong>Goal:</strong> Learn to compress (zip) files for easy sharing via email.<ol><li>Open <strong>Finder</strong> and navigate to a folder with a few files (your Practice folder, or Desktop).</li><li>Select <strong>2 or 3 files</strong> together: click the first file, then hold <kbd>&#8984;</kbd> and click each additional file to add it to your selection. All selected files will be highlighted in blue.</li><li>Right-click (or <kbd>Control</kbd>+click) on any one of the highlighted files.</li><li>Click <strong>&ldquo;Compress 3 Items&rdquo;</strong> (the number will match how many files you selected).</li><li>A new file called <strong>Archive.zip</strong> will appear in the same folder. You can rename it to something meaningful &mdash; click on the name, wait a moment, click again to edit it (or select it and press <kbd>Return</kbd>), then type a new name like <strong>CE-Documents.zip</strong>.</li><li>To <strong>unzip</strong> a file later, just double-click the .zip file. A new folder will appear with all the original files inside.</li></ol><div class="expected-result">&checkmark; Expected result: A .zip file appears in your folder containing the files you selected. This compressed file is smaller and easier to email as a single attachment. Double-clicking it extracts the original files.</div>';

EXERCISE_HELP['2-7'] = '<strong>Goal:</strong> Learn to use Finder\'s powerful search to find any file on your Mac quickly.<ol><li>Open <strong>Finder</strong> and press <kbd>&#8984;</kbd>+<kbd>F</kbd> to start a search.</li><li>Type a filename or keyword you know exists on your Mac &mdash; for example, type <strong>Practice</strong> to find your new folder, or type a word you know is in a document name.</li><li>Look at the search results. Notice the bar near the top that says <strong>&ldquo;Search: This Mac&rdquo;</strong> or your current folder name. Click <strong>&ldquo;This Mac&rdquo;</strong> to search everywhere, or the folder name to search only the current location.</li><li>Now try <strong>filtering by file type</strong>: click the <strong>+</strong> button below the search bar (on the right side). A filter row appears. Change the first dropdown from <strong>&ldquo;Name&rdquo;</strong> to <strong>&ldquo;Kind&rdquo;</strong>, then in the second dropdown choose a type like <strong>PDF</strong>, <strong>Image</strong>, or <strong>Document</strong>.</li><li>Try another search: clear the search field and type <strong>.pdf</strong> to find all your PDFs, or type <strong>.docx</strong> to find all Word documents.</li></ol><div class="expected-result">&checkmark; Expected result: You can find files by name and filter results by file type. This is far faster than manually clicking through folders. You\'ll use this skill regularly when looking for documents.</div>';

// ------ WEEK 3: Productivity Apps ------

EXERCISE_HELP['3-0'] = '<strong>Goal:</strong> Set up color-coded calendars in the Calendar app so different parts of your life are visually distinct.<ol><li>Open <strong>Calendar</strong> (<kbd>&#8984;</kbd>+<kbd>Space</kbd>, type <strong>Calendar</strong>, press <kbd>Return</kbd>).</li><li>In the bottom-left corner, make sure you can see the calendar list. If you don\'t see a sidebar with calendar names, click <strong>Calendars</strong> at the top of the sidebar or press <kbd>&#8984;</kbd>+<kbd>Option</kbd>+<kbd>S</kbd> to show it.</li><li>Create the first calendar: go to <strong>File</strong> menu &rarr; <strong>New Calendar</strong> (or press <kbd>&#8984;</kbd>+<kbd>Option</kbd>+<kbd>N</kbd>). A new calendar appears in the sidebar. Type <strong>Client Sessions</strong> as the name and press <kbd>Return</kbd>.</li><li>Right-click on <strong>Client Sessions</strong> and choose <strong>Get Info</strong>. Click the color swatch and choose <strong>blue</strong>. Click <strong>OK</strong>.</li><li>Repeat to create <strong>CE &amp; Training</strong> (set color to <strong>orange</strong>) and <strong>Personal</strong> (set color to <strong>purple</strong>).</li><li>You can now uncheck the default calendars you don\'t need (like &ldquo;Home&rdquo; or &ldquo;Work&rdquo;) by unchecking the box next to them in the sidebar. This hides them without deleting them.</li></ol><div class="expected-result">&checkmark; Expected result: Three new calendars appear in your sidebar &mdash; Client Sessions (blue), CE &amp; Training (orange), and Personal (purple). When you add events, you\'ll be able to color-code them by choosing which calendar they belong to.</div>';

EXERCISE_HELP['3-1'] = '<strong>Goal:</strong> Create recurring events so regular commitments show up automatically every week or month.<ol><li>In <strong>Calendar</strong>, double-click on a day and time to create a new event (or click the <strong>+</strong> button in the top-left corner).</li><li>For your first event, type a name like <strong>Supervision Group</strong>. Click it to open the detail editor. Set the day and time for your regular session.</li><li>Click <strong>&ldquo;Add Alert&hellip;&rdquo;</strong> and choose <strong>30 minutes before</strong> so you get a reminder.</li><li>Click <strong>&ldquo;Repeat&rdquo;</strong> (or the repeat dropdown) and choose <strong>Every Week</strong>. This event will now repeat automatically every week at the same time.</li><li>Make sure it\'s assigned to the correct calendar (e.g., <strong>Client Sessions</strong> for clinical events). Click the <strong>Calendar</strong> dropdown to change it if needed.</li><li>Create a second event: a monthly meeting like <strong>Peer Consultation</strong>. Set it to repeat <strong>Every Month</strong>. Assign it to <strong>CE &amp; Training</strong>. Add a <strong>1 hour before</strong> alert.</li><li>Create a third event: something personal like <strong>Walk with [name]</strong> or <strong>Dinner with family</strong>. Set it to repeat weekly. Assign it to <strong>Personal</strong>.</li></ol><div class="expected-result">&checkmark; Expected result: Three recurring events appear on your calendar in their correct colors. Each has an alert set. You\'ll see these events repeating into the future &mdash; no need to add them again each week or month.</div>';

EXERCISE_HELP['3-2'] = '<strong>Goal:</strong> Create organized, color-coded Reminder lists for different areas of your life.<ol><li>Open <strong>Reminders</strong> (<kbd>&#8984;</kbd>+<kbd>Space</kbd>, type <strong>Reminders</strong>, press <kbd>Return</kbd>).</li><li>In the bottom-left corner of the sidebar, click <strong>Add List</strong>.</li><li>Name the first list <strong>Practice Tasks</strong>. Choose a color by clicking the color circle &mdash; pick something like <strong>blue</strong> to match your Client Sessions calendar. You can also choose an icon. Click <strong>OK</strong> (or <strong>Done</strong>).</li><li>Click <strong>Add List</strong> again. Name it <strong>CE Deadlines</strong> and pick <strong>orange</strong> as the color.</li><li>Click <strong>Add List</strong> one more time. Name it <strong>Personal</strong> and pick <strong>purple</strong>.</li><li>You now have three dedicated lists. Click on each one to make sure it\'s set up correctly and the colors look right.</li></ol><div class="expected-result">&checkmark; Expected result: Three color-coded Reminder lists appear in your sidebar: Practice Tasks (blue), CE Deadlines (orange), and Personal (purple). These will help you keep different types of to-dos separate and easy to scan.</div>';

EXERCISE_HELP['3-3'] = '<strong>Goal:</strong> Add real tasks to your Reminder lists with due dates and time alerts so nothing falls through the cracks.<ol><li>In <strong>Reminders</strong>, click on <strong>Practice Tasks</strong> in the sidebar.</li><li>Click in the main area and type your first task, e.g., <strong>Update intake form template</strong>. Press <kbd>Return</kbd>.</li><li>Now add details: click the small <strong>i</strong> (info) button next to the task (or click the task and press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>I</kbd>). Set a <strong>due date</strong> by toggling &ldquo;Date&rdquo; on and choosing a date. Toggle &ldquo;Time&rdquo; on and set a specific time for the alert.</li><li>Click on <strong>CE Deadlines</strong>. Add a task like <strong>Complete Ethics CE hours by June 30</strong>. Set the due date and a time alert.</li><li>Add 3 more tasks across your lists (5 total). Ideas:<br/>&bull; <strong>Practice Tasks:</strong> &ldquo;Send progress note to Dr. [name]&rdquo;<br/>&bull; <strong>Practice Tasks:</strong> &ldquo;Follow up with insurance re: claim #___&rdquo;<br/>&bull; <strong>Personal:</strong> &ldquo;Schedule dentist appointment&rdquo;</li><li>Make sure each task has a <strong>due date</strong> and <strong>time alert</strong> set.</li></ol><div class="expected-result">&checkmark; Expected result: You have 5 tasks spread across your three lists, each with a due date and time-based alert. You\'ll get notifications before each task is due &mdash; just like a reliable assistant reminding you.</div>';

EXERCISE_HELP['3-4'] = '<strong>Goal:</strong> Organize the Notes app with folders and create a pinned Quick Reference note for things you look up often.<ol><li>Open <strong>Notes</strong> (<kbd>&#8984;</kbd>+<kbd>Space</kbd>, type <strong>Notes</strong>, press <kbd>Return</kbd>).</li><li>In the left sidebar, look for the <strong>Folders</strong> section. Click <strong>New Folder</strong> at the bottom of the sidebar (or go to <strong>File</strong> &rarr; <strong>New Folder</strong>). Name it <strong>Workshop Notes</strong>.</li><li>Create two more folders: <strong>Reading Notes</strong> and <strong>Quick Reference</strong>.</li><li>Now click on the <strong>Quick Reference</strong> folder. Create a new note by pressing <kbd>&#8984;</kbd>+<kbd>N</kbd>.</li><li>Title it <strong>Quick Reference</strong> and add information you look up frequently, such as:<br/>&bull; Your NPI number<br/>&bull; Insurance panel phone numbers<br/>&bull; License renewal dates (MFT and LADT)<br/>&bull; Common CPT codes you use<br/>&bull; Supervisor/colleague contact info</li><li>To <strong>pin</strong> this note so it always stays at the top: right-click on the note in the list and select <strong>Pin Note</strong>. A pin icon will appear next to it and it will move to the top of the list.</li></ol><div class="expected-result">&checkmark; Expected result: Three folders are organized in your Notes sidebar. Your Quick Reference note is pinned at the top and contains frequently-needed information. No more digging through papers or files for numbers you need regularly.</div>';

EXERCISE_HELP['3-5'] = '<strong>Goal:</strong> Set up Tab Groups in Safari to organize different types of websites you visit regularly.<ol><li>Open <strong>Safari</strong> (click its icon in the Dock or use Spotlight).</li><li>Click the <strong>sidebar button</strong> in the top-left of Safari\'s toolbar (it looks like a small rectangle with lines). This shows the sidebar with your Tab Groups.</li><li>In the sidebar, right-click and choose <strong>New Tab Group</strong> (or click the <strong>+</strong> icon). Name it <strong>Research</strong>. Now open a few relevant tabs in this group &mdash; try PubMed (<strong>pubmed.ncbi.nlm.nih.gov</strong>), Google Scholar (<strong>scholar.google.com</strong>), or Psychology Today.</li><li>Create another Tab Group: right-click in the sidebar, choose <strong>New Tab Group</strong>, name it <strong>CE Opportunities</strong>. Open tabs for CE providers you use &mdash; try your state licensing board site, PESI, or Zur Institute.</li><li>Create a third: <strong>Insurance &amp; Billing</strong>. Open tabs for insurance portals, your billing software (if web-based), and your EHR system.</li><li>Switch between groups by clicking their names in the sidebar. Notice how each group preserves its own set of tabs &mdash; no more tab clutter!</li></ol><div class="expected-result">&checkmark; Expected result: Three Tab Groups appear in Safari\'s sidebar, each with relevant websites loaded. Switching between groups instantly changes your tabs. This keeps your browser organized by context &mdash; no more hunting through dozens of mixed tabs.</div>';

EXERCISE_HELP['3-6'] = '<strong>Goal:</strong> Do a 10-minute weekly planning session using Calendar and Reminders side by side.<ol><li>Open <strong>Calendar</strong> and switch to <strong>Week</strong> view (click <strong>Week</strong> at the top of the Calendar window, or press <kbd>&#8984;</kbd>+<kbd>3</kbd>).</li><li>Now open <strong>Reminders</strong>. To view both apps side by side: click and hold the <strong>green button</strong> (top-left corner) of the Calendar window and choose <strong>&ldquo;Tile Window to Left of Screen&rdquo;</strong>. Then click the Reminders window to fill the right side. Now both apps share the screen equally.</li><li>Look at your <strong>Calendar</strong> for the upcoming week:<br/>&bull; Are all your client sessions and meetings there?<br/>&bull; Any events missing? Add them now.<br/>&bull; Any scheduling conflicts? Adjust if needed.</li><li>Look at your <strong>Reminders</strong> lists:<br/>&bull; Any overdue tasks? Either complete them or update the due dates.<br/>&bull; Any new tasks to add based on your calendar? Add them now.<br/>&bull; Do your due dates still make sense with your schedule?</li><li>Spend about <strong>10 minutes</strong> reviewing and adjusting both. This weekly habit prevents surprises and keeps you on track.</li><li>When done, press <kbd>Esc</kbd> or click the green button again to exit split-screen.</li></ol><div class="expected-result">&checkmark; Expected result: You\'ve reviewed your upcoming week in Calendar and your task lists in Reminders, making adjustments as needed. Doing this for 10 minutes each week (Sunday evening or Monday morning works well) dramatically reduces the chance of missing something important.</div>';

EXERCISE_HELP['3-7'] = '<strong>Goal:</strong> Practice turning a big professional goal into actionable steps with deadlines using Reminders.<ol><li>Open <strong>Reminders</strong> and click on <strong>CE Deadlines</strong> (or <strong>Practice Tasks</strong> &mdash; whichever fits best).</li><li>Think of a professional goal, such as:<br/>&bull; &ldquo;Complete specialization in trauma-informed care&rdquo;<br/>&bull; &ldquo;Develop a psychoeducation workshop for clients&rdquo;<br/>&bull; &ldquo;Build referral relationships with 5 new providers&rdquo;</li><li>Type the goal as a reminder. Then break it into <strong>3 to 5 concrete steps</strong>. Add each step as its own reminder. For example, if your goal is developing a workshop:<br/>&bull; Step 1: &ldquo;Research 3 similar workshops for format ideas&rdquo; &mdash; due in 1 week<br/>&bull; Step 2: &ldquo;Write outline of workshop topics and activities&rdquo; &mdash; due in 2 weeks<br/>&bull; Step 3: &ldquo;Create handout materials&rdquo; &mdash; due in 3 weeks<br/>&bull; Step 4: &ldquo;Do practice run with colleague for feedback&rdquo; &mdash; due in 5 weeks</li><li>Set <strong>due dates and time alerts</strong> for each step (click the <strong>i</strong> button on each task).</li><li>To connect the steps visually, you can <strong>indent</strong> sub-tasks: drag a task slightly to the right under the main goal to make it a subtask.</li></ol><div class="expected-result">&checkmark; Expected result: Your professional goal is broken into 3-5 actionable steps, each with its own due date and reminder. This makes a big goal feel manageable and keeps you moving forward one step at a time.</div>';

// ------ WEEK 4: Communication & Email ------

EXERCISE_HELP['4-0'] = '<strong>Goal:</strong> Create color-coded Gmail labels to organize your inbox by category &mdash; much like colored folders in a filing cabinet.<ol><li>Open <strong>Safari</strong> and go to <strong>mail.google.com</strong>. Sign in to your Gmail account if you aren\'t already.</li><li>In the left sidebar, scroll down and click <strong>More</strong> to expand all options, then click <strong>Create new label</strong>. (Alternatively, click the <strong>gear icon</strong> &#9881; in the top-right, click <strong>See all settings</strong>, then go to the <strong>Labels</strong> tab and scroll down to click <strong>Create new label</strong>.)</li><li>Type <strong>Referrals</strong> and click <strong>Create</strong>.</li><li>The new label appears in the sidebar. To color-code it: hover over <strong>Referrals</strong> in the sidebar, click the <strong>three dots</strong> (&#8942;) that appear, hover over <strong>Label color</strong>, and pick a color (try green for Referrals).</li><li>Repeat to create these labels with colors:<br/>&bull; <strong>Insurance</strong> &mdash; pick blue<br/>&bull; <strong>CE/Training</strong> &mdash; pick orange<br/>&bull; <strong>Colleagues</strong> &mdash; pick purple</li><li>To <strong>apply a label</strong> to an existing email: open the email, click the <strong>Labels</strong> icon (it looks like a tag) in the toolbar above the email, check the box next to the appropriate label, and click <strong>Apply</strong>.</li></ol><div class="expected-result">&checkmark; Expected result: Four color-coded labels appear in your Gmail sidebar. You can now apply these labels to incoming emails, making it easy to sort and find messages by category &mdash; just like colored tabs in a physical file folder.</div>';

EXERCISE_HELP['4-1'] = '<strong>Goal:</strong> Create Gmail filters that automatically label incoming emails from specific senders &mdash; your inbox organizes itself.<ol><li>In <strong>Gmail</strong>, click the <strong>gear icon</strong> &#9881; in the top-right, then click <strong>See all settings</strong>.</li><li>Click the <strong>Filters and Blocked Addresses</strong> tab.</li><li>Click <strong>Create a new filter</strong>.</li><li>For the first filter (insurance companies): in the <strong>From</strong> field, type the email domain of your insurance company (e.g., <strong>@anthem.com</strong> or <strong>@unitedhealthcare.com</strong>). If you deal with multiple insurers, you can separate them with <strong>OR</strong> (e.g., <strong>@anthem.com OR @unitedhealthcare.com</strong>).</li><li>Click <strong>Create filter</strong> (not &ldquo;Search&rdquo;).</li><li>Check <strong>&ldquo;Apply the label&rdquo;</strong> and select <strong>Insurance</strong> from the dropdown. Optionally check <strong>&ldquo;Also apply filter to matching conversations&rdquo;</strong> to label existing emails too. Click <strong>Create filter</strong>.</li><li>Repeat for your second filter: create a new filter with your CE provider\'s email domain (e.g., <strong>@pesi.com</strong> or <strong>@zurinstitute.com</strong>) in the From field. Apply the label <strong>CE/Training</strong>.</li></ol><div class="expected-result">&checkmark; Expected result: Two filters are now active. Future emails from your insurance company will automatically get the &ldquo;Insurance&rdquo; label, and emails from your CE provider will get the &ldquo;CE/Training&rdquo; label. Your inbox starts organizing itself.</div>';

EXERCISE_HELP['4-2'] = '<strong>Goal:</strong> Create reusable email templates so you don\'t have to retype common emails from scratch every time.<ol><li>First, <strong>enable Templates</strong> in Gmail: click the <strong>gear icon</strong> &#9881; &rarr; <strong>See all settings</strong> &rarr; <strong>Advanced</strong> tab. Find <strong>&ldquo;Templates&rdquo;</strong> and click <strong>Enable</strong>. Scroll down and click <strong>Save Changes</strong>. Gmail will reload.</li><li>Now create your first template &mdash; a <strong>referral inquiry</strong>. Click <strong>Compose</strong> to start a new email. Type a subject like <strong>&ldquo;Referral Inquiry &mdash; [Client Initials]&rdquo;</strong>. In the body, write something like:<br/><em>&ldquo;Dear [Provider Name],<br/>I am writing to discuss a potential referral for a client who may benefit from your services. I am a Licensed MFT/LADT and would like to coordinate care. Could we schedule a brief call to discuss?<br/>Best regards,<br/>David [Last Name], LMFT, LADT&rdquo;</em></li><li>To save it as a template: click the <strong>three dots</strong> (&#8942;) at the bottom-right of the compose window &rarr; <strong>Templates</strong> &rarr; <strong>Save draft as template</strong> &rarr; <strong>Save as new template</strong>. Name it <strong>Referral Inquiry</strong>.</li><li>Create a second template: <strong>Professional Introduction</strong>. Compose a new email with subject <strong>&ldquo;Professional Introduction&rdquo;</strong> and write a brief intro of yourself and your practice. Save it as a template using the same steps.</li><li>To <strong>use a template</strong> later: click Compose, then click the <strong>three dots</strong> (&#8942;) &rarr; <strong>Templates</strong>, and select the template you want. The body and subject line will fill in automatically. Just customize the specific details.</li></ol><div class="expected-result">&checkmark; Expected result: Two reusable email templates are saved in Gmail. When you need to send a referral inquiry or professional introduction, you can insert the template in seconds and just customize the details. This saves significant time.</div>';

EXERCISE_HELP['4-3'] = '<strong>Goal:</strong> Organize your contacts into professional groups so you can find people quickly by role.<ol><li>Open <strong>Safari</strong> and go to <strong>contacts.google.com</strong> (Google Contacts manages your Gmail contacts and syncs with your phone).</li><li>In the left sidebar, click <strong>Labels</strong> (you may see a <strong>+</strong> icon or <strong>Create label</strong>). Click <strong>Create label</strong>.</li><li>Create a label called <strong>Referral Network</strong>. Click <strong>Save</strong>.</li><li>Create two more labels: <strong>Colleagues</strong> and <strong>Insurance Contacts</strong>.</li><li>To <strong>add contacts to a group</strong>: find a contact by typing their name in the search bar at the top. Click on their name. Click the <strong>Labels</strong> icon (tag icon) and check the group(s) they belong to.</li><li>To <strong>add notes to a contact</strong>: click on the contact\'s name, click <strong>Edit contact</strong> (pencil icon), scroll down to the <strong>Notes</strong> field, and add useful info like &ldquo;Specializes in adolescent DBT&rdquo; or &ldquo;Met at CAMFT conference 2025.&rdquo; Click <strong>Save</strong>.</li><li>Repeat for a few key contacts in each group.</li></ol><div class="expected-result">&checkmark; Expected result: Three contact groups are set up in Google Contacts with relevant people assigned to each. Key contacts have notes with helpful context. You can now click any label in the sidebar to see just that group of contacts.</div>';

EXERCISE_HELP['4-4'] = '<strong>Goal:</strong> Get comfortable with Zoom\'s essential features before your next telehealth session or meeting.<ol><li>Open <strong>Zoom</strong> (if not installed, download it from <strong>zoom.us/download</strong>). Sign in to your account.</li><li>Click <strong>New Meeting</strong> to start a test meeting with yourself. Your camera should turn on and you\'ll see yourself.</li><li>Practice the essential controls along the bottom toolbar:<br/>&bull; <strong>Mute/Unmute</strong>: click the microphone icon (or press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd>). Toggle it a few times.<br/>&bull; <strong>Start/Stop Video</strong>: click the camera icon (or press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>V</kbd>). Toggle it on and off.<br/>&bull; <strong>Speaker View vs. Gallery View</strong>: click <strong>View</strong> in the top-right corner of the Zoom window. Switch between <strong>Speaker</strong> (shows the active speaker large) and <strong>Gallery</strong> (shows everyone in a grid).</li><li>Practice <strong>Screen Share</strong>: click the <strong>Share Screen</strong> button (green icon with an arrow) in the bottom toolbar. Choose <strong>Desktop</strong> to share your whole screen, or choose a specific window. Click <strong>Share</strong>. You\'ll see a green border around what\'s being shared. Click <strong>Stop Share</strong> (red button at the top) when done.</li><li>End the meeting by clicking <strong>End</strong> (bottom-right) &rarr; <strong>End Meeting for All</strong>.</li></ol><div class="expected-result">&checkmark; Expected result: You\'ve practiced muting/unmuting, toggling video, switching views, and screen sharing &mdash; all in a low-pressure test meeting with no one else watching. You\'ll feel much more confident in your next telehealth session.</div>';

EXERCISE_HELP['4-5'] = '<strong>Goal:</strong> Make a FaceTime video call from your Mac &mdash; great for quick, secure calls with colleagues who also use Apple devices.<ol><li>Open <strong>FaceTime</strong> (<kbd>&#8984;</kbd>+<kbd>Space</kbd>, type <strong>FaceTime</strong>, press <kbd>Return</kbd>).</li><li>If this is your first time, make sure you\'re signed in with your Apple ID. FaceTime should show your name at the top.</li><li>In the search field at the top, type the <strong>name</strong>, <strong>email address</strong>, or <strong>phone number</strong> of someone you\'d like to call (try a family member or colleague who has an iPhone or Mac).</li><li>Click the <strong>FaceTime</strong> button (video icon) to start a video call. Wait for them to answer.</li><li>While on the call, try <strong>full-screen mode</strong>: click the <strong>green button</strong> in the top-left corner of the FaceTime window (or press <kbd>Control</kbd>+<kbd>&#8984;</kbd>+<kbd>F</kbd>). This makes the video fill your entire screen &mdash; much more immersive.</li><li>To exit full-screen, move your mouse to the top of the screen and click the green button again, or press <kbd>Esc</kbd>.</li><li>End the call by clicking the <strong>red end-call button</strong>.</li></ol><div class="expected-result">&checkmark; Expected result: You\'ve made a FaceTime call from your Mac and tried full-screen mode. FaceTime is end-to-end encrypted and a great option for quick, informal video calls with anyone who has an Apple device.</div>';

EXERCISE_HELP['4-6'] = '<strong>Goal:</strong> Fine-tune your Gmail settings for a more professional and efficient email experience.<ol><li>In <strong>Gmail</strong>, click the <strong>gear icon</strong> &#9881; in the top-right, then click <strong>See all settings</strong>.</li><li>You\'re now on the <strong>General</strong> tab. Scroll down and configure these settings:<br/>&bull; <strong>Undo Send</strong>: Find &ldquo;Undo Send&rdquo; and change the cancellation period to <strong>30 seconds</strong> (the maximum). This gives you 30 seconds to &ldquo;unsend&rdquo; an email if you notice a mistake.<br/>&bull; <strong>Default reply behavior</strong>: Set to <strong>Reply</strong> (not Reply All) to avoid accidentally emailing an entire group.<br/>&bull; <strong>Signature</strong>: Scroll to the &ldquo;Signature&rdquo; section. Click <strong>Create new</strong>. Type your professional signature, such as:<br/><em>David [Last Name], LMFT, LADT<br/>[Practice Name]<br/>[Phone Number]</em><br/>Click <strong>Save Changes</strong> at the bottom.</li><li>Click the <strong>Labels</strong> tab at the top. Review your labels. You can choose to <strong>show</strong> or <strong>hide</strong> labels in your sidebar by clicking &ldquo;show&rdquo; or &ldquo;hide&rdquo; next to each one. Hide any default labels you don\'t use.</li><li>Click the <strong>Filters and Blocked Addresses</strong> tab to review the filters you created earlier. You can edit or delete them from here.</li><li>Don\'t forget to click <strong>Save Changes</strong> at the bottom of any tab where you made changes.</li></ol><div class="expected-result">&checkmark; Expected result: Your Gmail now has a 30-second undo window, a professional email signature, sensible default reply behavior, and a clean sidebar. These small tweaks add up to a much more professional email experience.</div>';

// ------ WEEK 5: Microsoft Office Essentials ------

EXERCISE_HELP['5-0'] = '<strong>Goal:</strong> Create a professional treatment plan template in Microsoft Word that you can reuse for every client.<ol><li>Open <strong>Microsoft Word</strong> (click it in your Dock, or use Spotlight: <kbd>&#8984;</kbd>+<kbd>Space</kbd>, type <strong>Word</strong>).</li><li>Click <strong>Blank Document</strong> to create a new file (or press <kbd>&#8984;</kbd>+<kbd>N</kbd>).</li><li>At the top, type your practice name in bold (<kbd>&#8984;</kbd>+<kbd>B</kbd>), then press <kbd>Return</kbd> and type <strong>TREATMENT PLAN</strong>.</li><li>Now create the template sections. For each section heading, type the text, then select it and choose <strong>Heading 1</strong> from the <strong>Styles</strong> group in the Home tab (it\'s in the toolbar ribbon at the top). Create these headings:<br/>&bull; <strong>Client Information</strong> &mdash; then add placeholder text below: &ldquo;Client ID: ___ &rdquo; &ldquo;Date: ___&rdquo;<br/>&bull; <strong>Presenting Problem</strong> &mdash; add a few blank lines for notes<br/>&bull; <strong>Treatment Goals</strong> &mdash; add numbered placeholders: &ldquo;1. &rdquo; &ldquo;2. &rdquo; &ldquo;3. &rdquo;<br/>&bull; <strong>Objectives</strong><br/>&bull; <strong>Interventions</strong><br/>&bull; <strong>Duration of Treatment</strong><br/>&bull; <strong>Review Date</strong></li><li>To <strong>save as a template</strong>: go to <strong>File</strong> &rarr; <strong>Save as Template&hellip;</strong>. Name it <strong>Treatment Plan Template</strong>. It will be saved in Word\'s template location. Next time you create a new document, you\'ll find it under <strong>File</strong> &rarr; <strong>New from Template</strong>.</li></ol><div class="expected-result">&checkmark; Expected result: A professional-looking treatment plan template is saved in Word. Each section has a proper heading style, making it easy to read and navigate. You can reuse this for every new client by opening it as a template.</div>';

EXERCISE_HELP['5-1'] = '<strong>Goal:</strong> Practice essential Word formatting skills and add a professional header with your credentials.<ol><li>Open the Treatment Plan Template you created (or create a new document in <strong>Word</strong>).</li><li>Practice <strong>heading styles</strong>: select the document title and apply <strong>Heading 1</strong> (from the Styles group in the Home tab). Select section titles and apply <strong>Heading 2</strong>. These styles create a visual hierarchy and look much more professional than just making text bigger.</li><li>Practice <strong>bold text</strong>: select any word and press <kbd>&#8984;</kbd>+<kbd>B</kbd>. Practice <strong>bullet lists</strong>: place your cursor on a new line, then click the <strong>bulleted list</strong> icon in the Home tab toolbar (it looks like three dots with lines), or press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd>.</li><li>Add a <strong>header with your credentials</strong>: go to <strong>Insert</strong> menu (in the ribbon at the top) &rarr; <strong>Header</strong> &rarr; click <strong>Edit Header</strong>. Type: <em>David [Last Name], LMFT, LADT</em>. Click in the document body to close the header.</li><li>Add a <strong>footer with page numbers</strong>: go to <strong>Insert</strong> &rarr; <strong>Footer</strong> &rarr; click <strong>Edit Footer</strong>. Then in the Insert menu (while in footer editing mode), click <strong>Page Number</strong>. Choose a centered or right-aligned style. Click in the document body to close the footer.</li></ol><div class="expected-result">&checkmark; Expected result: Your document has properly styled headings (Heading 1 and 2), bold text, bulleted lists, a header with your credentials on every page, and page numbers in the footer. This is exactly how a polished clinical document should look.</div>';

EXERCISE_HELP['5-2'] = '<strong>Goal:</strong> Create a CE Hours Tracker spreadsheet in Excel to keep track of your continuing education progress.<ol><li>Open <strong>Microsoft Excel</strong> (from your Dock or Spotlight).</li><li>Click <strong>Blank Workbook</strong> to create a new spreadsheet.</li><li>Set up your column headers in <strong>Row 1</strong>. Click on cell <strong>A1</strong> and type each header, pressing <kbd>Tab</kbd> to move to the next column:<br/>&bull; A1: <strong>Date</strong><br/>&bull; B1: <strong>Course Title</strong><br/>&bull; C1: <strong>Provider</strong><br/>&bull; D1: <strong>Hours</strong><br/>&bull; E1: <strong>Category</strong></li><li>Make the headers <strong>bold</strong>: select cells A1 through E1 (click A1, hold <kbd>Shift</kbd>, click E1), then press <kbd>&#8984;</kbd>+<kbd>B</kbd>.</li><li>Enter <strong>3 real or practice courses</strong> in rows 2, 3, and 4. For example:<br/>&bull; Row 2: 01/15/2026 | Ethics in Telehealth | PESI | 6 | Ethics<br/>&bull; Row 3: 03/10/2026 | Trauma-Informed Care | Zur Institute | 12 | Clinical<br/>&bull; Row 4: 05/20/2026 | Motivational Interviewing | CAMFT | 3 | Clinical</li><li>In cell <strong>D5</strong>, type the formula <strong>=SUM(D2:D4)</strong> and press <kbd>Return</kbd>. This adds up all your hours. In cell C5, type <strong>Total Hours:</strong> to label it.</li><li>Save the file: <kbd>&#8984;</kbd>+<kbd>S</kbd>. Name it <strong>CE Hours Tracker</strong> and save it in your <strong>Practice &rarr; CE Materials</strong> folder.</li></ol><div class="expected-result">&checkmark; Expected result: An Excel spreadsheet shows your CE courses in organized columns with a SUM formula totaling your hours. As you add more courses throughout the year, the total updates automatically. This makes license renewal reporting much easier.</div>';

EXERCISE_HELP['5-3'] = '<strong>Goal:</strong> Practice additional Excel formulas to analyze your CE data &mdash; building confidence with spreadsheet basics.<ol><li>Open your <strong>CE Hours Tracker</strong> spreadsheet in Excel.</li><li>Click on a cell below your data (try cell <strong>D7</strong>). Type: <strong>=AVERAGE(D2:D4)</strong> and press <kbd>Return</kbd>. This calculates the <strong>average hours per course</strong>. In cell C7, type <strong>Avg Hours/Course:</strong> to label it.</li><li>Click on cell <strong>D8</strong>. Type: <strong>=COUNT(D2:D4)</strong> and press <kbd>Return</kbd>. This counts the <strong>total number of courses</strong> (it counts cells that contain numbers). In cell C8, type <strong>Total Courses:</strong> to label it.</li><li><strong>Label your cells clearly</strong> &mdash; this is good spreadsheet practice. Anyone looking at your spreadsheet (including future you) should immediately understand what each number means.</li><li><strong>Bonus:</strong> Try one more formula. In cell D9, type: <strong>=MAX(D2:D4)</strong> to find your longest course. Label cell C9 as <strong>Longest Course (hrs):</strong>.</li><li>Format the Average to show one decimal place: click cell D7, then go to the <strong>Home</strong> tab and click the <strong>Decrease Decimal</strong> button (looks like .0 &rarr; .00 with an arrow) until you see one decimal place.</li><li>Save your changes: <kbd>&#8984;</kbd>+<kbd>S</kbd>.</li></ol><div class="expected-result">&checkmark; Expected result: Your spreadsheet now shows the average hours per course, total number of courses, and longest course &mdash; all calculated automatically with formulas. Each result is clearly labeled. You\'re already doing more with Excel than most people!</div>';

EXERCISE_HELP['5-4'] = '<strong>Goal:</strong> Create a brief PowerPoint presentation on a treatment approach you know well.<ol><li>Open <strong>Microsoft PowerPoint</strong> (from your Dock or Spotlight). Click <strong>Blank Presentation</strong>.</li><li><strong>Slide 1 &mdash; Title Slide:</strong> Click on &ldquo;Click to add title&rdquo; and type the name of a treatment approach you use (e.g., <strong>Cognitive Behavioral Therapy</strong> or <strong>Motivational Interviewing</strong>). In the subtitle area, type your name and credentials: <em>David [Last Name], LMFT, LADT</em>.</li><li><strong>Slide 2 &mdash; Overview:</strong> Click <strong>New Slide</strong> in the Home tab (or press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>). Add a title like <strong>&ldquo;What Is [Approach]?&rdquo;</strong> and add 3-4 bullet points describing the approach.</li><li><strong>Slide 3 &mdash; Key Techniques:</strong> Add another new slide. Title it <strong>&ldquo;Key Techniques&rdquo;</strong> and list 3-4 techniques used in this approach.</li><li><strong>Slide 4 &mdash; With an Image:</strong> Add a new slide. Go to <strong>Insert</strong> &rarr; <strong>Pictures</strong> &rarr; <strong>Stock Images</strong> (or <strong>Online Pictures</strong>). Search for a relevant image (like &ldquo;therapy&rdquo; or &ldquo;conversation&rdquo;) and insert it. Resize it by dragging a corner handle.</li><li><strong>Slide 5 &mdash; Summary:</strong> Add a final slide with key takeaways or a quote you find meaningful about the approach.</li><li>Save: <kbd>&#8984;</kbd>+<kbd>S</kbd>. Name it something descriptive.</li></ol><div class="expected-result">&checkmark; Expected result: A 3-5 slide PowerPoint presentation with a professional title slide including your credentials, content slides with bullet points, and at least one image. This could be polished into a real presentation for a workshop, training, or consultation group.</div>';

EXERCISE_HELP['5-5'] = '<strong>Goal:</strong> Learn to save documents as PDFs &mdash; the universal format that looks the same on every device and can\'t be easily edited.<ol><li>Open your <strong>Treatment Plan Template</strong> in <strong>Word</strong> (or any Word document you\'ve created).</li><li>Go to <strong>File</strong> &rarr; <strong>Save As&hellip;</strong> (or press <kbd>&#8984;</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>).</li><li>In the Save dialog, click the <strong>File Format</strong> dropdown (near the bottom of the dialog). Select <strong>PDF</strong> from the list.</li><li>Choose where to save it (try your <strong>Practice &rarr; Templates</strong> folder). Click <strong>Save</strong>.</li><li>Now find the PDF in Finder and <strong>double-click</strong> it. It will open in <strong>Preview</strong> (Mac\'s built-in PDF viewer). Notice how it looks exactly like the Word document but can\'t be accidentally edited.</li><li>Now do the same with your <strong>CE Hours Tracker</strong> in Excel: open the file, go to <strong>File</strong> &rarr; <strong>Save As&hellip;</strong>, change the File Format to <strong>PDF</strong>, and save it. Open the resulting PDF in Preview to verify it looks correct.</li><li><strong>When to use PDF:</strong> Always share documents as PDF when you don\'t want the recipient to edit them &mdash; for insurance submissions, client handouts, or emailing forms. Keep the .docx or .xlsx version for yourself so you can make changes later.</li></ol><div class="expected-result">&checkmark; Expected result: You\'ve saved both a Word document and an Excel spreadsheet as PDFs, and verified they look correct in Preview. PDFs are the standard format for sharing professional documents &mdash; you\'ll use this skill constantly.</div>';

EXERCISE_HELP['5-6'] = '<strong>Goal:</strong> Explore Word\'s built-in templates to find professional documents you can customize instead of creating from scratch.<ol><li>Open <strong>Microsoft Word</strong>.</li><li>Go to <strong>File</strong> &rarr; <strong>New from Template&hellip;</strong> (this may also appear on the start screen when you first open Word).</li><li>You\'ll see a template gallery with categories. Browse through what\'s available, or use the <strong>search bar</strong> at the top to search for useful templates. Try searching for:<br/>&bull; <strong>&ldquo;Newsletter&rdquo;</strong> &mdash; useful if you ever want to send a practice newsletter<br/>&bull; <strong>&ldquo;Letter&rdquo;</strong> &mdash; professional letterhead templates<br/>&bull; <strong>&ldquo;Resume&rdquo;</strong> &mdash; just to see what\'s available<br/>&bull; <strong>&ldquo;Invoice&rdquo;</strong> &mdash; could be adapted for private-pay billing</li><li>Click on a template that interests you to see a preview. Click <strong>Create</strong> to open it as a new document you can customize.</li><li>Find <strong>at least 2 templates</strong> that could be useful in your practice. Open each one and take a quick look at the formatting and layout. You don\'t need to fill them in completely &mdash; just get a sense of what\'s available.</li><li>To save a customized template for future use: after making your changes, go to <strong>File</strong> &rarr; <strong>Save as Template&hellip;</strong> and give it a new name.</li></ol><div class="expected-result">&checkmark; Expected result: You\'ve explored Word\'s template gallery and found at least 2 templates that could be useful for your practice. Templates save enormous time &mdash; instead of formatting a document from scratch, you start with a professional design and just fill in your content.</div>';
