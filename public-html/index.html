// ---- WEEK 6: What is AI? — Demystified ----
WEEKS.push({
  num: 6,
  title: 'What is AI? \u2014 Demystified',
  subtitle: 'Understand what artificial intelligence actually is, what it can do, where it falls short, and how to use it responsibly in your professional life.',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'What is AI? \u2014 Demystified',
    sections: [
      {
        heading: 'What AI Actually Is',
        content: '<p>Artificial intelligence sounds like science fiction, but the reality is much simpler \u2014 and much less dramatic. At its core, AI is <strong>pattern recognition</strong>. It is not thinking. It is not conscious. It does not have opinions, feelings, or understanding.</p>' +
          '<p>Here is the best way to think about it: imagine a research assistant who has read millions of books, articles, clinical papers, websites, and documents. This assistant has an extraordinary memory for patterns \u2014 how words tend to follow other words, how ideas connect, how paragraphs are structured. When you ask this assistant a question, it draws on those patterns to generate a response that sounds helpful and knowledgeable.</p>' +
          '<p>But here is the crucial distinction: this assistant has never <em>experienced</em> anything. It has never sat with a patient. It has never felt the weight of a difficult session. It has never had a moment of clinical insight born from decades of practice. It predicts what words should come next based on patterns it learned from text \u2014 nothing more.</p>' +
          '<p>This is important because it shapes how you should use AI: as a <strong>powerful pattern-matching tool</strong> that can synthesize information quickly, but never as a replacement for the human judgment, empathy, and clinical wisdom you bring to your work.</p>'
      },
      {
        heading: 'How Chatbots Work',
        content: '<p>You have probably heard of ChatGPT, Claude, or other AI chatbots. These tools were built by training computer systems on enormous amounts of text from the internet \u2014 books, articles, websites, research papers, and more. Through this training, they learned the patterns of human language: how sentences are constructed, how ideas flow, how different topics connect.</p>' +
          '<p>When you type a question or request, the chatbot generates a response <strong>one word at a time</strong>, choosing each next word based on what is most likely to follow. It is similar to how your phone suggests the next word when you are typing a text message \u2014 except vastly more sophisticated.</p>' +
          '<p>Think of it this way: the chatbot is like an extremely well-read assistant who can draft text on almost any topic, but who has never actually experienced anything it writes about. It can describe what grief therapy looks like because it has processed thousands of texts about it \u2014 but it has never sat across from a grieving client.</p>' +
          '<p>The chatbot does not truly &ldquo;know&rdquo; things the way you know things. It <strong>pattern-matches</strong>. This is why it can sometimes produce remarkably helpful responses and other times produce responses that sound confident but are subtly or even completely wrong. Understanding this distinction is the foundation for using AI wisely.</p>'
      },
      {
        heading: 'ChatGPT vs Claude',
        content: '<p>The two AI chatbots you will hear about most are <strong>ChatGPT</strong> and <strong>Claude</strong>. Both are excellent tools, and both are free to try.</p>' +
          '<p><strong>ChatGPT</strong> was created by a company called OpenAI and launched in late 2022. It quickly became the most well-known AI chatbot in the world. ChatGPT has a wide range of features, including the ability to browse the internet, analyze images, and work with many other apps and services. The free version is quite capable. ChatGPT Plus costs $20 per month and gives you access to the most advanced features.</p>' +
          '<p><strong>Claude</strong> was created by a company called Anthropic. Claude is known for being especially thoughtful, nuanced, and careful in its responses. It tends to produce longer, more detailed answers and is particularly good at writing, research synthesis, and careful analysis. Claude also has a free version. Claude Pro costs $20 per month for heavier use.</p>' +
          '<p>Key differences to keep in mind: Claude tends to be more careful and nuanced in its writing, which makes it particularly well-suited for professional and research tasks. ChatGPT has more integrations with other tools and services. Both are excellent starting points, and you will benefit from trying both to see which feels more natural for different tasks.</p>'
      },
      {
        heading: 'What AI Can and Cannot Do',
        content: '<p>Setting realistic expectations is essential. Here is a clear breakdown of what AI can and cannot do:</p>' +
          '<p><strong>AI CAN:</strong></p>' +
          '<ul>' +
          '<li>Summarize research papers and articles in plain language</li>' +
          '<li>Draft documents, letters, and professional materials</li>' +
          '<li>Brainstorm ideas and generate creative options</li>' +
          '<li>Explain complex concepts in simpler terms</li>' +
          '<li>Compare different approaches, treatments, or frameworks</li>' +
          '<li>Create outlines for workshops, presentations, or written projects</li>' +
          '<li>Translate text between languages</li>' +
          '</ul>' +
          '<p><strong>AI CANNOT:</strong></p>' +
          '<ul>' +
          '<li>Diagnose patients or replace clinical judgment</li>' +
          '<li>Guarantee the accuracy of any information it provides</li>' +
          '<li>Understand emotional nuance the way a therapist does</li>' +
          '<li>Access current, real-time information (it has knowledge cutoff dates)</li>' +
          '<li>Reliably cite specific sources \u2014 it may invent references</li>' +
          '<li>Replace the therapeutic relationship, empathy, or presence</li>' +
          '<li>Make ethical decisions on your behalf</li>' +
          '</ul>' +
          '<p>The bottom line: AI is a remarkably capable <strong>assistant</strong>, but it is not a <strong>colleague</strong>. Your clinical expertise, ethical judgment, and human presence remain irreplaceable.</p>'
      },
      {
        heading: 'Hallucinations \u2014 When AI Gets It Wrong',
        content: '<p>This may be the most important thing to understand about AI: <strong>it sometimes makes things up</strong>. In the AI world, this is called a &ldquo;hallucination.&rdquo; It does not mean the AI is malfunctioning \u2014 it means the pattern-matching process produced something that sounds perfectly plausible but is actually incorrect.</p>' +
          '<p>Here are real examples of what AI hallucinations look like:</p>' +
          '<ul>' +
          '<li>Citing a research paper that does not exist, complete with a convincing title and author names</li>' +
          '<li>Inventing statistics that sound reasonable but have no basis in reality</li>' +
          '<li>Confidently stating a fact that is subtly but importantly wrong</li>' +
          '<li>Creating a biography of a real person with fictional details mixed in</li>' +
          '</ul>' +
          '<p>The danger is that hallucinated information often <em>sounds</em> authoritative and confident. The AI does not say &ldquo;I am not sure about this.&rdquo; It presents fabricated information with the same confidence as accurate information.</p>' +
          '<p>This is why verification is essential. Here is your rule of thumb: <strong>Trust AI for drafts and brainstorming. Verify AI for facts and citations.</strong> If an AI response includes a specific claim, statistic, study, or source \u2014 especially anything you might use in a professional context \u2014 take a moment to verify it independently. This habit will serve you well.</p>'
      },
      {
        heading: 'AI Ethics and Privacy',
        content: '<p>As a licensed therapist, you already have a deep understanding of confidentiality and ethical boundaries. Those same principles apply \u2014 perhaps even more strictly \u2014 when using AI tools.</p>' +
          '<p><strong>The most important rule: NEVER share patient names, session details, or identifying information with AI.</strong> AI conversations may be reviewed by the companies that build these tools, and they may be used to improve future versions. Nothing you type into an AI chatbot should be considered private.</p>' +
          '<p>Here are clear guidelines for ethical AI use in your professional life:</p>' +
          '<ul>' +
          '<li><strong>De-identify everything.</strong> Instead of real names, use descriptions like &ldquo;a client in their 40s&rdquo; or &ldquo;a couple in their second marriage.&rdquo;</li>' +
          '<li><strong>Use hypothetical scenarios</strong> when brainstorming clinical approaches. Frame questions as general cases, not specific clients.</li>' +
          '<li><strong>Never paste session notes</strong> or intake forms into an AI tool.</li>' +
          '<li><strong>Be transparent.</strong> If you use AI to help draft a document, be prepared to acknowledge that in a professional context.</li>' +
          '</ul>' +
          '<p>A helpful test: before typing anything into an AI chatbot, ask yourself, <strong>&ldquo;Would I be comfortable if my licensing board saw this conversation?&rdquo;</strong> If the answer is no, rethink what you are sharing.</p>'
      }
    ],
    tips: [
      { icon: '\u{1F50D}', text: '<strong>Verify everything:</strong> AI is a starting point, not a final authority. Always double-check facts, statistics, and citations before using them in any professional context.' },
      { icon: '\u{1F512}', text: '<strong>Never share identifying information:</strong> Treat AI chatbots like a public conversation. No patient names, case details, or session notes \u2014 ever.' },
      { icon: '\u{1F6E0}\uFE0F', text: '<strong>AI is a tool, not a colleague:</strong> Think of AI the way you think of a reference book or a research database \u2014 incredibly useful, but it does not replace your professional judgment.' },
      { icon: '\u{1F476}', text: '<strong>Start with low-stakes tasks:</strong> Begin by asking AI about general topics you already know well. This helps you calibrate how accurate and useful its responses are before relying on it for anything important.' }
    ],
    videos: [
      { title: 'What is AI? \u2014 Explained Simply', url: 'https://www.youtube.com/results?search_query=what+is+AI+explained+simply+for+beginners', duration: 'Search for latest' },
      { title: 'AI for Beginners \u2014 Complete Overview', url: 'https://www.youtube.com/results?search_query=artificial+intelligence+for+beginners+explained', duration: 'Search for latest' }
    ]
  },
  exercises: [
    { text: 'In your own words, write down what AI is and how it works. Keep it to 2\u20133 sentences \u2014 as if explaining it to a friend over coffee.', xp: 25 },
    { text: 'Make a list of 5 things you would genuinely want AI to help you with in your professional or personal life.', xp: 25 },
    { text: 'Ask a friend or colleague what they think AI can do. Note where their understanding differs from what you learned today.', xp: 20 },
    { text: 'Identify 3 specific examples of things AI <strong>cannot</strong> do in therapy \u2014 tasks that require human judgment, empathy, or presence.', xp: 40 },
    { text: 'Find a news article about an AI hallucination or AI getting something wrong. Note what happened and why it matters.', xp: 25 },
    { text: 'Write 3 personal rules for yourself about AI and privacy in your practice. Keep these somewhere you can refer to them.', xp: 30 },
    { text: 'Explain to someone \u2014 a colleague, friend, or family member \u2014 what a &ldquo;hallucination&rdquo; means in the context of AI.', xp: 20 },
    { text: 'List the ethical boundaries you will maintain when using AI in any capacity related to your practice.', xp: 15 }
  ],
  bonus: 'Write a one-paragraph &ldquo;AI Philosophy Statement&rdquo; for yourself \u2014 how you plan to think about and use AI in your professional life, including your values around accuracy, privacy, and the irreplaceable role of the human therapist.',
  achievementTrigger: { id: 'ai-aware', exerciseIndex: 3 }
});

// ---- WEEK 7: Your First AI Conversations ----
WEEKS.push({
  num: 7,
  title: 'Your First AI Conversations',
  subtitle: 'Set up ChatGPT and Claude, learn to ask effective questions, and discover how the quality of your prompts shapes the quality of AI responses.',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'Your First AI Conversations',
    sections: [
      {
        heading: 'Setting Up ChatGPT',
        content: '<p>Let\u2019s get you set up with your first AI tool. <strong>ChatGPT</strong> is the most widely used AI chatbot in the world, and setting it up takes just a few minutes.</p>' +
          '<p><strong>On your Mac:</strong></p>' +
          '<ol>' +
          '<li>Open Safari and go to <strong>chatgpt.com</strong></li>' +
          '<li>Click <strong>Sign Up</strong> in the upper right corner</li>' +
          '<li>Create an account using your email address and a password, or sign in with your Google (Gmail) account for convenience</li>' +
          '<li>Verify your email if prompted</li>' +
          '</ol>' +
          '<p>Once you are logged in, here is what you will see: a <strong>message box at the bottom</strong> of the screen where you type your questions, a <strong>sidebar on the left</strong> showing your previous conversations, and a <strong>New Chat button</strong> to start fresh conversations on new topics.</p>' +
          '<p><strong>On your iPhone:</strong> Open the App Store, search for &ldquo;ChatGPT&rdquo; by OpenAI, and download the free app. Sign in with the same account you just created.</p>' +
          '<p>The free version of ChatGPT is more than enough to get started. You do not need to pay for anything right now. Simply type a question in the message box and press Return to begin your first conversation.</p>'
      },
      {
        heading: 'Setting Up Claude',
        content: '<p>Now let\u2019s set up <strong>Claude</strong>, the other major AI chatbot. Many professionals prefer Claude for research and writing tasks because of its careful, nuanced responses.</p>' +
          '<p><strong>On your Mac:</strong></p>' +
          '<ol>' +
          '<li>Open Safari and go to <strong>claude.ai</strong></li>' +
          '<li>Click <strong>Sign Up</strong></li>' +
          '<li>Create an account with your email address, or sign in with your Google account</li>' +
          '<li>Verify your email if prompted</li>' +
          '</ol>' +
          '<p>Claude\u2019s interface is clean and focused. You will see a <strong>message box</strong> at the bottom for typing, a <strong>conversation list</strong> on the left sidebar, and a button to start a <strong>new conversation</strong>. The layout is intentionally simple and uncluttered.</p>' +
          '<p><strong>On your iPhone:</strong> Search the App Store for &ldquo;Claude&rdquo; by Anthropic and download the free app. Sign in with the same account.</p>' +
          '<p>Like ChatGPT, Claude\u2019s free version is fully functional and a great place to start. Having accounts on both platforms lets you compare them and discover which one you prefer for different kinds of tasks. There is no commitment \u2014 try both and see what feels most natural to you.</p>'
      },
      {
        heading: 'How to Ask Good Questions',
        content: '<p>Here is the single most important skill for getting value from AI: <strong>the quality of your question determines the quality of the answer.</strong> This will feel familiar to you as a therapist \u2014 you already know that how you frame a question shapes the conversation.</p>' +
          '<p>The same principle applies with AI. Compare these two approaches:</p>' +
          '<p><strong>Vague:</strong> &ldquo;Tell me about anxiety.&rdquo;<br>This will give you a generic, textbook-level overview that probably is not useful.</p>' +
          '<p><strong>Specific:</strong> &ldquo;Summarize the three most common evidence-based treatments for generalized anxiety disorder in adults, including the strength of evidence for each.&rdquo;<br>This gives you something you can actually use.</p>' +
          '<p>Three principles for better questions:</p>' +
          '<ul>' +
          '<li><strong>Be specific.</strong> The more precise your question, the more useful the answer. Include details about what exactly you are looking for.</li>' +
          '<li><strong>Provide context.</strong> Tell the AI who you are and why you are asking. &ldquo;I\u2019m a licensed therapist looking for...&rdquo; produces better results than a bare question.</li>' +
          '<li><strong>State the format you want.</strong> Ask for &ldquo;bullet points,&rdquo; &ldquo;a comparison table,&rdquo; &ldquo;200 words or less,&rdquo; or &ldquo;written for a patient at an 8th grade reading level.&rdquo;</li>' +
          '</ul>' +
          '<p>You will be surprised at how much better AI responses become when you simply ask more specifically.</p>'
      },
      {
        heading: 'Prompting Fundamentals',
        content: '<p>Professionals who use AI regularly often follow a simple framework to structure their requests. One popular approach is the <strong>RICE framework</strong>:</p>' +
          '<ul>' +
          '<li><strong>R \u2014 Role:</strong> Tell the AI who to be. &ldquo;You are a neuroscience research assistant&rdquo; or &ldquo;You are a continuing education advisor for therapists.&rdquo;</li>' +
          '<li><strong>I \u2014 Instructions:</strong> Be specific about what you want. &ldquo;Summarize the key findings of...&rdquo; or &ldquo;Compare these two approaches...&rdquo;</li>' +
          '<li><strong>C \u2014 Context:</strong> Provide background information. &ldquo;I am a licensed MFT with 40 years of experience interested in neuroplasticity research.&rdquo;</li>' +
          '<li><strong>E \u2014 Examples:</strong> Show the format you want. &ldquo;Format your response as a table with columns for Approach, Evidence Base, and Best-Suited Population.&rdquo;</li>' +
          '</ul>' +
          '<p>Here is an example using RICE for a therapy-relevant topic:</p>' +
          '<p><em>&ldquo;You are a neuroscience research assistant. Summarize the three most significant recent findings about neuroplasticity and trauma recovery. I am a licensed therapist looking for practical implications I can discuss with patients. Present each finding with: the discovery, why it matters clinically, and one way I might reference it in a session.&rdquo;</em></p>' +
          '<p>You do not need to use RICE every time \u2014 but for important questions, it consistently produces much better results. Think of it as giving the AI enough information to give you a truly useful answer.</p>'
      },
      {
        heading: 'Getting Better Answers',
        content: '<p>One of the most powerful things about AI conversations is that you can <strong>follow up</strong>. If the first response is not quite what you need, you do not have to start over. You can guide the AI toward a better answer, much like you might guide a conversation in a session.</p>' +
          '<p>Here are follow-up phrases that consistently improve AI responses:</p>' +
          '<ul>' +
          '<li><strong>&ldquo;Can you explain that more simply?&rdquo;</strong> \u2014 Strips away jargon and complexity</li>' +
          '<li><strong>&ldquo;Give me a real-world example.&rdquo;</strong> \u2014 Makes abstract concepts concrete</li>' +
          '<li><strong>&ldquo;What are the limitations of this approach?&rdquo;</strong> \u2014 Gets the balanced perspective you need for clinical decisions</li>' +
          '<li><strong>&ldquo;Rewrite that for a patient at an 8th grade reading level.&rdquo;</strong> \u2014 Perfect for creating patient-facing materials</li>' +
          '<li><strong>&ldquo;What research supports this?&rdquo;</strong> \u2014 Asks for evidence (but always verify the citations)</li>' +
          '<li><strong>&ldquo;Can you present that as a numbered list?&rdquo;</strong> \u2014 Organizes information for easier reading</li>' +
          '</ul>' +
          '<p>Think of your AI conversation as iterative. Your first question gets you in the neighborhood. Your follow-up questions get you to the exact address. The best AI users do not write one perfect question \u2014 they have a brief back-and-forth conversation to refine the response until it is exactly what they need.</p>' +
          '<p>Remember: always verify any specific claims, especially research citations. AI can generate convincing-sounding references that do not actually exist.</p>'
      },
      {
        heading: 'What NOT to Share with AI',
        content: '<p>Before you begin using AI in any professional capacity, let\u2019s establish clear boundaries about what should never go into an AI conversation. As a therapist, you understand the weight of confidentiality \u2014 these same principles apply here.</p>' +
          '<p><strong>Never share with AI:</strong></p>' +
          '<ul>' +
          '<li>Real patient names or identifying details</li>' +
          '<li>Session notes, intake forms, or treatment records</li>' +
          '<li>Specific case details that could identify a client</li>' +
          '<li>Insurance information, dates of service, or billing details tied to individuals</li>' +
          '</ul>' +
          '<p><strong>Instead, use these safer approaches:</strong></p>' +
          '<ul>' +
          '<li>Refer to &ldquo;a client in their 40s experiencing...&rdquo; instead of using names</li>' +
          '<li>Describe general scenarios: &ldquo;When working with someone who presents with...&rdquo;</li>' +
          '<li>Use hypothetical cases for brainstorming: &ldquo;Imagine a client who...&rdquo;</li>' +
          '<li>Ask about categories rather than individuals: &ldquo;What approaches work well for adults with co-occurring anxiety and substance use?&rdquo;</li>' +
          '</ul>' +
          '<p>These are not just good practices \u2014 they are essential for maintaining the ethical standards that define your profession. The information you type into AI tools is not guaranteed to be private. Treat every AI conversation as if it could be read by anyone. With de-identified, hypothetical framing, you can still get tremendous value from AI while protecting your clients completely.</p>'
      }
    ],
    tips: [
      { icon: '\u{1F331}', text: '<strong>Start simple:</strong> Your first AI conversations should be about topics you already know well. This helps you gauge accuracy and build confidence before tackling unfamiliar territory.' },
      { icon: '\u{1F4C8}', text: '<strong>Build complexity gradually:</strong> Start with straightforward questions, then try the RICE framework. As you get comfortable, your prompts will naturally become more effective.' },
      { icon: '\u2696\uFE0F', text: '<strong>Compare both tools:</strong> Ask the same question to ChatGPT and Claude. Notice the differences in tone, depth, and structure. This helps you understand when to use each one.' },
      { icon: '\u2705', text: '<strong>Always verify clinical claims:</strong> If AI mentions a specific study, treatment protocol, or statistic, take 30 seconds to verify it with a quick search. This habit protects you professionally.' }
    ],
    videos: [
      { title: 'How to Use ChatGPT \u2014 Beginner\u2019s Guide', url: 'https://www.youtube.com/results?search_query=how+to+use+ChatGPT+beginner+tutorial+2024', duration: 'Search for latest' },
      { title: 'Claude AI Tutorial \u2014 Getting Started', url: 'https://www.youtube.com/results?search_query=Claude+AI+tutorial+getting+started+beginners', duration: 'Search for latest' }
    ]
  },
  exercises: [
    { text: 'Create a free ChatGPT account at <strong>chatgpt.com</strong> and have your first conversation. Ask it something you are curious about \u2014 a neuroscience topic, a book recommendation, or anything that interests you.', xp: 30 },
    { text: 'Create a free Claude account at <strong>claude.ai</strong> and have your first conversation. Try asking it the same kind of question you asked ChatGPT.', xp: 30 },
    { text: 'Ask the <strong>same question</strong> to both ChatGPT and Claude. Compare the responses: Which was more detailed? More nuanced? More practical? Write a few notes about the differences.', xp: 30 },
    { text: 'Write a prompt using the <strong>RICE framework</strong> (Role, Instructions, Context, Examples) about a therapy-related topic that interests you. Test it in either ChatGPT or Claude.', xp: 40 },
    { text: 'Ask AI to explain a neuroscience concept in simple, everyday language \u2014 for example, &ldquo;Explain neuroplasticity as if you were talking to someone with no science background.&rdquo;', xp: 25 },
    { text: 'Practice <strong>follow-up questions</strong>: Ask AI something, then ask it to simplify, expand, give an example, or reformat. Notice how the response improves with each follow-up.', xp: 20 },
    { text: 'Ask AI to create a <strong>comparison table</strong> of two treatment approaches you use in your practice (for example, CBT vs. EMDR, or motivational interviewing vs. 12-step facilitation).', xp: 25 }
  ],
  bonus: 'Have a 10-minute AI conversation where you explore a topic you are deeply interested in \u2014 neuroscience, treatment innovation, spiritual development, or anything else. Use follow-up questions to go deeper. Save or print the conversation so you can review it later.',
  achievementTrigger: { id: 'first-chat', exerciseIndex: 3 }
});

// ---- WEEK 8: AI for Your Therapy Practice ----
WEEKS.push({
  num: 8,
  title: 'AI for Your Therapy Practice',
  subtitle: 'Discover practical ways to use AI as a research assistant, writing helper, and brainstorming partner \u2014 all while maintaining the ethical standards of your profession.',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'AI for Your Therapy Practice',
    sections: [
      {
        heading: 'AI as Research Assistant',
        content: '<p>One of the most powerful and immediately useful applications of AI for your work is as a <strong>research assistant</strong>. You can ask AI to summarize research findings, explain complex neuroscience concepts, and compare different treatment protocols \u2014 all in plain, accessible language.</p>' +
          '<p>Here are example prompts you can try right now:</p>' +
          '<ul>' +
          '<li>&ldquo;Summarize recent research on neuroplasticity and trauma recovery. Focus on findings with practical implications for clinical therapy.&rdquo;</li>' +
          '<li>&ldquo;Compare EMDR and CBT for PTSD treatment. Include the evidence base, typical session structure, and which patient populations respond best to each.&rdquo;</li>' +
          '<li>&ldquo;What does current neuroscience research say about the relationship between attachment patterns and addiction?&rdquo;</li>' +
          '</ul>' +
          '<p>This is particularly valuable for staying current on advances in your areas of interest \u2014 neuroscience, treatment models, the science of emotional safety and patient trust. Instead of spending hours reading dense research papers, you can ask AI to give you the key findings and their clinical implications in minutes.</p>' +
          '<p><strong>Important reminder:</strong> Always verify specific claims, study names, and statistics. AI is excellent for getting oriented to a topic and understanding the landscape of research, but you should confirm any specific facts before citing them professionally.</p>'
      },
      {
        heading: 'AI as Writing Helper',
        content: '<p>If you have ever stared at a blank page trying to draft a treatment plan template, a letter to a referral source, or a workshop outline, AI can help tremendously. The key insight is this: <strong>AI creates the first draft; you refine it with your clinical expertise.</strong></p>' +
          '<p>Here are practical ways to use AI for professional writing:</p>' +
          '<ul>' +
          '<li><strong>Treatment plan templates:</strong> &ldquo;Create a treatment plan template for an adult client presenting with co-occurring generalized anxiety disorder and alcohol use disorder. Include sections for presenting concerns, treatment goals, interventions, and progress measures.&rdquo;</li>' +
          '<li><strong>Professional letters:</strong> &ldquo;Draft a professional letter to a referral source introducing my practice. I am a licensed MFT and LADT with over 40 years of experience specializing in substance use treatment and family therapy.&rdquo;</li>' +
          '<li><strong>CE summaries:</strong> &ldquo;I just completed a continuing education course on motivational interviewing advances. Help me write a one-page summary of key takeaways for my professional records.&rdquo;</li>' +
          '<li><strong>Workshop outlines:</strong> &ldquo;Create an outline for a 90-minute workshop on building emotional safety in the therapeutic relationship, aimed at early-career therapists.&rdquo;</li>' +
          '</ul>' +
          '<p>In every case, think of the AI output as a <strong>starting point</strong>. Read it carefully, revise it with your professional voice and knowledge, and make it your own. The AI handles the blank-page problem; you ensure the final product reflects your expertise and standards.</p>'
      },
      {
        heading: 'AI for Continuing Education',
        content: '<p>Continuing education is a lifelong commitment in your field, and AI can make the process more efficient and engaging. Here are several ways AI can enhance your CE experience:</p>' +
          '<p><strong>Summarize journal articles:</strong> If you have a long research paper to read, try pasting the abstract (or the key sections) into AI and asking: &ldquo;Explain the key findings of this research and their implications for clinical practice with adult clients.&rdquo; This gives you a clear overview before you dive into the full paper.</p>' +
          '<p><strong>Create study guides:</strong> After reading a book or completing a course, ask AI to create review questions: &ldquo;I just read about polyvagal theory. Create 10 review questions that test my understanding of the key concepts and their clinical applications.&rdquo;</p>' +
          '<p><strong>Deepen understanding:</strong> If a concept is not clicking, ask AI to explain it differently: &ldquo;I understand the basics of polyvagal theory, but I\u2019m struggling with the concept of the social engagement system. Can you explain it with clinical examples?&rdquo;</p>' +
          '<p><strong>Connect ideas:</strong> Ask AI to help you see relationships between concepts: &ldquo;How does attachment theory connect to the neuroscience of addiction? Help me understand the overlapping mechanisms.&rdquo;</p>' +
          '<p>AI makes continuing education more interactive. Instead of passively reading, you can have a dialogue about the material, test your understanding, and explore connections between ideas \u2014 much like having a thoughtful study partner.</p>'
      },
      {
        heading: 'AI for Patient Materials',
        content: '<p>Creating clear, accessible materials for patients is one of the areas where AI truly shines. You can generate psychoeducation handouts, skill-building worksheets, and session preparation materials \u2014 all tailored to specific topics and reading levels.</p>' +
          '<p>Try prompts like these:</p>' +
          '<ul>' +
          '<li>&ldquo;Create a patient-friendly handout about anxiety management techniques. Use simple language at an 8th grade reading level. Include 3\u20135 practical steps the person can take today.&rdquo;</li>' +
          '<li>&ldquo;Design a grounding exercise worksheet for a client who experiences dissociation. Include clear, step-by-step instructions.&rdquo;</li>' +
          '<li>&ldquo;Write a brief explanation of what therapy will look like for a new client who has never been in therapy before. Make it warm and reassuring.&rdquo;</li>' +
          '<li>&ldquo;Create a list of healthy coping strategies for someone in early recovery from alcohol use disorder. Use encouraging, non-clinical language.&rdquo;</li>' +
          '</ul>' +
          '<p>A few important guidelines for patient materials:</p>' +
          '<ul>' +
          '<li><strong>Always review for accuracy</strong> before sharing anything with a client</li>' +
          '<li><strong>Customize</strong> the material to fit the specific client and your therapeutic approach</li>' +
          '<li><strong>Adjust the tone</strong> to match your clinical style \u2014 the AI draft is just a starting point</li>' +
          '<li><strong>Add your own examples</strong> and insights from your clinical experience</li>' +
          '</ul>' +
          '<p>These materials can save you significant preparation time while ensuring your clients have clear, professional resources to support their work between sessions.</p>'
      },
      {
        heading: 'AI as Brainstorming Partner',
        content: '<p>Some of the most valuable AI conversations are not about getting a specific answer \u2014 they are about <strong>generating ideas</strong>. When you are preparing for a session, designing an intervention, or thinking through a clinical challenge, AI can serve as a creative brainstorming partner.</p>' +
          '<p>Here are examples of brainstorming prompts:</p>' +
          '<ul>' +
          '<li>&ldquo;What are 5 creative approaches for building therapeutic alliance with a resistant adult client who has been mandated into treatment?&rdquo;</li>' +
          '<li>&ldquo;Suggest 3 experiential exercises I could use in a couples therapy session to help partners practice active listening.&rdquo;</li>' +
          '<li>&ldquo;I work with clients in substance use recovery. What are some ways to incorporate mindfulness without using language that feels overly spiritual or unfamiliar?&rdquo;</li>' +
          '<li>&ldquo;Generate 5 discussion prompts for a therapy group focused on emotional regulation skills.&rdquo;</li>' +
          '</ul>' +
          '<p>The key principle: <strong>AI provides starting points; your clinical judgment selects and refines.</strong> You will likely find that some suggestions are excellent, some need modification, and some are not appropriate for your specific situation. That is perfectly normal and expected. The value is in having a variety of ideas to work with rather than starting from scratch.</p>' +
          '<p>Think of it like brainstorming with a well-informed colleague who can generate many ideas quickly. You bring the clinical wisdom to evaluate which ideas deserve further development.</p>'
      },
      {
        heading: 'Ethical Use of AI in Practice',
        content: '<p>Now that you have seen the many ways AI can support your practice, let\u2019s draw clear ethical lines about when AI assistance is appropriate and when it is not.</p>' +
          '<p><strong>AI assistance is appropriate for:</strong></p>' +
          '<ul>' +
          '<li>Drafting document templates that you will review and customize</li>' +
          '<li>Summarizing research to stay current on advances in your field</li>' +
          '<li>Creating educational materials that you will review for accuracy</li>' +
          '<li>Brainstorming intervention ideas that you will evaluate with clinical judgment</li>' +
          '<li>Generating workshop or presentation content that you will refine</li>' +
          '<li>Exploring &ldquo;what if&rdquo; clinical scenarios using de-identified, hypothetical cases</li>' +
          '</ul>' +
          '<p><strong>AI assistance is NOT appropriate for:</strong></p>' +
          '<ul>' +
          '<li>Making clinical decisions about specific patients</li>' +
          '<li>Diagnosing conditions or recommending treatment without human review</li>' +
          '<li>Replacing supervision, consultation, or peer review</li>' +
          '<li>Generating documentation for specific clients without thorough review</li>' +
          '<li>Any interaction that involves sharing identifiable patient information</li>' +
          '</ul>' +
          '<p>Your role as the clinical professional remains central. AI enhances your capacity; it does not replace it. Think of it this way: AI might help you draft a beautiful treatment plan template, but <strong>you</strong> are the one who understands the specific client sitting in front of you, the nuances of their history, the dynamics of the therapeutic relationship, and the clinical judgment required to guide their care.</p>' +
          '<p>When in doubt, ask: &ldquo;Am I using AI to enhance my professional work, or am I using it to bypass my professional responsibility?&rdquo; The answer should always be the former.</p>'
      }
    ],
    tips: [
      { icon: '\u{1F50E}', text: '<strong>Always review AI output before using it clinically:</strong> No AI-generated content should reach a client, referral source, or professional record without your careful review and revision.' },
      { icon: '\u{1F6E1}\uFE0F', text: '<strong>De-identify everything:</strong> When discussing clinical scenarios with AI, remove all identifying information. Use general descriptions and hypothetical framing.' },
      { icon: '\u{1F4DD}', text: '<strong>Use AI for first drafts, not final products:</strong> Let AI handle the blank page. Your expertise handles the final version.' },
      { icon: '\u{1F4D3}', text: '<strong>Keep a prompt journal:</strong> When you find a prompt that works well, save it. Over time, you will build a personal library of effective prompts tailored to your practice.' }
    ],
    videos: [
      { title: 'AI Tools for Professionals', url: 'https://www.youtube.com/results?search_query=AI+tools+for+professionals+therapists+2024', duration: 'Search for latest' },
      { title: 'Using AI for Research and Writing', url: 'https://www.youtube.com/results?search_query=using+AI+for+research+writing+professionals', duration: 'Search for latest' }
    ]
  },
  exercises: [
    { text: 'Use AI to <strong>summarize a research topic</strong> in neuroscience that interests you. Try: &ldquo;Summarize recent research on [topic] and its implications for clinical therapy.&rdquo;', xp: 30 },
    { text: 'Draft a <strong>treatment plan template</strong> with AI assistance. Provide details about the type of client and presenting concern. Review and refine the AI\u2019s output.', xp: 40 },
    { text: 'Ask AI to <strong>compare two therapeutic approaches</strong> you use in your practice. Request a structured comparison with evidence base, strengths, and limitations.', xp: 25 },
    { text: 'Create a <strong>patient-friendly handout</strong> on a topic of your choice using AI. Specify an 8th grade reading level and review the result for accuracy and tone.', xp: 40 },
    { text: 'Use AI to <strong>generate 5 intervention ideas</strong> for a common clinical scenario you encounter. Evaluate each suggestion with your clinical judgment.', xp: 25 },
    { text: 'Ask AI to create a <strong>continuing education study guide</strong> for a topic you are currently learning about. Include key concepts and review questions.', xp: 25 },
    { text: 'Practice <strong>de-identifying a scenario</strong> before sharing it with AI. Take a real clinical situation and rewrite it as a hypothetical case with no identifying details.', xp: 15 }
  ],
  bonus: 'Use AI to create a complete psychoeducation handout for one of your specialty areas \u2014 perhaps the neuroscience of addiction, emotional regulation, or the therapeutic alliance. Review it, refine it with your expertise, and save it as a resource you can actually use with clients.',
  achievementTrigger: { id: 'practice-innovator', exerciseIndex: 3 }
});

// ---- WEEK 9: Desktop Apps & Extensions ----
WEEKS.push({
  num: 9,
  title: 'Desktop Apps & Extensions',
  subtitle: 'Move beyond the browser with dedicated AI apps for your Mac, voice conversations, and AI features built into the tools you already use.',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'Desktop Apps & Extensions',
    sections: [
      {
        heading: 'Claude Desktop App',
        content: '<p>While Claude works beautifully in your Safari browser, the dedicated <strong>Claude desktop app</strong> for Mac brings some real advantages that make it worth downloading.</p>' +
          '<p><strong>To download:</strong> Go to <strong>claude.ai/download</strong> in Safari, download the Mac app, and drag it to your Applications folder (just like installing any other app, as you learned in Week 1).</p>' +
          '<p>Here is what makes the desktop app special:</p>' +
          '<ul>' +
          '<li><strong>Always accessible:</strong> The app lives on your Mac outside of the browser. You do not need to navigate to a website \u2014 just open the app from your Dock or Applications folder.</li>' +
          '<li><strong>Projects feature:</strong> This is a powerful organizational tool. You can create separate <strong>Projects</strong> for different areas of your work \u2014 for example, a project called &ldquo;Neuroscience Research,&rdquo; another for &ldquo;Treatment Models,&rdquo; and another for &ldquo;Workshop Prep.&rdquo; Each project keeps its conversations organized and separate, so your research on neuroplasticity does not get mixed in with your workshop planning.</li>' +
          '<li><strong>Extended thinking:</strong> For complex questions, Claude can take more time to think through its response, producing more thorough and nuanced answers. This is particularly valuable for in-depth research questions.</li>' +
          '</ul>' +
          '<p>Think of the desktop app as having a dedicated research assistant at your desk, organized by topic and always ready to help. The Projects feature alone can transform how you use AI by keeping everything tidy and focused.</p>'
      },
      {
        heading: 'ChatGPT Desktop App',
        content: '<p>The <strong>ChatGPT desktop app</strong> brings some exciting capabilities that go beyond what you can do in a browser.</p>' +
          '<p><strong>To download:</strong> Search the App Store for &ldquo;ChatGPT&rdquo; by OpenAI, or visit <strong>openai.com</strong> and look for the Mac download link. Install it like any other application.</p>' +
          '<p>Here is what makes the desktop app stand out:</p>' +
          '<ul>' +
          '<li><strong>Voice mode:</strong> This is a remarkable feature. You can have a <strong>spoken conversation</strong> with ChatGPT \u2014 talk to it out loud, and it responds with a natural-sounding voice. This is wonderful for brainstorming while walking, dictating ideas when your hands are busy, or simply when talking feels more natural than typing. Just press the headphone icon to start a voice conversation.</li>' +
          '<li><strong>Screenshot and image analysis:</strong> You can take a screenshot of a chart, diagram, or research figure and ask ChatGPT to explain what it shows. This is helpful when you encounter a complex graph in a journal article \u2014 just screenshot it and say &ldquo;Explain this chart in simple terms.&rdquo;</li>' +
          '<li><strong>Menu bar access:</strong> The app is available from your Mac\u2019s menu bar at the top of the screen, so you can open it quickly at any time without searching through your applications.</li>' +
          '</ul>' +
          '<p>The voice feature is particularly worth trying. Many people find it feels like having a knowledgeable conversation partner available anytime \u2014 perfect for those moments when you want to think out loud about a clinical question or explore an idea.</p>'
      },
      {
        heading: 'Claude Cowork \u2014 AI With Your Documents',
        content: '<p>One of Claude\u2019s most powerful features is called <strong>Cowork</strong> \u2014 a way to work alongside AI on real documents and tasks, right inside the Claude app. Instead of just asking questions in a chat, Cowork lets Claude actively help you create, edit, and refine documents in a side-by-side workspace.</p>' +
          '<p><strong>How Cowork works:</strong></p>' +
          '<ul>' +
          '<li>When Claude creates a document, letter, handout, or table for you, it appears in an <strong>artifact panel</strong> next to the conversation \u2014 a real, editable document you can copy or save</li>' +
          '<li>You can ask Claude to <strong>revise the document directly</strong>: &ldquo;Make the language simpler&rdquo; or &ldquo;Add a section about self-care&rdquo; \u2014 and it updates the document in place</li>' +
          '<li>For longer projects, Claude can keep working while you step away, thinking through complex problems and producing more thorough results</li>' +
          '</ul>' +
          '<p><strong>Practical examples for your practice:</strong></p>' +
          '<ul>' +
          '<li>&ldquo;Create a treatment plan template for substance use disorder&rdquo; \u2014 Claude produces a formatted document you can directly copy into Word</li>' +
          '<li>&ldquo;Write a workshop handout on building emotional safety with new clients&rdquo; \u2014 the handout appears as a clean, formatted artifact</li>' +
          '<li>&ldquo;Build a comparison table of trauma treatment approaches&rdquo; \u2014 produces a structured table you can paste into Excel or Word</li>' +
          '</ul>' +
          '<p><strong>Using Claude output with Microsoft Office:</strong></p>' +
          '<p>Any document Claude creates in Cowork can be easily transferred to your Office apps. Simply copy the text from the artifact panel and paste it into Word, Excel, or PowerPoint. The formatting transfers cleanly, giving you a strong starting point that you can then refine with the Office tools you learned in Week 5. This workflow \u2014 draft in Claude, polish in Office \u2014 is one of the most efficient ways to work with AI.</p>'
      },
      {
        heading: 'Google AI in Gmail',
        content: '<p>Since you use Gmail, you already have access to several AI features built right into your email. These are included with Gmail at no extra cost and can make email management noticeably easier.</p>' +
          '<p><strong>Smart Compose:</strong> As you type an email, Gmail will suggest how to complete your sentence in light gray text. If the suggestion looks right, press <kbd>Tab</kbd> to accept it. It learns your writing style over time and gets better at predicting what you want to say. You will notice this especially with common phrases like &ldquo;Thank you for your email&rdquo; or &ldquo;I look forward to hearing from you.&rdquo;</p>' +
          '<p><strong>Help Me Write:</strong> When composing a new email, look for the pencil icon or &ldquo;Help me write&rdquo; option. You can type a brief description of what you want to say \u2014 for example, &ldquo;Respond to this referral request, thanking them and confirming availability next week&rdquo; \u2014 and Gmail will draft the full email for you. You can then edit it to match your voice and add any details.</p>' +
          '<p><strong>Summarize:</strong> For long email threads with many back-and-forth messages, look for a &ldquo;Summarize this email&rdquo; option at the top of the conversation. It condenses the entire thread into a brief overview, so you can quickly catch up without reading every message.</p>' +
          '<p>These features are already available in your Gmail \u2014 there is nothing to install or set up. Start noticing Smart Compose suggestions the next time you write an email, and try the Help Me Write feature when you need to draft a response quickly.</p>'
      },
      {
        heading: 'When to Use Which Tool',
        content: '<p>With multiple AI tools now available to you, it is helpful to have a clear sense of when to use each one. Here is a practical decision framework:</p>' +
          '<p><strong>Use Claude when you need:</strong></p>' +
          '<ul>' +
          '<li>Nuanced, thoughtful writing \u2014 professional letters, detailed analyses</li>' +
          '<li>Research synthesis \u2014 summarizing and comparing complex topics</li>' +
          '<li>Long-form content \u2014 workshop materials, treatment plan templates, handouts</li>' +
          '<li>Careful, considered analysis \u2014 exploring a clinical question in depth</li>' +
          '<li>Organized projects \u2014 keeping different areas of research separate</li>' +
          '</ul>' +
          '<p><strong>Use ChatGPT when you need:</strong></p>' +
          '<ul>' +
          '<li>Voice conversations \u2014 brainstorming while walking or thinking out loud</li>' +
          '<li>Image analysis \u2014 explaining charts, diagrams, or screenshots</li>' +
          '<li>Quick questions \u2014 fast answers to straightforward queries</li>' +
          '<li>Broad integrations \u2014 ChatGPT connects with more apps and services</li>' +
          '</ul>' +
          '<p><strong>Use Claude Cowork when you need:</strong></p>' +
          '<ul>' +
          '<li>A polished document, handout, or template you can copy into Word</li>' +
          '<li>To iteratively refine a document with AI revising in place</li>' +
          '</ul>' +
          '<p><strong>Use Gmail AI when you are:</strong></p>' +
          '<ul>' +
          '<li>Drafting or responding to emails</li>' +
          '<li>Catching up on long email threads</li>' +
          '</ul>' +
          '<p>There is no single &ldquo;best&rdquo; tool \u2014 the best tool is the one that fits the task. Over time, you will develop a natural instinct for which tool to reach for in different situations.</p>'
      }
    ],
    tips: [
      { icon: '\u{1F3AF}', text: '<strong>Start with one app:</strong> Download either the Claude or ChatGPT desktop app first. Get comfortable with it before adding more tools. There is no rush to use everything at once.' },
      { icon: '\u{1F4C1}', text: '<strong>Projects in Claude are very useful:</strong> Create a project for each major area of your work \u2014 research, patient materials, workshops, continuing education. This keeps your AI conversations organized and easy to find.' },
      { icon: '\u{1F399}\uFE0F', text: '<strong>Voice mode is great for brainstorming:</strong> Try ChatGPT\u2019s voice mode during a walk or commute. Speaking your questions out loud often helps you think through ideas differently than typing does.' }
    ],
    videos: [
      { title: 'Claude Desktop App \u2014 Getting Started', url: 'https://www.youtube.com/results?search_query=Claude+desktop+app+tutorial+Mac', duration: 'Search for latest' },
      { title: 'ChatGPT Desktop App for Mac', url: 'https://www.youtube.com/results?search_query=ChatGPT+desktop+app+Mac+tutorial', duration: 'Search for latest' },
      { title: 'Claude Artifacts & Cowork Features', url: 'https://www.youtube.com/results?search_query=Claude+AI+artifacts+features+tutorial', duration: 'Search for latest' }
    ]
  },
  exercises: [
    { text: 'Download and set up the <strong>Claude desktop app</strong>. Go to claude.ai/download, install it, and sign in with your Claude account.', xp: 25 },
    { text: 'Create a <strong>Claude Project</strong> called &ldquo;Research&rdquo; (or a name that fits your work). Start a conversation inside that project about a neuroscience topic that interests you.', xp: 30 },
    { text: 'Download and set up the <strong>ChatGPT desktop app</strong>. Install it from the App Store or openai.com, and sign in with your ChatGPT account.', xp: 25 },
    { text: 'Try <strong>ChatGPT voice mode</strong> for a 5-minute conversation. Press the headphone icon and ask it something you are curious about. Notice how it feels different from typing.', xp: 30 },
    { text: 'Try <strong>Claude Cowork</strong>: Ask Claude to create a professional document (like a treatment plan template or workshop outline). Notice how it appears as a formatted artifact you can copy directly into Word.', xp: 25 },
    { text: 'Use Gmail\u2019s <strong>Help Me Write</strong> feature to draft an email. When composing a new message, look for the writing assistance option and try it with a professional email.', xp: 25 },
    { text: 'Compare the <strong>same task across two different tools</strong> \u2014 for example, ask both the Claude desktop app and the ChatGPT desktop app to summarize the same research topic. Note the differences.', xp: 25 },
    { text: 'Set up a <strong>second Claude Project</strong> for another area of your work \u2014 perhaps &ldquo;Patient Materials,&rdquo; &ldquo;Workshop Prep,&rdquo; or &ldquo;Continuing Education.&rdquo;', xp: 15 }
  ],
  bonus: 'Set up your complete AI workspace: Claude desktop with at least 2 Projects, ChatGPT desktop with voice mode tested, and Gmail AI features explored. Write a brief note about which tool you think you will use most and why.',
  achievementTrigger: { id: 'app-explorer', exerciseIndex: 3 }
});

// ---- WEEK 10: Customizing AI & Your Prompt Library ----
WEEKS.push({
  num: 10,
  title: 'Customizing AI & Your Prompt Library',
  subtitle: 'Personalize your AI tools so they know your background and preferences, and build a library of ready-to-use prompts tailored to your professional interests.',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'Customizing AI & Your Prompt Library',
    sections: [
      {
        heading: 'Custom Instructions in Claude',
        content: '<p>One of the most valuable features in the Claude desktop app is the ability to set <strong>custom instructions</strong> for each Project. These instructions tell Claude about you every time you start a conversation within that project \u2014 so you never have to repeat your background, preferences, or the kind of help you need.</p>' +
          '<p><strong>How to set this up:</strong></p>' +
          '<ol>' +
          '<li>Open the Claude desktop app</li>' +
          '<li>Click on one of your Projects (or create a new one)</li>' +
          '<li>Look for the Project settings \u2014 there will be a field for instructions or a system prompt</li>' +
          '<li>Type your custom instructions in that field</li>' +
          '</ol>' +
          '<p>Here is an example of excellent custom instructions for your work:</p>' +
          '<div class="prompt-block">You are assisting David, a licensed Marriage and Family Therapist (LMFT) and Licensed Alcohol and Drug Therapist (LADT) with over 40 years of clinical experience. He is deeply interested in neuroscience advances, evidence-based treatment models, skill development, emotional safety, patient trust, and the intersection of spiritual maturity and therapeutic outcomes.\n\nWhen responding:\n- Explain concepts clearly without unnecessary jargon\n- When citing research, note the year and authors so David can verify\n- Focus on practical clinical implications, not just theory\n- Be thorough but respect his time \u2014 use bullet points and clear structure\n- Acknowledge the depth of his clinical experience when relevant</div>' +
          '<p>Once you save these instructions, every conversation in that project will automatically have this context. Claude will know who you are, what you care about, and how you prefer to receive information \u2014 without you having to explain it each time.</p>'
      },
      {
        heading: 'ChatGPT Memory and Custom Instructions',
        content: '<p>ChatGPT has its own system for personalization, and it works a bit differently from Claude. There are two features to set up: <strong>Custom Instructions</strong> and <strong>Memory</strong>.</p>' +
          '<p><strong>Setting up Custom Instructions:</strong></p>' +
          '<ol>' +
          '<li>Open ChatGPT (in the app or at chatgpt.com)</li>' +
          '<li>Click your name or profile icon in the lower left</li>' +
          '<li>Select <strong>Settings</strong></li>' +
          '<li>Go to <strong>Personalization</strong> and then <strong>Custom Instructions</strong></li>' +
          '</ol>' +
          '<p>You will see two fields:</p>' +
          '<ul>' +
          '<li><strong>&ldquo;What would you like ChatGPT to know about you?&rdquo;</strong> \u2014 Enter your professional background, interests, and specialties</li>' +
          '<li><strong>&ldquo;How would you like ChatGPT to respond?&rdquo;</strong> \u2014 Describe your preferred communication style: clear, non-jargon explanations with citations and practical implications</li>' +
          '</ul>' +
          '<p><strong>Using Memory:</strong></p>' +
          '<p>ChatGPT also has a Memory feature that remembers things you tell it across conversations. For example, if you say &ldquo;Remember that I specialize in working with adults in substance use recovery,&rdquo; it will carry that forward. You can manage what ChatGPT remembers by going to <strong>Settings &rarr; Personalization &rarr; Memory</strong>. There you can see everything it has remembered and delete anything you want.</p>' +
          '<p>Together, Custom Instructions and Memory mean that ChatGPT gets better at helping you over time \u2014 each conversation builds on what it already knows about your preferences and needs.</p>'
      },
      {
        heading: 'Building Your AI Profile',
        content: '<p>Taking time to create a thoughtful, detailed professional profile for your AI tools is one of the best investments you can make. It pays off in <strong>every single future conversation</strong> \u2014 no more repeating who you are, what you do, or how you prefer information presented.</p>' +
          '<p>Here is what to include in your profile. You can adapt this for both Claude and ChatGPT:</p>' +
          '<p><strong>Professional credentials:</strong></p>' +
          '<ul>' +
          '<li>Your licenses (LMFT, LADT) and years of experience</li>' +
          '<li>Your specialties and areas of focus</li>' +
          '<li>The populations you work with</li>' +
          '</ul>' +
          '<p><strong>Professional interests:</strong></p>' +
          '<ul>' +
          '<li>Neuroscience advances and their clinical applications</li>' +
          '<li>Evidence-based treatment models and new developments</li>' +
          '<li>Skill development and professional growth</li>' +
          '<li>Emotional safety and patient trust in the therapeutic relationship</li>' +
          '<li>The intersection of spiritual maturity and therapeutic outcomes</li>' +
          '</ul>' +
          '<p><strong>Communication preferences:</strong></p>' +
          '<ul>' +
          '<li>Clear language without unnecessary jargon</li>' +
          '<li>Structured responses with bullet points when appropriate</li>' +
          '<li>Citations with years and authors for verification</li>' +
          '<li>Practical, clinically applicable insights rather than purely theoretical</li>' +
          '</ul>' +
          '<p><strong>Ethical boundaries:</strong></p>' +
          '<ul>' +
          '<li>All clinical scenarios will be hypothetical and de-identified</li>' +
          '<li>AI responses are starting points for professional judgment, not clinical directives</li>' +
          '</ul>' +
          '<p>Spend 15\u201320 minutes crafting this profile carefully. A well-written profile transforms AI from a generic tool into something that feels like it was designed specifically for you.</p>'
      },
      {
        heading: 'Your Prompt Library',
        content: '<p>Below is a collection of <strong>ready-to-use prompt templates</strong> designed specifically for your professional interests and needs. Each prompt is crafted to produce high-quality, relevant responses. Click any prompt to copy it, then paste it into Claude or ChatGPT and fill in the bracketed sections with your specific topic.</p>' +
          '<p><strong>Neuroscience Research:</strong></p>' +
          '<div class="prompt-block">I\u2019m a licensed therapist interested in the latest neuroscience research on [topic]. Please summarize recent findings in plain language. Include: key discoveries, implications for clinical practice, and any recommended readings. Focus on findings that are most relevant to therapeutic work with adults.</div>' +
          '<p><strong>Treatment Model Comparison:</strong></p>' +
          '<div class="prompt-block">Compare these evidence-based treatment approaches for [condition]: [Approach 1] vs [Approach 2]. For each, explain: core principles, typical session structure, evidence base strength, best-suited patient profiles, and limitations. Present this as a structured comparison I can reference quickly.</div>' +
          '<p><strong>Skill Development Plan:</strong></p>' +
          '<div class="prompt-block">I\u2019m a licensed therapist with 40+ years of experience looking to deepen my skills in [area]. Create a professional development plan including: key concepts to revisit, advanced techniques to explore, recommended books or courses, and practice exercises I can incorporate into my work. Tailor this for an experienced clinician, not a beginner.</div>' +
          '<p><strong>Emotional Safety &amp; Patient Trust:</strong></p>' +
          '<div class="prompt-block">What does current research say about building therapeutic alliance and emotional safety, particularly in the first 3\u20135 sessions? I work with [population]. Include practical techniques I can implement immediately, the neuroscience behind why these approaches work, and common mistakes that erode trust.</div>' +
          '<p><strong>Spiritual Maturity in Therapy:</strong></p>' +
          '<div class="prompt-block">How does a therapist\u2019s personal spiritual maturity or contemplative practice correlate with positive patient outcomes? Summarize relevant research, including studies on mindfulness, presence, attunement, or wisdom in the therapeutic relationship. I\u2019m interested in both the evidence base and practical implications for how I show up in the therapy room.</div>' +
          '<p><strong>Patient Handout Generator:</strong></p>' +
          '<div class="prompt-block">Create a patient-friendly handout about [topic]. Use simple language (8th grade reading level), include 3\u20135 actionable steps the person can take, and add a brief \u201cWhy This Matters\u201d section that explains the benefit. Make it warm and encouraging in tone. Format it so it could be printed on a single page.</div>' +
          '<p><strong>Workshop Content:</strong></p>' +
          '<div class="prompt-block">I\u2019m preparing a [duration] workshop for [audience] on [topic]. Create a detailed outline including: learning objectives, key talking points with supporting research, interactive exercises or discussion prompts, and a take-home summary for participants. The tone should be professional but engaging.</div>' +
          '<p><strong>Continuing Education Study Guide:</strong></p>' +
          '<div class="prompt-block">I\u2019m reading [title] by [author] for continuing education. Summarize the key arguments, highlight the most important clinical implications, and create 10 review questions to test my understanding. Focus on what I can apply directly in my practice with adult clients.</div>' +
