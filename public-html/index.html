// ---- WEEK 6: What is AI? — Demystified ----

EXERCISE_HELP['6-0'] = '<strong>Goal:</strong> Write a clear, simple explanation of AI in your own words &mdash; as if telling a friend over coffee.<ol><li>Open Apple Notes (press <kbd>&#8984;</kbd> + <kbd>Space</kbd>, type &ldquo;Notes,&rdquo; hit Enter). Create a new note titled &ldquo;My AI Definition.&rdquo;</li><li>Think about what you learned in the lesson: AI is <strong>pattern recognition</strong>, not thinking. It predicts the next word based on patterns from millions of texts. It has never experienced anything.</li><li>Write 2&ndash;3 sentences in your own words. Here is an example to get you started, but please use your own language:<br><em>&ldquo;AI is a computer system that has been trained on millions of documents and learned the patterns of how language works. When you ask it a question, it generates an answer by predicting what words should come next &mdash; similar to autocomplete on your phone, but far more sophisticated. It is not thinking or understanding; it is pattern-matching at a very large scale.&rdquo;</em></li><li>Read it back to yourself. Would a colleague or friend understand it? If so, you have nailed it.</li></ol><div class="expected-result">&#9989; Expected result: A short, clear note in Apple Notes with your personal explanation of AI in 2&ndash;3 sentences.</div>';

EXERCISE_HELP['6-1'] = '<strong>Goal:</strong> Create a practical list of 5 things you would genuinely want AI to help with.<ol><li>Open Apple Notes and create a new note titled &ldquo;AI Wish List.&rdquo;</li><li>Think about your daily professional and personal life. Where do you spend time on tasks that feel repetitive, time-consuming, or where you wish you had a research assistant?</li><li>Here are some ideas to spark your thinking (pick ones that resonate, or come up with your own):<ul><li><strong>Professional:</strong> Summarizing neuroscience research articles, drafting treatment plan templates, comparing therapy approaches, creating patient handouts, preparing CE study guides, writing professional correspondence, brainstorming intervention ideas</li><li><strong>Personal:</strong> Explaining complex health topics in simple terms, organizing travel plans, summarizing long articles or books, finding recipes, drafting personal letters</li></ul></li><li>Write down your 5 items. For each one, add a brief note about <em>why</em> it would be helpful &mdash; for example: &ldquo;Summarizing neuroscience research &mdash; because I want to stay current but reading full papers takes hours.&rdquo;</li><li>Keep this list. You will revisit it in later weeks when you actually try these tasks with AI.</li></ol><div class="expected-result">&#9989; Expected result: A note with 5 specific, practical tasks you want AI to help with, each with a brief reason why.</div>';

EXERCISE_HELP['6-2'] = '<strong>Goal:</strong> Learn how others perceive AI and notice the gap between perception and reality.<ol><li>Think of a friend, colleague, or family member you are comfortable having a brief conversation with about technology.</li><li>Ask them a simple, open-ended question: <em>&ldquo;What do you think AI can do?&rdquo;</em> or <em>&ldquo;What comes to mind when you hear &lsquo;artificial intelligence&rsquo;?&rdquo;</em></li><li>Listen carefully. Most people either overestimate AI (thinking it truly understands and thinks) or underestimate it (thinking it is just a gimmick). Note their response.</li><li>Open Apple Notes and create a new note titled &ldquo;AI Perceptions.&rdquo; Write down:<ul><li>What your friend/colleague said AI can do</li><li>What they got right based on what you learned this week</li><li>What they got wrong or were confused about</li><li>What surprised you about the conversation</li></ul></li><li>This exercise builds your own understanding by teaching you to recognize common misconceptions &mdash; a skill that will serve you well as colleagues ask you about AI.</li></ol><div class="expected-result">&#9989; Expected result: A note documenting what someone else believes about AI, with your observations about where their understanding aligns or differs from what you learned.</div>';

EXERCISE_HELP['6-3'] = '<strong>Goal:</strong> Identify 3 specific things AI cannot do in therapy &mdash; tasks that require your irreplaceable human qualities.<ol><li>Open Apple Notes and create a new note titled &ldquo;What AI Cannot Replace.&rdquo;</li><li>Think about the core of what you do as a therapist. What are the moments in your work that absolutely require a human being in the room? Consider:<ul><li><strong>Clinical judgment:</strong> Reading a client\'s body language, sensing when something unsaid is more important than what was said, knowing when to push gently and when to hold space</li><li><strong>Empathy and presence:</strong> Sitting with a client in their pain without rushing to fix it, the therapeutic power of being truly seen and heard by another human</li><li><strong>Ethical discernment:</strong> Navigating complex dual relationships, making judgment calls about safety, holding the tension between competing ethical principles</li><li><strong>The therapeutic relationship itself:</strong> Trust built over time, rupture and repair, the healing that happens between two people &mdash; not between a person and a machine</li></ul></li><li>Write down 3 specific examples from your own experience. Be as concrete as possible &mdash; for example: <em>&ldquo;AI cannot sense that a client is minimizing their distress because I see the tension in their jaw and the way they avoid eye contact &mdash; and I know from 40 years of experience that this moment requires gentle, patient silence.&rdquo;</em></li><li>These examples will serve as your personal touchstone for keeping AI in its proper place as a tool, not a replacement.</li></ol><div class="expected-result">&#9989; Expected result: A note with 3 specific, concrete examples from your clinical experience of things AI cannot do, grounded in human judgment, empathy, or presence.</div>';

EXERCISE_HELP['6-4'] = '<strong>Goal:</strong> Find a real news article about an AI hallucination and understand why it matters.<ol><li>Open Safari and go to Google: <strong>google.com</strong></li><li>Search for: <em>AI hallucination news example</em> or <em>AI made up information real case</em></li><li>Look for news articles from reputable sources (New York Times, Washington Post, BBC, NPR, The Guardian, Wired, etc.). Here are some well-documented cases you might find:<ul><li>A lawyer who used ChatGPT to write a legal brief and it invented fake court cases that did not exist</li><li>AI chatbots providing incorrect medical information with full confidence</li><li>AI generating fake citations to academic papers that were never written</li></ul></li><li>Read the article. Then open Apple Notes and create a note titled &ldquo;AI Hallucination Example.&rdquo; Write down:<ul><li>What happened (1&ndash;2 sentences)</li><li>What the AI got wrong</li><li>Why this matters for professionals who might rely on AI</li><li>What this teaches you about verifying AI output</li></ul></li><li>This exercise is not meant to scare you away from AI &mdash; it is meant to build the healthy skepticism that makes you a <strong>wise</strong> user of these tools.</li></ol><div class="expected-result">&#9989; Expected result: A note summarizing a real AI hallucination case, why it happened, and what lesson you take from it for your own AI use.</div>';

EXERCISE_HELP['6-5'] = '<strong>Goal:</strong> Create 3 personal rules for using AI responsibly in your therapy practice.<ol><li>Open Apple Notes and create a new note titled &ldquo;My AI Privacy Rules.&rdquo;</li><li>Think about the intersection of AI and your professional obligations around confidentiality. Consider what you learned about AI privacy in this lesson: conversations may be reviewed by AI companies, nothing typed into AI should be considered truly private.</li><li>Write 3 rules that feel right for you. Here are examples to spark your thinking (but write your own in your own voice):<ul><li><em>&ldquo;I will never enter a real client\'s name, date of birth, or identifying details into any AI tool.&rdquo;</em></li><li><em>&ldquo;Before typing anything clinical into AI, I will ask myself: Would I be comfortable if my licensing board read this conversation?&rdquo;</em></li><li><em>&ldquo;I will always treat AI output as a first draft that requires my professional review &mdash; never as a final product.&rdquo;</em></li><li><em>&ldquo;I will use hypothetical scenarios and de-identified descriptions when discussing clinical topics with AI.&rdquo;</em></li><li><em>&ldquo;I will verify any specific research claims, statistics, or citations before using them professionally.&rdquo;</em></li></ul></li><li>Save this note somewhere accessible. These are your personal guardrails &mdash; the principles that keep AI use ethical and safe in your practice.</li></ol><div class="expected-result">&#9989; Expected result: A note with 3 clear, personally meaningful rules about AI and privacy that you can refer to whenever you use AI tools.</div>';

EXERCISE_HELP['6-6'] = '<strong>Goal:</strong> Practice explaining AI hallucinations to someone else, which deepens your own understanding.<ol><li>Think of someone you can have a brief conversation with &mdash; a colleague, friend, or family member.</li><li>Explain the concept of &ldquo;hallucination&rdquo; in AI in simple terms. Here is a framework you can use:<ul><li><strong>What it is:</strong> &ldquo;When AI makes something up that sounds completely real and confident, but is actually false.&rdquo;</li><li><strong>Why it happens:</strong> &ldquo;AI predicts the most likely next word based on patterns. Sometimes those patterns lead to plausible-sounding but incorrect information &mdash; like a convincing citation to a study that does not exist.&rdquo;</li><li><strong>Why it matters:</strong> &ldquo;Because AI does not say \'I am not sure.\' It presents made-up facts with the same confidence as real ones. That is why you always have to verify important claims.&rdquo;</li></ul></li><li>You might use an analogy: <em>&ldquo;Imagine an assistant who is great at writing and never says \'I don\'t know.\' Sometimes they fill in gaps with plausible-sounding information rather than admitting they are unsure. That is what AI hallucination is.&rdquo;</em></li><li>After the conversation, make a brief note about how it went. Did they understand? What questions did they ask?</li></ol><div class="expected-result">&#9989; Expected result: You have explained AI hallucinations to at least one person, and you can articulate the concept clearly and simply.</div>';

EXERCISE_HELP['6-7'] = '<strong>Goal:</strong> Define clear ethical boundaries for your use of AI in any capacity related to your practice.<ol><li>Open Apple Notes and create a new note titled &ldquo;My AI Ethics Boundaries.&rdquo;</li><li>Think broadly about all the ways AI might intersect with your professional life: research, writing, patient materials, correspondence, continuing education, brainstorming.</li><li>Write a list of ethical boundaries. Consider these categories:<ul><li><strong>Confidentiality:</strong> What will you never share with AI? (e.g., real names, session details, identifying information, intake forms)</li><li><strong>Accuracy:</strong> What will you always verify before using? (e.g., research citations, statistics, treatment recommendations)</li><li><strong>Transparency:</strong> When will you disclose that AI assisted you? (e.g., if a colleague asks, if used for official documents)</li><li><strong>Clinical judgment:</strong> What decisions will you never delegate to AI? (e.g., diagnosis, treatment planning for specific clients, safety assessments)</li><li><strong>Quality control:</strong> What review process will you use before sharing AI-generated content? (e.g., always read and revise, check tone and accuracy)</li></ul></li><li>Write each boundary clearly. You might end up with 5&ndash;10 items. That is fine &mdash; be thorough. These boundaries protect you, your clients, and your license.</li></ol><div class="expected-result">&#9989; Expected result: A comprehensive note listing your personal ethical boundaries for AI use in your practice, covering confidentiality, accuracy, transparency, and clinical judgment.</div>';

// ---- WEEK 7: Your First AI Conversations ----

EXERCISE_HELP['7-0'] = '<strong>Goal:</strong> Create a free ChatGPT account and have your very first AI conversation.<ol><li>Open Safari and go to <strong>chatgpt.com</strong></li><li>Click <strong>Sign Up</strong> in the upper-right corner.</li><li>You can sign up with your Gmail address for the easiest setup: click <strong>&ldquo;Continue with Google&rdquo;</strong> and select your Gmail account. Alternatively, enter your email and create a password.</li><li>Once logged in, you will see a text box at the bottom of the screen. This is where you type your questions.</li><li>Try your first conversation! Here are some topics you might enjoy:<ul><li><em>&ldquo;What are the most interesting recent discoveries in neuroscience about how the brain changes in response to therapy?&rdquo;</em></li><li><em>&ldquo;Can you recommend 5 books about the neuroscience of emotional regulation that would be relevant for a practicing therapist?&rdquo;</em></li><li><em>&ldquo;Explain polyvagal theory in simple, everyday language.&rdquo;</em></li><li><em>&ldquo;What is the current state of research on neuroplasticity in older adults?&rdquo;</em></li></ul></li><li>Type (or copy-paste) one of these into the text box and press <strong>Return</strong> (Enter). Read the response. You can ask follow-up questions in the same conversation.</li><li>Do not worry about getting the &ldquo;perfect&rdquo; question. The goal is simply to have your first exchange and see how it feels.</li></ol><div class="expected-result">&#9989; Expected result: A ChatGPT account is created and you have had at least one conversation, with a response visible on screen.</div>';

EXERCISE_HELP['7-1'] = '<strong>Goal:</strong> Create a free Claude account and have your first conversation on a topic you care about.<ol><li>Open Safari and go to <strong>claude.ai</strong></li><li>Click <strong>Sign Up</strong>.</li><li>Sign up with your Google (Gmail) account for the easiest setup, or use your email and a new password.</li><li>Once logged in, you will see a clean interface with a text box at the bottom. This is where you type.</li><li>Try a conversation on a similar topic to what you asked ChatGPT, so you can compare later. Here are some suggestions:<ul><li><em>&ldquo;I am a licensed therapist interested in neuroscience. Can you explain the relationship between the default mode network and therapeutic presence?&rdquo;</em></li><li><em>&ldquo;What are the most clinically relevant findings from attachment neuroscience in the last 10 years?&rdquo;</em></li><li><em>&ldquo;Describe the neuroscience of trust in the therapeutic relationship in plain language.&rdquo;</em></li></ul></li><li>Type your question and press <strong>Return</strong>. Read the response carefully.</li><li>Notice how Claude\'s response feels compared to ChatGPT. Many people find Claude\'s writing style more thoughtful and nuanced, but both are excellent tools.</li></ol><div class="expected-result">&#9989; Expected result: A Claude account is created and you have had at least one conversation visible on screen.</div>';

EXERCISE_HELP['7-2'] = '<strong>Goal:</strong> Ask the exact same question to both ChatGPT and Claude, then compare their responses.<ol><li>Choose one specific question to test. Here is a good one you can copy:<br><em>&ldquo;Summarize the three most important things a therapist should know about neuroplasticity and its implications for treating trauma in adults.&rdquo;</em></li><li>Open <strong>chatgpt.com</strong> in one Safari tab. Start a new conversation (click &ldquo;New Chat&rdquo; if needed). Paste or type the question and press Return.</li><li>Open <strong>claude.ai</strong> in a second Safari tab. Start a new conversation. Paste the exact same question and press Return.</li><li>Now compare. Open Apple Notes and create a note titled &ldquo;ChatGPT vs Claude Comparison.&rdquo; Write down your observations:<ul><li><strong>Length:</strong> Which response was longer? More concise?</li><li><strong>Depth:</strong> Which went deeper into the topic?</li><li><strong>Clarity:</strong> Which was easier to read and understand?</li><li><strong>Practical value:</strong> Which gave you information you could actually use in your practice?</li><li><strong>Tone:</strong> Which felt more like talking to a knowledgeable colleague?</li><li><strong>Accuracy:</strong> Did either one say something you know to be incorrect?</li></ul></li><li>There is no &ldquo;right answer&rdquo; about which is better &mdash; the goal is to understand their different strengths so you know when to use each one.</li></ol><div class="expected-result">&#9989; Expected result: A note with your side-by-side comparison of ChatGPT and Claude responses to the same question, with specific observations about the differences.</div>';

EXERCISE_HELP['7-3'] = '<strong>Goal:</strong> Write and test a structured prompt using the RICE framework on a therapy-related topic.<ol><li>Open Apple Notes and create a note titled &ldquo;My RICE Prompt.&rdquo;</li><li>Build your prompt using these four components:<ul><li><strong>R &mdash; Role:</strong> Tell the AI who to be. Example: <em>&ldquo;You are a neuroscience research assistant with expertise in clinical applications.&rdquo;</em></li><li><strong>I &mdash; Instructions:</strong> Be specific about what you want. Example: <em>&ldquo;Summarize the three most significant findings about neuroplasticity and addiction recovery from the last 5 years.&rdquo;</em></li><li><strong>C &mdash; Context:</strong> Explain who you are and why you are asking. Example: <em>&ldquo;I am a licensed MFT and LADT with 40+ years of experience. I work primarily with adults in substance use recovery.&rdquo;</em></li><li><strong>E &mdash; Examples:</strong> Show the format you want. Example: <em>&ldquo;For each finding, provide: (1) the discovery, (2) why it matters for clinical practice, and (3) one practical way I might reference it in a session.&rdquo;</em></li></ul></li><li>Combine these into a single prompt. Here is a complete example you can modify:<br><em>&ldquo;You are a neuroscience research assistant with expertise in clinical applications. Summarize the three most significant findings about neuroplasticity and addiction recovery from the last 5 years. I am a licensed MFT and LADT with 40+ years of experience working with adults in substance use recovery. For each finding, provide: (1) the discovery, (2) why it matters for clinical practice, and (3) one practical way I might reference it in a session.&rdquo;</em></li><li>Copy your prompt and paste it into either ChatGPT or Claude. Press Return and see the result.</li><li>Notice how much more specific and useful the response is compared to a simple question like &ldquo;Tell me about neuroplasticity.&rdquo;</li></ol><div class="expected-result">&#9989; Expected result: A written RICE prompt saved in Notes, and a response from ChatGPT or Claude that demonstrates how structured prompting produces better results.</div>';

EXERCISE_HELP['7-4'] = '<strong>Goal:</strong> Ask AI to explain a neuroscience concept in simple, everyday language.<ol><li>Open either ChatGPT or Claude (whichever you prefer).</li><li>Type this prompt (or modify it with a different concept):<br><em>&ldquo;Explain neuroplasticity as if you were talking to someone with no science background. Use everyday language, a helpful analogy, and keep it to about 200 words.&rdquo;</em></li><li>Other neuroscience concepts you might try:<ul><li><em>&ldquo;Explain polyvagal theory as if talking to someone with no science background.&rdquo;</em></li><li><em>&ldquo;Explain what happens in the brain during a trauma response, using simple everyday language.&rdquo;</em></li><li><em>&ldquo;Explain the neuroscience of addiction in plain terms &mdash; what is happening in the brain and why willpower alone is not enough.&rdquo;</em></li><li><em>&ldquo;Explain mirror neurons and their role in empathy, as if explaining to a new therapy student.&rdquo;</em></li></ul></li><li>Read the response. Ask yourself: Could I share this with a client? Is the language accessible? Are there any inaccuracies based on your knowledge?</li><li>Try a follow-up: <em>&ldquo;Can you give me an analogy I could use with a client in their 50s who is skeptical that therapy can change their brain?&rdquo;</em></li></ol><div class="expected-result">&#9989; Expected result: A clear, jargon-free explanation of a neuroscience concept from AI that you could potentially use or adapt for conversations with clients.</div>';

EXERCISE_HELP['7-5'] = '<strong>Goal:</strong> Practice the art of follow-up questions to refine and improve AI responses.<ol><li>Open either ChatGPT or Claude and start a new conversation.</li><li>Ask an initial question on any topic that interests you. For example:<br><em>&ldquo;What are the key principles of motivational interviewing?&rdquo;</em></li><li>After getting the first response, try each of these follow-up approaches:<ul><li><strong>Simplify:</strong> <em>&ldquo;Can you explain that more simply, as if I were teaching it to a new intern?&rdquo;</em></li><li><strong>Expand:</strong> <em>&ldquo;Can you go deeper on the second principle? I want more detail about how it works in practice.&rdquo;</em></li><li><strong>Example:</strong> <em>&ldquo;Give me a concrete example of how I would use this in a session with a client resistant to change.&rdquo;</em></li><li><strong>Reformat:</strong> <em>&ldquo;Can you present the key principles as a quick-reference table with columns for Principle, Definition, and Clinical Example?&rdquo;</em></li></ul></li><li>Notice how the response improves and transforms with each follow-up. This is the key skill of effective AI use &mdash; iterating until you get exactly what you need.</li><li>This parallels something you already do expertly: in therapy, you ask follow-up questions to help clients go deeper. The same skill works beautifully with AI.</li></ol><div class="expected-result">&#9989; Expected result: A conversation with at least 4 follow-up exchanges showing how the AI response improved, simplified, expanded, and reformatted based on your guidance.</div>';

EXERCISE_HELP['7-6'] = '<strong>Goal:</strong> Ask AI to create a structured comparison table of two treatment approaches.<ol><li>Open either ChatGPT or Claude.</li><li>Think of two treatment approaches you are familiar with. Some suggestions:<ul><li>CBT vs. EMDR for trauma</li><li>Motivational Interviewing vs. 12-Step Facilitation for substance use</li><li>DBT vs. ACT for emotional regulation</li><li>Psychodynamic therapy vs. CBT for depression</li></ul></li><li>Use this prompt (fill in your chosen approaches):<br><em>&ldquo;Create a detailed comparison table of [Approach 1] and [Approach 2] for treating [condition]. Include these columns: Core Philosophy, Key Techniques, Evidence Base, Ideal Client Profile, Session Structure, Typical Duration, Strengths, and Limitations. Present this as a structured table.&rdquo;</em></li><li>For example:<br><em>&ldquo;Create a detailed comparison table of Motivational Interviewing and 12-Step Facilitation for treating alcohol use disorder. Include these columns: Core Philosophy, Key Techniques, Evidence Base, Ideal Client Profile, Session Structure, Typical Duration, Strengths, and Limitations.&rdquo;</em></li><li>Review the table. Check it against your own clinical knowledge. Is it accurate? Would you adjust anything based on your experience?</li><li>If the table is useful, copy it: select all the text (<kbd>&#8984;</kbd> + <kbd>A</kbd> within the response area), then <kbd>&#8984;</kbd> + <kbd>C</kbd> to copy. You could paste it into a Word document for reference.</li></ol><div class="expected-result">&#9989; Expected result: A formatted comparison table of two treatment approaches that you have reviewed against your clinical knowledge.</div>';

// ---- WEEK 8: AI for Your Therapy Practice ----

EXERCISE_HELP['8-0'] = '<strong>Goal:</strong> Use AI to summarize a neuroscience research topic with clinical implications.<ol><li>Open either ChatGPT or Claude.</li><li>Choose a neuroscience topic that interests you. Here are some options:<ul><li>Neuroplasticity and trauma recovery</li><li>The neuroscience of addiction and relapse</li><li>Attachment neuroscience and the therapeutic relationship</li><li>The default mode network and mindfulness</li><li>Polyvagal theory and emotional regulation</li><li>The neuroscience of trust and safety in therapy</li></ul></li><li>Use this prompt (fill in your topic):<br><em>&ldquo;Summarize recent research on [topic] and its implications for clinical therapy. I am a licensed therapist with 40+ years of experience. Focus on: (1) key findings from the last 5&ndash;10 years, (2) practical implications for working with adult clients, and (3) any connections to emotional safety and the therapeutic relationship. Please note the researchers or institutions involved so I can verify.&rdquo;</em></li><li>Read the response carefully. Highlight any claims that include specific researchers, years, or studies &mdash; those are the ones to verify independently (a quick Google search is usually enough).</li><li>If you want more detail on any section, ask: <em>&ldquo;Can you go deeper on the clinical implications of the second finding?&rdquo;</em></li></ol><div class="expected-result">&#9989; Expected result: A clear research summary from AI on a neuroscience topic you care about, with notes about which claims to verify.</div>';

EXERCISE_HELP['8-1'] = '<strong>Goal:</strong> Draft a treatment plan template with AI assistance, then review and refine it.<ol><li>Open either ChatGPT or Claude.</li><li>Think of a specific client type and presenting concern (use a general, de-identified description &mdash; no real client details). For example:<ul><li>An adult in their 40s with co-occurring generalized anxiety and alcohol use disorder</li><li>A couple in their 50s seeking therapy for communication breakdown after a major life transition</li><li>An adult in early recovery from opioid use disorder with a history of trauma</li></ul></li><li>Use this prompt (fill in the specifics):<br><em>&ldquo;Create a comprehensive treatment plan template for [client description]. Include these sections: Presenting Concerns, Diagnostic Impressions (leave as a placeholder), Treatment Goals (3&ndash;4 goals), Measurable Objectives for each goal, Planned Interventions (evidence-based), Estimated Duration, and Review Schedule. Format it so I could copy it into a Word document and use it as a professional template.&rdquo;</em></li><li>Read the AI\'s draft carefully. Ask yourself:<ul><li>Does this align with how I actually structure treatment plans?</li><li>Are the interventions appropriate and evidence-based?</li><li>Would I add or change anything based on my clinical experience?</li></ul></li><li>Ask AI to revise: <em>&ldquo;Good start. Can you add a section for strengths/protective factors? Also, make the objectives more specific and measurable.&rdquo;</em></li><li>When you are satisfied, copy the template (<kbd>&#8984;</kbd> + <kbd>C</kbd>) and paste it into Word (<kbd>&#8984;</kbd> + <kbd>V</kbd>). Save it to your Practice &rarr; Templates folder.</li></ol><div class="expected-result">&#9989; Expected result: A treatment plan template drafted by AI and refined by you, saved as a Word document you can reuse.</div>';

EXERCISE_HELP['8-2'] = '<strong>Goal:</strong> Ask AI to compare two therapeutic approaches with a structured, evidence-based comparison.<ol><li>Open either ChatGPT or Claude.</li><li>Choose two therapeutic approaches you want to compare. Some ideas:<ul><li>CBT vs. EMDR for PTSD</li><li>DBT vs. ACT for emotional dysregulation</li><li>Motivational Interviewing vs. Cognitive Behavioral Therapy for substance use</li><li>Psychodynamic therapy vs. Attachment-Based therapy</li></ul></li><li>Use this prompt:<br><em>&ldquo;I am a licensed MFT/LADT with 40+ years of experience. Compare [Approach 1] and [Approach 2] for treating [condition]. Provide a structured comparison including: (1) Theoretical foundation, (2) Key techniques and interventions, (3) Strength of evidence base with key studies, (4) Best-suited client populations, (5) Typical treatment duration, (6) Strengths of each approach, (7) Limitations of each approach, and (8) When a clinician might choose one over the other. Format this as a clear, organized document I can reference.&rdquo;</em></li><li>Review the response against your own clinical knowledge. Pay special attention to the evidence base claims &mdash; verify any specific studies mentioned.</li><li>If helpful, ask: <em>&ldquo;Can you add a section on how these two approaches might be integrated in practice?&rdquo;</em></li></ol><div class="expected-result">&#9989; Expected result: A structured comparison document of two therapeutic approaches that you have reviewed for accuracy using your clinical expertise.</div>';

EXERCISE_HELP['8-3'] = '<strong>Goal:</strong> Create a patient-friendly handout using AI, written at an accessible reading level.<ol><li>Open either ChatGPT or Claude.</li><li>Choose a topic for your handout. Some ideas relevant to your practice:<ul><li>Understanding anxiety: what happens in your brain and body</li><li>What to expect in your first therapy session</li><li>The neuroscience of recovery: why your brain can heal</li><li>Healthy coping strategies for managing difficult emotions</li><li>Understanding addiction as a brain condition, not a character flaw</li></ul></li><li>Use this prompt (fill in your topic):<br><em>&ldquo;Create a patient-friendly handout about [topic]. Write it at an 8th grade reading level using simple, warm language. Include: (1) A brief explanation of the topic in everyday terms, (2) Why it matters for the person reading it, (3) 3&ndash;5 practical steps they can take today, and (4) An encouraging closing message. Format it so it could be printed on a single page. Avoid clinical jargon.&rdquo;</em></li><li>Read the handout carefully. Ask yourself:<ul><li>Would a client without any clinical background understand every sentence?</li><li>Is the tone warm and encouraging, not clinical or cold?</li><li>Is the information accurate based on your expertise?</li><li>Would you feel comfortable handing this to a client?</li></ul></li><li>Ask AI to revise anything that needs adjustment: <em>&ldquo;The third paragraph uses too much jargon. Can you simplify it further?&rdquo;</em> or <em>&ldquo;Can you make the tone warmer and more encouraging?&rdquo;</em></li><li>Copy the final version into Word, add your practice header if desired, and save it to Practice &rarr; Client Resources &rarr; Handouts.</li></ol><div class="expected-result">&#9989; Expected result: A one-page, patient-friendly handout on a clinical topic, written in accessible language, reviewed for accuracy, and saved in your files.</div>';

EXERCISE_HELP['8-4'] = '<strong>Goal:</strong> Use AI to generate intervention ideas and evaluate them with your clinical judgment.<ol><li>Open either ChatGPT or Claude.</li><li>Think of a common clinical scenario you encounter regularly. For example:<ul><li>A client in early recovery who is struggling with cravings</li><li>A couple where one partner shuts down during conflict</li><li>A client with anxiety who intellectualizes everything and resists emotional exploration</li><li>A mandated client who does not want to be in therapy</li></ul></li><li>Use this prompt (fill in your scenario):<br><em>&ldquo;I am a licensed MFT/LADT with 40+ years of clinical experience. Generate 5 creative, evidence-based intervention ideas for the following clinical scenario: [describe your scenario in de-identified terms]. For each intervention, include: (1) the technique name, (2) a brief description of how to implement it in session, (3) what therapeutic theory it draws from, and (4) what client response to expect.&rdquo;</em></li><li>Read through the 5 suggestions. For each one, evaluate with your clinical judgment:<ul><li>Is this appropriate for the scenario?</li><li>Have I used something similar? Did it work?</li><li>Would this fit my therapeutic style?</li><li>Are there any clients for whom this would NOT be appropriate?</li></ul></li><li>In Apple Notes, jot down which suggestions you found useful and any modifications you would make based on your experience.</li></ol><div class="expected-result">&#9989; Expected result: 5 AI-generated intervention ideas that you have evaluated with your clinical expertise, with notes on which ones you might actually use (with modifications).</div>';

EXERCISE_HELP['8-5'] = '<strong>Goal:</strong> Ask AI to create a continuing education study guide for a topic you are currently learning.<ol><li>Open either ChatGPT or Claude.</li><li>Think about a topic you are currently studying, reading about, or want to learn more about for your continuing education. For example:<ul><li>Polyvagal theory and its clinical applications</li><li>Trauma-informed care updates</li><li>The neuroscience of addiction and recovery</li><li>Advances in attachment-based therapy</li><li>Motivational interviewing &mdash; advanced techniques</li></ul></li><li>Use this prompt:<br><em>&ldquo;Create a comprehensive study guide on [topic] for a licensed therapist pursuing continuing education. Include: (1) Key concepts and definitions, (2) Important theorists and researchers to know, (3) Clinical applications and practical examples, (4) 10 review questions that test understanding at a professional level, and (5) Suggested further reading. Focus on material relevant to clinical practice with adult clients.&rdquo;</em></li><li>Review the study guide. Try answering the review questions yourself to test your understanding.</li><li>If you want more depth, ask: <em>&ldquo;Can you expand on question 4 and explain why the correct answer matters clinically?&rdquo;</em></li><li>Save the study guide in your Practice &rarr; CE Materials folder for future reference.</li></ol><div class="expected-result">&#9989; Expected result: A study guide with key concepts, review questions, and suggested reading on a CE topic, saved in your CE Materials folder.</div>';

EXERCISE_HELP['8-6'] = '<strong>Goal:</strong> Practice the essential skill of de-identifying a real clinical situation before discussing it with AI.<ol><li>Think of a real clinical situation from your practice &mdash; something you have worked with that presents an interesting clinical question.</li><li>Now, in Apple Notes, rewrite it as a <strong>completely de-identified hypothetical case</strong>. Here is how to transform real details:<ul><li><strong>Change the name</strong> entirely &mdash; or better yet, use no name at all: &ldquo;a client&rdquo;</li><li><strong>Change the age</strong> to a range: &ldquo;in their 40s&rdquo; instead of an exact age</li><li><strong>Change the gender</strong> if it is not clinically relevant</li><li><strong>Change specific details</strong>: different occupation, different city, different family constellation</li><li><strong>Keep only the clinically relevant features</strong>: the presenting problem, the therapeutic dynamic, the clinical question</li><li><strong>Remove all dates, locations, and identifying circumstances</strong></li></ul></li><li>Example transformation:<ul><li><strong>Real (never share this):</strong> &ldquo;John Smith, 47, accountant in Pasadena, referred by Dr. Garcia on January 15, presenting with alcohol dependency and marital conflict after his wife discovered his relapse at their son\'s wedding.&rdquo;</li><li><strong>De-identified (safe to discuss):</strong> &ldquo;A client in their late 40s, professional occupation, presenting with co-occurring alcohol use disorder and significant marital conflict. A recent relapse was discovered by the spouse during a family event, leading to a crisis in trust.&rdquo;</li></ul></li><li>Once you have your de-identified version, you could safely ask AI: <em>&ldquo;What therapeutic approaches would you recommend for a client presenting with this situation?&rdquo;</em></li></ol><div class="expected-result">&#9989; Expected result: A side-by-side example showing how you transformed a real clinical situation into a fully de-identified hypothetical case that is safe to discuss with AI.</div>';

// ---- WEEK 9: Desktop Apps & Extensions ----

EXERCISE_HELP['9-0'] = '<strong>Goal:</strong> Download and install the Claude desktop app on your Mac.<ol><li>Open Safari and go to <strong>claude.ai/download</strong></li><li>The page should automatically detect you are on a Mac and offer the Mac download. Click the <strong>Download</strong> button.</li><li>Once the download completes, open your <strong>Downloads</strong> folder (click the Downloads icon in your Dock, or open Finder and go to Downloads).</li><li>You will see a file called something like &ldquo;Claude.dmg&rdquo;. Double-click it.</li><li>A window will open showing the Claude app icon and an Applications folder. <strong>Drag the Claude icon into the Applications folder</strong> &mdash; just like you learned in Week 1.</li><li>Open the Claude app: press <kbd>&#8984;</kbd> + <kbd>Space</kbd> (Spotlight), type &ldquo;Claude,&rdquo; and press Enter.</li><li>Sign in with the same Claude account you created in Week 7 (your email or Google account).</li><li>If your Mac asks &ldquo;Are you sure you want to open an application downloaded from the Internet?&rdquo; click <strong>Open</strong>. This is normal and safe.</li><li>Consider adding Claude to your Dock for easy access: right-click the Claude icon in the Dock while it is running and select <strong>Options &rarr; Keep in Dock</strong>.</li></ol><div class="expected-result">&#9989; Expected result: The Claude desktop app is installed, you are signed in, and you can see the familiar conversation interface &mdash; now running as a dedicated app on your Mac.</div>';

EXERCISE_HELP['9-1'] = '<strong>Goal:</strong> Create a Claude Project to organize your AI conversations by topic.<ol><li>Open the Claude desktop app.</li><li>Look at the left sidebar. You should see a section for <strong>Projects</strong>. Click on it, then click <strong>Create Project</strong> (or the &ldquo;+&rdquo; button).</li><li>Name your project something meaningful: <strong>&ldquo;Neuroscience Research&rdquo;</strong>, <strong>&ldquo;Research&rdquo;</strong>, or whatever fits your primary interest.</li><li>Once the project is created, click into it to start a new conversation.</li><li>Try a conversation about a neuroscience topic. Here are some prompts you can use:<ul><li><em>&ldquo;What are the most clinically relevant findings about neuroplasticity and trauma recovery from the last decade?&rdquo;</em></li><li><em>&ldquo;Explain the neuroscience of how the therapeutic relationship actually changes the brain. Focus on findings relevant to long-term therapy with adults.&rdquo;</em></li><li><em>&ldquo;Summarize the key ideas from interpersonal neurobiology and how they apply to family therapy.&rdquo;</em></li></ul></li><li>Notice that your conversation is now organized <em>within</em> the project. All future conversations you start in this project will stay grouped together &mdash; just like having a dedicated folder for a research topic.</li><li>You can start multiple conversations within the same project on different subtopics.</li></ol><div class="expected-result">&#9989; Expected result: A Claude Project named &ldquo;Research&rdquo; (or similar) with at least one conversation inside it about a neuroscience topic.</div>';

EXERCISE_HELP['9-2'] = '<strong>Goal:</strong> Download and install the ChatGPT desktop app on your Mac.<ol><li><strong>Option A &mdash; App Store:</strong> Open the <strong>App Store</strong> (press <kbd>&#8984;</kbd> + <kbd>Space</kbd>, type &ldquo;App Store,&rdquo; press Enter). Search for &ldquo;ChatGPT&rdquo; by OpenAI. Click <strong>Get</strong>, then <strong>Install</strong>.</li><li><strong>Option B &mdash; Direct download:</strong> Open Safari and go to <strong>openai.com</strong>. Look for a &ldquo;Download&rdquo; link for the Mac desktop app. Download and install it the same way you installed Claude (drag to Applications).</li><li>Once installed, open ChatGPT: press <kbd>&#8984;</kbd> + <kbd>Space</kbd> (Spotlight), type &ldquo;ChatGPT,&rdquo; and press Enter.</li><li>Sign in with the same ChatGPT account you created in Week 7.</li><li>You should see the familiar chat interface, now as a standalone app on your Mac.</li><li>Notice the <strong>menu bar icon</strong> at the top of your screen &mdash; ChatGPT may add a small icon there for quick access at any time.</li><li>Add ChatGPT to your Dock: right-click its icon in the Dock while it is running and select <strong>Options &rarr; Keep in Dock</strong>.</li><li>Try a quick conversation to confirm everything works: <em>&ldquo;Hello! Can you tell me something interesting about the neuroscience of empathy?&rdquo;</em></li></ol><div class="expected-result">&#9989; Expected result: The ChatGPT desktop app is installed, you are signed in, and you have confirmed it works with a test conversation.</div>';

EXERCISE_HELP['9-3'] = '<strong>Goal:</strong> Try ChatGPT voice mode &mdash; have a spoken conversation with AI for 5 minutes.<ol><li>Open the <strong>ChatGPT desktop app</strong> (or open chatgpt.com in Safari).</li><li>Look for the <strong>headphone icon</strong> (&#127911;) in the message area. Click it to start voice mode.</li><li>You may need to grant ChatGPT permission to use your Mac\'s microphone. If prompted, click <strong>Allow</strong>.</li><li>Once voice mode is active, simply <strong>speak your question out loud</strong>. ChatGPT will listen, then respond with a natural-sounding voice.</li><li>Try these conversation starters (just say them aloud):<ul><li><em>&ldquo;Tell me about the latest neuroscience research on how therapy changes the brain.&rdquo;</em></li><li><em>&ldquo;What is the most interesting thing about neuroplasticity in older adults?&rdquo;</em></li><li><em>&ldquo;Can you explain polyvagal theory as if you were explaining it to a colleague over lunch?&rdquo;</em></li></ul></li><li>Have a back-and-forth conversation for about 5 minutes. Ask follow-up questions, request clarification, or change topics &mdash; just as you would in a real conversation.</li><li>When you are done, click the headphone icon again to end voice mode.</li><li>Reflect on the experience: Did it feel different from typing? More natural? More conversational? Many people find voice mode especially useful for brainstorming and thinking out loud.</li></ol><div class="expected-result">&#9989; Expected result: You have had a 5-minute spoken conversation with ChatGPT using voice mode and noticed how it differs from the typing experience.</div>';

EXERCISE_HELP['9-4'] = '<strong>Goal:</strong> Try Claude Cowork by asking Claude to create a professional document and notice the artifact panel.<ol><li>Open the <strong>Claude desktop app</strong>.</li><li>Start a new conversation (you can do this inside a project or as a standalone conversation).</li><li>Ask Claude to create a professional document. Try one of these prompts:<ul><li><em>&ldquo;Create a treatment plan template for an adult client presenting with co-occurring anxiety and substance use disorder. Format it as a professional document with clear sections and placeholders I can fill in.&rdquo;</em></li><li><em>&ldquo;Write a one-page workshop outline on building emotional safety in the first five sessions of therapy. Include learning objectives, key talking points, and a discussion exercise.&rdquo;</em></li><li><em>&ldquo;Create a patient handout about the neuroscience of recovery from addiction. Use simple language and an encouraging tone.&rdquo;</em></li></ul></li><li>Watch for the <strong>artifact panel</strong> &mdash; when Claude creates a document, it should appear as a formatted artifact on the right side of your screen, separate from the conversation.</li><li>Notice that the artifact is a real, standalone document. You can:<ul><li><strong>Copy it</strong> to paste into Word (click the copy button on the artifact)</li><li><strong>Ask Claude to revise it</strong>: <em>&ldquo;Can you make the language simpler?&rdquo;</em> or <em>&ldquo;Add a section on self-care strategies.&rdquo;</em> Claude will update the artifact directly.</li></ul></li><li>Try copying the artifact into Microsoft Word to see how the formatting transfers.</li></ol><div class="expected-result">&#9989; Expected result: Claude has created a formatted document artifact that you can see, copy, and refine &mdash; and you understand how to transfer it to Word.</div>';

EXERCISE_HELP['9-5'] = '<strong>Goal:</strong> Use Gmail\'s &ldquo;Help Me Write&rdquo; AI feature to draft a professional email.<ol><li>Open Safari and go to <strong>mail.google.com</strong> (Gmail).</li><li>Click <strong>Compose</strong> to start a new email.</li><li>In the compose window, look for the <strong>Help Me Write</strong> button &mdash; it may appear as a pencil icon or a &ldquo;Help me write&rdquo; text link near the bottom of the compose area. (Note: this feature requires Google Workspace or may be available as part of Gmail\'s experimental features.)</li><li>If you see the feature, click it and type a brief description of what you want to say. For example:<ul><li><em>&ldquo;Write a professional email to a colleague thanking them for a referral and confirming that I have availability for new clients next month.&rdquo;</em></li><li><em>&ldquo;Draft a follow-up email to a CE provider asking about upcoming workshops on trauma-informed care.&rdquo;</em></li></ul></li><li>Gmail will generate a draft email. Read it carefully and edit it to match your voice and add specific details.</li><li>If &ldquo;Help Me Write&rdquo; is not available in your Gmail, try this alternative: open Claude or ChatGPT and use this prompt:<br><em>&ldquo;Draft a professional email from me (a licensed MFT/LADT) to a colleague, thanking them for a referral and confirming my availability for new clients next month. Keep it warm but professional.&rdquo;</em><br>Then copy the result into your Gmail compose window.</li><li>Either way, always review and personalize before sending.</li></ol><div class="expected-result">&#9989; Expected result: You have used an AI tool (Gmail\'s Help Me Write or ChatGPT/Claude) to draft a professional email, then reviewed and personalized it.</div>';

EXERCISE_HELP['9-6'] = '<strong>Goal:</strong> Compare how Claude and ChatGPT handle the same task to understand their different strengths.<ol><li>Choose a specific task to test with both tools. Here is a good one:<br><em>&ldquo;Summarize the current state of research on the neuroscience of therapeutic presence &mdash; what happens in the therapist\'s brain during attunement with a client. Focus on practical implications for clinical work.&rdquo;</em></li><li>Open the <strong>Claude desktop app</strong>. Start a new conversation and paste or type the prompt. Press Return.</li><li>Open the <strong>ChatGPT desktop app</strong>. Start a new conversation and paste the exact same prompt. Press Return.</li><li>Now compare the two responses side by side. In Apple Notes, create a note titled &ldquo;Tool Comparison &mdash; [Topic].&rdquo; Write down your observations:<ul><li><strong>Depth:</strong> Which response went deeper into the research?</li><li><strong>Practical value:</strong> Which gave more actionable clinical insights?</li><li><strong>Writing quality:</strong> Which was better organized and easier to read?</li><li><strong>Citations:</strong> Which provided more verifiable references?</li><li><strong>Tone:</strong> Which felt more appropriate for a seasoned clinician?</li></ul></li><li>Based on this comparison, note which tool you would prefer for different types of tasks. For example, you might find Claude better for in-depth research and ChatGPT better for quick questions.</li></ol><div class="expected-result">&#9989; Expected result: A note documenting your side-by-side comparison of Claude and ChatGPT on the same research task, with observations about when to use each tool.</div>';

EXERCISE_HELP['9-7'] = '<strong>Goal:</strong> Set up a second Claude Project to organize a different area of your work.<ol><li>Open the <strong>Claude desktop app</strong>.</li><li>Go to the <strong>Projects</strong> section in the left sidebar.</li><li>Click <strong>Create Project</strong> (or the &ldquo;+&rdquo; button).</li><li>Choose a name for a second area of your work. Some suggestions:<ul><li><strong>&ldquo;Patient Materials&rdquo;</strong> &mdash; for creating handouts, worksheets, and psychoeducation resources</li><li><strong>&ldquo;Workshop Prep&rdquo;</strong> &mdash; for developing presentations, outlines, and training materials</li><li><strong>&ldquo;Continuing Education&rdquo;</strong> &mdash; for study guides, article summaries, and CE-related conversations</li><li><strong>&ldquo;Treatment Models&rdquo;</strong> &mdash; for exploring and comparing therapeutic approaches</li></ul></li><li>Once created, start a conversation in your new project. Try something relevant to that project\'s theme:<ul><li>For Patient Materials: <em>&ldquo;Create a one-page handout explaining the neuroscience of anxiety in simple terms for patients.&rdquo;</em></li><li>For Workshop Prep: <em>&ldquo;Help me outline a 90-minute workshop on building therapeutic alliance with resistant clients.&rdquo;</em></li><li>For CE: <em>&ldquo;Create a study guide for the key concepts of polyvagal theory and its clinical applications.&rdquo;</em></li></ul></li><li>Now you have two organized projects in Claude &mdash; one for research and one for another professional area. Each keeps its conversations separate and focused.</li></ol><div class="expected-result">&#9989; Expected result: You now have at least two Claude Projects, each with a clear purpose, and at least one conversation in each.</div>';

// ---- WEEK 10: Customizing AI & Your Prompt Library ----

EXERCISE_HELP['10-0'] = '<strong>Goal:</strong> Write a custom instruction / system prompt for a Claude Project that personalizes every future conversation.<ol><li>Open the <strong>Claude desktop app</strong> and click on one of your Projects (e.g., &ldquo;Research&rdquo; or &ldquo;Neuroscience Research&rdquo;).</li><li>Look for the <strong>Project settings</strong> or <strong>instructions</strong> area. This is where you can write instructions that Claude will follow in every conversation within this project.</li><li>Write your custom instructions. Here is a template you can adapt &mdash; fill in or modify the details to match your preferences:<br><br><em>You are assisting David, a licensed Marriage and Family Therapist (LMFT) and Licensed Alcohol and Drug Therapist (LADT) with over 40 years of clinical experience.</em><br><br><em>Professional interests: neuroscience advances and clinical applications, evidence-based treatment models, skill development, emotional safety and patient trust in the therapeutic relationship, the intersection of spiritual maturity and therapeutic outcomes.</em><br><br><em>When responding:</em><br><em>&bull; Explain concepts clearly without unnecessary jargon</em><br><em>&bull; When citing research, note the year and authors so I can verify</em><br><em>&bull; Focus on practical clinical implications, not just theory</em><br><em>&bull; Use bullet points and clear structure for easy reading</em><br><em>&bull; Acknowledge the depth of my clinical experience &mdash; do not oversimplify</em><br><em>&bull; If unsure about something, say so rather than guessing</em></li><li>Save the instructions.</li><li>Test them by starting a new conversation in the project: <em>&ldquo;What are the most significant neuroscience findings about the therapeutic relationship in the last five years?&rdquo;</em></li><li>Notice how Claude now responds with an awareness of who you are and what you need &mdash; without you having to explain your background every time.</li></ol><div class="expected-result">&#9989; Expected result: Your Claude Project now has custom instructions saved, and new conversations automatically reflect your professional background and preferences.</div>';

EXERCISE_HELP['10-1'] = '<strong>Goal:</strong> Set up ChatGPT Custom Instructions so it knows your background and preferences.<ol><li>Open the <strong>ChatGPT desktop app</strong> (or go to chatgpt.com).</li><li>Click your <strong>name or profile icon</strong> in the lower-left corner.</li><li>Select <strong>Settings</strong>.</li><li>Go to <strong>Personalization</strong>, then <strong>Custom Instructions</strong>.</li><li>You will see two fields. Fill them in as follows:</li><li><strong>Field 1: &ldquo;What would you like ChatGPT to know about you?&rdquo;</strong><br>Paste or type something like:<br><em>&ldquo;I am a licensed Marriage and Family Therapist (LMFT) and Licensed Alcohol and Drug Therapist (LADT) with over 40 years of clinical experience. I specialize in substance use treatment, family therapy, and neuroscience-informed approaches. My professional interests include neuroplasticity, evidence-based treatment models, emotional safety and patient trust, and the intersection of spiritual maturity and therapeutic outcomes. I work primarily with adult clients.&rdquo;</em></li><li><strong>Field 2: &ldquo;How would you like ChatGPT to respond?&rdquo;</strong><br>Paste or type something like:<br><em>&ldquo;Please use clear, professional language without unnecessary jargon. When citing research, include year and authors so I can verify. Focus on practical clinical applications rather than purely theoretical information. Use structured formats &mdash; bullet points, numbered lists, or tables &mdash; when presenting multiple items. Respect my level of experience and avoid over-simplifying. If you are unsure about something, say so.&rdquo;</em></li><li>Click <strong>Save</strong>.</li><li>Test it by starting a new conversation: <em>&ldquo;What should I know about recent advances in trauma treatment?&rdquo;</em> Notice how the response is now tailored to your professional level and interests.</li></ol><div class="expected-result">&#9989; Expected result: ChatGPT Custom Instructions are saved with your professional background and communication preferences, and new conversations reflect this personalization.</div>';

EXERCISE_HELP['10-2'] = '<strong>Goal:</strong> Test 3 prompts from the prompt library on real topics that matter to you.<ol><li>Go back to the <strong>Week 10 lesson</strong> and find the <strong>&ldquo;Your Prompt Library&rdquo;</strong> section. You will see 8 prompt templates.</li><li>Choose 3 templates that are most relevant to your current interests. Here are especially good ones to start with:<ul><li><strong>Neuroscience Research:</strong> Fill in a specific topic like &ldquo;the default mode network and therapeutic presence&rdquo; or &ldquo;neuroplasticity in addiction recovery&rdquo;</li><li><strong>Treatment Model Comparison:</strong> Fill in two approaches you use, like &ldquo;Motivational Interviewing&rdquo; and &ldquo;12-Step Facilitation&rdquo; for substance use</li><li><strong>Patient Handout Generator:</strong> Fill in a topic like &ldquo;understanding how therapy changes your brain&rdquo; or &ldquo;coping strategies for early recovery&rdquo;</li></ul></li><li>For each template:<ul><li>Click the prompt block in the lesson to copy it (or select and <kbd>&#8984;</kbd> + <kbd>C</kbd>)</li><li>Paste it into Claude or ChatGPT (<kbd>&#8984;</kbd> + <kbd>V</kbd>)</li><li>Replace the bracketed sections [like this] with your specific topic</li><li>Press Return and review the response</li></ul></li><li>After testing all three, make a note about which templates produced the most useful results. These become your go-to prompts.</li></ol><div class="expected-result">&#9989; Expected result: You have tested 3 prompt templates from the library with your own specific topics and identified which ones are most valuable for your work.</div>';

EXERCISE_HELP['10-3'] = '<strong>Goal:</strong> Take a prompt template and customize it for a specific, current need in your practice.<ol><li>Think about something you are currently working on or need in your practice right now. For example:<ul><li>A specific workshop you are preparing</li><li>A treatment approach you want to learn more about</li><li>A patient population you are working with who presents a particular challenge</li><li>A CE requirement you need to fulfill</li></ul></li><li>Choose the prompt template from the library that is closest to what you need.</li><li>Modify it by:<ul><li>Adding <strong>more specific details</strong> about your exact situation</li><li>Adjusting the <strong>requested format</strong> to match how you will actually use the output</li><li>Including <strong>constraints or preferences</strong> unique to your need</li></ul></li><li>Example modification: Start with the Workshop Content template and customize it:<br><br><strong>Original:</strong> <em>&ldquo;I\'m preparing a [duration] workshop for [audience] on [topic]...&rdquo;</em><br><br><strong>Modified:</strong> <em>&ldquo;I\'m preparing a 2-hour workshop for early-career therapists (1&ndash;5 years experience) at a community mental health center on building emotional safety with mandated clients. Most attendees work with substance use populations. Include at least two interactive role-play exercises. The tone should be warm and encouraging &mdash; many of these therapists feel overwhelmed by resistant clients. Include handout materials they can take with them.&rdquo;</em></li><li>Test your modified prompt in Claude or ChatGPT. Compare the result to what you would have gotten from the generic template.</li><li>Save your modified prompt in Apple Notes for future reuse.</li></ol><div class="expected-result">&#9989; Expected result: A customized prompt template that addresses a specific, current need in your practice, tested and saved for reuse.</div>';

EXERCISE_HELP['10-4'] = '<strong>Goal:</strong> Create your own original prompt template for a recurring professional task.<ol><li>Think about tasks you do regularly in your professional life that are <strong>not already covered</strong> by the prompt templates in the lesson. Consider:<ul><li>Writing supervision notes or consultation summaries</li><li>Preparing for a specific type of clinical session (first sessions, termination, crisis)</li><li>Reviewing new medications and their clinical implications</li><li>Writing insurance appeal letters or prior authorization justifications</li><li>Preparing for peer consultation &mdash; organizing your thinking about a case</li><li>Creating group therapy session plans</li><li>Developing psychoeducation materials for specific populations</li></ul></li><li>Write your template using the RICE structure you learned in Week 7:<ul><li><strong>Role:</strong> Who should the AI be? (e.g., &ldquo;You are an experienced clinical supervisor...&rdquo;)</li><li><strong>Instructions:</strong> What specifically do you want? (Be as detailed as possible)</li><li><strong>Context:</strong> Your background and why you need this</li><li><strong>Examples:</strong> The format you want (table, outline, narrative, etc.)</li></ul></li><li>Include <strong>brackets [ ]</strong> for the parts that will change each time you use the template.</li><li>Example original template:<br><em>&ldquo;You are an experienced clinical supervisor. I am preparing for peer consultation and need to organize my thinking about a hypothetical clinical case. The client presents with [presenting concerns] and the therapeutic challenge I am facing is [describe challenge]. Help me: (1) identify possible clinical dynamics at play, (2) suggest 3 evidence-based approaches I might consider, (3) anticipate potential pitfalls, and (4) formulate 2&ndash;3 consultation questions I should bring to my peer group. Present this in a structured outline format.&rdquo;</em></li><li>Test your template in Claude or ChatGPT, filling in the brackets with real (but de-identified) details.</li><li>Save the template in Apple Notes in a folder called &ldquo;My AI Prompts.&rdquo;</li></ol><div class="expected-result">&#9989; Expected result: An original prompt template you created for a task you do regularly, tested and saved in a dedicated prompts folder for ongoing use.</div>';

EXERCISE_HELP['10-5'] = '<strong>Goal:</strong> Share one practical AI tip with a colleague to reinforce your learning and help someone else.<ol><li>Think about what you have learned over the past few weeks that a colleague might find useful. It could be:<ul><li>A specific prompt that produced a great result (e.g., the treatment plan template prompt)</li><li>A feature they might not know about (e.g., Claude Projects, ChatGPT voice mode)</li><li>A practical tip (e.g., always verify AI citations, use the RICE framework for better responses)</li><li>An insight about how AI works (e.g., it pattern-matches rather than thinks, which is why it can hallucinate)</li></ul></li><li>Choose the tip that would be most useful for the specific colleague you have in mind. Consider their role, their comfort with technology, and what they might find immediately practical.</li><li>Share it in whatever way feels natural:<ul><li>A quick conversation over coffee or at the office</li><li>A brief email or text message</li><li>During a consultation or supervision meeting</li></ul></li><li>Here is an example email you could send:<br><em>&ldquo;Hi [Name], I have been learning about AI tools for professional use and found something really useful. If you go to claude.ai and create a free account, you can ask it to summarize research topics or draft professional documents. One thing that worked well for me: I asked it to create a comparison table of two treatment approaches, and the result was genuinely helpful as a quick reference. Just remember that AI sometimes makes things up confidently (they call it \'hallucination\'), so always verify specific facts. Let me know if you want to hear more about it!&rdquo;</em></li><li>Teaching others is one of the best ways to solidify your own understanding.</li></ol><div class="expected-result">&#9989; Expected result: You have shared at least one practical AI tip with a colleague, reinforcing your own learning and contributing to someone else\'s professional development.</div>';

EXERCISE_HELP['10-6'] = '<strong>Goal:</strong> Write a thoughtful reflection on how AI might enhance your practice going forward.<ol><li>Open Apple Notes and create a new note titled &ldquo;My AI Reflection &mdash; [today\'s date].&rdquo;</li><li>Take 10&ndash;15 minutes to write honestly about your experience. Consider these questions:<ul><li><strong>What tasks will you use AI for regularly?</strong> Think about the exercises you found most valuable. Which AI outputs did you actually find useful enough to keep and refine? Summarizing research? Drafting templates? Creating patient materials? Brainstorming interventions?</li><li><strong>What boundaries will you maintain?</strong> What are the lines you will not cross? Where does clinical judgment remain non-negotiable? How will you protect client confidentiality?</li><li><strong>What excites you most?</strong> What possibilities opened up that you had not considered before? What felt genuinely useful rather than just novel?</li><li><strong>What concerns do you still have?</strong> It is healthy to maintain some skepticism. What would you want to watch for as you integrate AI into your workflow?</li><li><strong>How does this connect to your values?</strong> As someone who cares deeply about neuroscience, emotional safety, patient trust, and spiritual maturity in therapy &mdash; how does AI fit into that picture? Where does it serve those values, and where must you remain vigilant?</li></ul></li><li>Write in whatever style feels natural &mdash; paragraphs, bullet points, or a mix. This is for you, not for anyone else.</li><li>Save this reflection. It becomes a touchstone you can revisit as AI tools evolve and your relationship with them deepens.</li></ol><div class="expected-result">&#9989; Expected result: A personal, thoughtful reflection saved in Notes that captures your current thinking about AI in your professional life &mdash; including plans, boundaries, and values.</div>';
