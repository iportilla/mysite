// ---- State Management ----
function loadState() {
  try {
    const saved = localStorage.getItem('macAIFoundationsState');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch(e) {}
}

function saveState() {
  state.lastUpdated = new Date().toISOString();
  try {
    localStorage.setItem('macAIFoundationsState', JSON.stringify(state));
    showAutoSave();
  } catch(e) {}
}

function showAutoSave() {
  const el = document.getElementById('autoSaveIndicator');
  if (el) { el.style.opacity = '1'; setTimeout(() => { el.style.opacity = '0'; }, 2000); }
}

function exportProgress() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mac-ai-progress.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('\u{1F4BE}', 'Backup Exported!', 'Saved to Downloads');
}

function resetProgress() {
  if (!confirm('Are you sure you want to reset all progress? This will clear your XP, achievements, and all completed exercises. This cannot be undone.')) return;
  localStorage.removeItem('macAIFoundationsState');
  state = { xp: 0, level: 1, achievements: [], weeks: {}, reflections: {}, lastUpdated: null };
  updateXPDisplay();
  renderSidebarNav();
  navigate('dashboard');
  showToast('\u{1F504}', 'Progress Reset', 'Starting fresh!');
}

// ---- XP & Levels ----
function getCurrentLevel() {
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (state.xp >= LEVELS[i].xp) return LEVELS[i];
  }
  return LEVELS[0];
}

function getNextLevel() {
  const current = getCurrentLevel();
  const next = LEVELS.find(l => l.xp > state.xp);
  return next || current;
}

function updateXPDisplay() {
  const level = getCurrentLevel();
  const next = getNextLevel();
  const badge = document.getElementById('levelBadge');
  const xpText = document.getElementById('xpText');
  const bar = document.getElementById('xpBarFill');

  badge.textContent = `Lv ${level.level} \u00B7 ${level.title}`;
  badge.style.background = level.color;
  xpText.textContent = `${state.xp} / ${next.xp} XP`;

  const progress = next.xp > level.xp ? ((state.xp - level.xp) / (next.xp - level.xp)) * 100 : 100;
  bar.style.width = progress + '%';
}

function addXP(amount, message) {
  const oldLevel = getCurrentLevel().level;
  state.xp += amount;
  saveState();
  updateXPDisplay();
  showToast('\u26A1', message, '+' + amount + ' XP');

  const newLevel = getCurrentLevel().level;
  if (newLevel > oldLevel) {
    setTimeout(() => showLevelUp(getCurrentLevel()), 1500);
  }
}

// ---- Toast & Level Up ----
function showToast(icon, text, xp) {
  const toast = document.getElementById('xpToast');
  document.getElementById('toastText').textContent = text;
  document.getElementById('toastXp').textContent = xp;
  toast.querySelector('.toast-icon').textContent = icon;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function showLevelUp(level) {
  document.getElementById('levelUpEmoji').textContent = level.emoji;
  document.getElementById('newLevelText').textContent = `You're now a ${level.title}!`;
  document.getElementById('levelUpOverlay').classList.add('show');
  spawnConfetti();
}

function closeLevelUp() {
  document.getElementById('levelUpOverlay').classList.remove('show');
}

function spawnConfetti() {
  const colors = ['#0071e3', '#34c759', '#ff9500', '#af52de', '#5ac8fa', '#ffd60a', '#ff3b30'];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.top = '-10px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.width = (Math.random() * 8 + 4) + 'px';
    piece.style.height = (Math.random() * 8 + 4) + 'px';
    document.body.appendChild(piece);
    const duration = Math.random() * 2000 + 1500;
    piece.animate([
      { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${(Math.random() - 0.5) * 200}px, ${window.innerHeight + 20}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
    ], { duration, easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)' }).onfinish = () => piece.remove();
  }
}

// ---- Achievement System ----
function unlockAchievement(id) {
  if (state.achievements.includes(id)) return;
  state.achievements.push(id);
  saveState();
  const achievement = ACHIEVEMENTS.find(a => a.id === id);
  if (achievement) {
    showToast(achievement.icon, 'Achievement: ' + achievement.name, achievement.desc);
  }
}

// ---- Navigation ----
let currentPage = 'dashboard';

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navItem = document.querySelector('.nav-item[data-page="' + page + '"]');
  if (navItem) navItem.classList.add('active');

  if (page === 'dashboard') {
    renderDashboard();
  } else if (page.startsWith('week-')) {
    const weekNum = parseInt(page.split('-')[1]);
    renderWeek(weekNum);
  }

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobileOverlay').classList.remove('show');
  document.getElementById('mainContent').scrollTop = 0;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mobileOverlay').classList.toggle('show');
}

// ---- Render Sidebar Navigation ----
const NAV_TOOLTIPS = {
  1: 'Desktop, Finder, Spotlight, Dock, shortcuts, screenshots',
  2: 'File system, folders, iCloud Drive, security basics',
  3: 'Calendar, Reminders, Notes, Safari Tab Groups',
  4: 'Gmail labels & filters, Zoom, telehealth, contacts',
  5: 'Word templates, Excel tracking, PowerPoint presentations',
  6: 'What AI is, ChatGPT vs Claude, hallucinations, ethics',
  7: 'Account setup, prompting basics, RICE framework',
  8: 'Research, writing, CE materials, patient handouts',
  9: 'Claude desktop, ChatGPT desktop, Cowork, Gmail AI',
  10: 'Custom instructions, memory, 8 prompt templates'
};

function renderSidebarNav() {
  const container = document.getElementById('weekNavItems');
  container.innerHTML = WEEKS.map(week => {
    const weekState = state.weeks[week.num] || {};
    const totalItems = (week.exercises || []).length + 1;
    let completedItems = weekState.lessonComplete ? 1 : 0;
    const exercises = weekState.exercises || [];
    completedItems += exercises.filter(Boolean).length;
    const pct = Math.round((completedItems / totalItems) * 100);
    const isComplete = pct === 100;

    const ringOrCheck = isComplete
      ? '<div class="week-complete-check">\u2713</div>'
      : '<svg class="progress-ring-small" viewBox="0 0 28 28"><circle class="ring-bg" cx="14" cy="14" r="11"/><circle class="ring-fill" cx="14" cy="14" r="11" stroke-dasharray="' + (2 * Math.PI * 11) + '" stroke-dashoffset="' + (2 * Math.PI * 11 * (1 - pct/100)) + '"/></svg>';

    const tooltip = NAV_TOOLTIPS[week.num] || week.subtitle;
    const isActive = currentPage === ('week-' + week.num);
    return '<div class="nav-item' + (isActive ? ' active' : '') + '" data-page="week-' + week.num + '" onclick="navigate(\'week-' + week.num + '\')" title="' + tooltip + '">' +
      '<span class="week-num">' + week.num + '</span>' +
      '<div class="week-info"><div class="week-title">' + week.title + '</div></div>' +
      ringOrCheck + '</div>';
  }).join('');
}

// ---- Render Dashboard ----
function renderDashboard() {
  const content = document.getElementById('contentArea');
  const level = getCurrentLevel();
  const totalExercises = WEEKS.reduce((sum, w) => sum + (w.exercises || []).length, 0);
  const totalLessons = WEEKS.length;
  const totalItems = totalExercises + totalLessons;

  let completedItems = 0;
  WEEKS.forEach(w => {
    const ws = state.weeks[w.num] || {};
    if (ws.lessonComplete) completedItems++;
    completedItems += (ws.exercises || []).filter(Boolean).length;
  });

  const overallPct = Math.round((completedItems / totalItems) * 100);

  content.innerHTML =
    '<div class="section-header">' +
      '<h2>Welcome, David</h2>' +
      '<div class="section-subtitle">Here\'s your progress so far.</div>' +
    '</div>' +
    '<div class="dashboard-grid">' +
      '<div class="stat-card"><div class="stat-label">Total XP</div><div class="stat-value" style="color:var(--accent)">' + state.xp.toLocaleString() + '</div><div class="stat-detail">Level ' + level.level + ' \u2014 ' + level.title + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Overall Progress</div><div class="stat-value">' + overallPct + '%</div><div class="stat-detail">' + completedItems + ' of ' + totalItems + ' items complete</div></div>' +
      '<div class="stat-card"><div class="stat-label">Weeks Completed</div><div class="stat-value">' + WEEKS.filter(w => getWeekPct(w.num) === 100).length + ' / ' + WEEKS.length + '</div><div class="stat-detail">Keep going!</div></div>' +
      '<div class="stat-card"><div class="stat-label">Achievements</div><div class="stat-value">' + state.achievements.length + ' / ' + ACHIEVEMENTS.length + '</div><div class="stat-detail">' + (ACHIEVEMENTS.length - state.achievements.length) + ' left to unlock</div></div>' +
    '</div>' +
    '<h3 style="font-size:18px;font-weight:600;margin:32px 0 16px;">Timeline</h3>' +
    '<div class="timeline">' +
      WEEKS.map((w, i) => {
        const pct = getWeekPct(w.num);
        const status = pct === 100 ? 'completed' : (pct > 0 ? 'current' : '');
        return (i > 0 ? '<div class="timeline-line' + (pct === 100 || getWeekPct(WEEKS[i-1].num) === 100 ? ' completed' : '') + '"></div>' : '') +
          '<div class="timeline-dot ' + status + '" title="Week ' + w.num + ': ' + w.title + '">' + w.num + '</div>';
      }).join('') +
    '</div>' +
    '<h3 style="font-size:18px;font-weight:600;margin:32px 0 16px;">Weekly Progress</h3>' +
    '<div class="weekly-bars">' +
      WEEKS.map(w => {
        const pct = getWeekPct(w.num);
        return '<div class="weekly-bar-row"><span class="weekly-bar-label">Week ' + w.num + '</span><div class="weekly-bar-track"><div class="weekly-bar-fill' + (pct === 100 ? ' complete' : '') + '" style="width:' + pct + '%"></div></div><span class="weekly-bar-pct">' + pct + '%</span></div>';
      }).join('') +
    '</div>' +
    '<h3 style="font-size:18px;font-weight:600;margin:32px 0 16px;">Achievements</h3>' +
    '<div class="achievement-grid">' +
      ACHIEVEMENTS.map(a => {
        const unlocked = state.achievements.includes(a.id);
        return '<div class="achievement-item ' + (unlocked ? 'unlocked' : 'locked') + '" title="' + a.desc + '"><div class="achievement-icon">' + a.icon + '</div><div class="achievement-name">' + a.name + '</div></div>';
      }).join('') +
    '</div>';
}

function getWeekPct(weekNum) {
  const week = WEEKS.find(w => w.num === weekNum);
  if (!week) return 0;
  const ws = state.weeks[weekNum] || {};
  const totalItems = (week.exercises || []).length + 1;
  let completed = ws.lessonComplete ? 1 : 0;
  completed += (ws.exercises || []).filter(Boolean).length;
  return Math.round((completed / totalItems) * 100);
}

// ---- Render Week ----
let currentSubTab = 'lesson';

function renderWeek(weekNum) {
  const week = WEEKS.find(w => w.num === weekNum);
  if (!week) return;
  const content = document.getElementById('contentArea');
  const ws = state.weeks[weekNum] || { lessonComplete: false, exercises: [], bonus: false };

  content.innerHTML =
    '<div class="section-header">' +
      '<h2>Week ' + week.num + ': ' + week.title + '</h2>' +
      '<div class="section-subtitle">' + week.subtitle + '</div>' +
      '<div class="section-meta">' +
        '<span>\u23F1 ' + week.time + '</span>' +
        '<span>\u{1F4D6} 1 Lesson</span>' +
        '<span>\u270F\uFE0F ' + week.exercises.length + ' Tasks</span>' +
        '<span>\u26A1 ' + (week.xpLesson + week.xpExercise + week.xpBonus) + ' XP possible</span>' +
      '</div>' +
    '</div>' +
    '<div class="sub-tabs">' +
      '<div class="sub-tab ' + (currentSubTab === 'lesson' ? 'active' : '') + '" onclick="switchSubTab(\'lesson\', ' + weekNum + ')">Lesson</div>' +
      '<div class="sub-tab ' + (currentSubTab === 'exercise' ? 'active' : '') + '" onclick="switchSubTab(\'exercise\', ' + weekNum + ')">Exercise</div>' +
    '</div>' +
    '<div id="subTabContent"></div>';

  if (currentSubTab === 'lesson') renderLesson(week, ws);
  else renderExercise(week, ws);
}

function switchSubTab(tab, weekNum) {
  currentSubTab = tab;
  renderWeek(weekNum);
}

function renderLesson(week, ws) {
  const container = document.getElementById('subTabContent');
  const lesson = week.lesson;
  const flipped = ws.flippedCards || [];

  const sectionsHtml = lesson.sections.map((s, i) => {
    const isFlipped = flipped.includes(i);
    const sectionId = 'section-' + week.num + '-' + i;
    return '<div class="flip-container ' + (isFlipped ? 'flipped' : '') + '" id="' + sectionId + '">' +
      '<div class="flip-card">' +
        '<div class="flip-front content-card" onclick="flipCard(' + week.num + ', ' + i + ', \'' + sectionId + '\')">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
            '<h3 style="margin:0;">' + s.heading + '</h3>' +
            '<div style="display:flex;align-items:center;gap:4px;">' +
              (!isFlipped ? '<span style="font-size:11px;color:var(--accent);font-weight:600;">+10 XP \u21BB</span>' : '<span style="font-size:11px;color:var(--green);font-weight:600;">\u2713 explored</span>') +
            '</div>' +
          '</div>' +
          s.content +
          '<div style="margin-top:12px;font-size:12px;color:var(--text-tertiary);text-align:center;">Click to explore deeper \u2192</div>' +
        '</div>' +
        '<div class="flip-back content-card" onclick="flipCard(' + week.num + ', ' + i + ', \'' + sectionId + '\')">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">' +
            '<h3 style="margin:0;">Why This Matters</h3>' +
            '<span style="font-size:12px;color:var(--text-tertiary);">\u2190 Click to flip back</span>' +
          '</div>' +
          '<div class="why-card"><p>' + getWhyText(week.num, i, s.heading) + '</p></div>' +
          getExtraResources(week.num, i, s.heading) +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  const videosHtml = lesson.videos && lesson.videos.length > 0 ?
    '<h3 style="font-size:16px;font-weight:600;margin:24px 0 12px;">\u{1F4FA} Watch and Learn</h3>' +
    lesson.videos.map(v => '<a class="video-card" href="' + v.url + '" target="_blank" rel="noopener"><div class="video-icon">\u25B6</div><div class="video-info"><div class="video-title">' + v.title + '</div><div class="video-duration">' + v.duration + '</div></div></a>').join('') : '';

  container.innerHTML =

        (ws.lessonComplete ? '\u2713 Lesson Complete' : 'Mark Lesson as Complete \u2014 +' + week.xpLesson + ' XP') +

}

      (!state.reflections[week.num] ?

// ---- Interaction Handlers ----
function markLessonComplete(weekNum) {
  if (!state.weeks[weekNum]) state.weeks[weekNum] = { lessonComplete: false, exercises: [], bonus: false };
  if (state.weeks[weekNum].lessonComplete) return;
  state.weeks[weekNum].lessonComplete = true;
  const week = WEEKS.find(w => w.num === weekNum);
  addXP(week.xpLesson, 'Lesson Complete!');
  renderWeek(weekNum);
  renderSidebarNav();
}

function toggleExercise(weekNum, index) {
  if (!state.weeks[weekNum]) state.weeks[weekNum] = { lessonComplete: false, exercises: [], bonus: false };
  const exercises = state.weeks[weekNum].exercises || [];
  while (exercises.length <= index) exercises.push(false);

  if (exercises[index]) {
    exercises[index] = false;
    state.weeks[weekNum].exercises = exercises;
    const week = WEEKS.find(w => w.num === weekNum);
    const exercise = week.exercises[index];
    state.xp = Math.max(0, state.xp - exercise.xp);
    saveState();
    updateXPDisplay();
    renderExercise(week, state.weeks[weekNum]);
    renderSidebarNav();
    return;
  }

  exercises[index] = true;
  state.weeks[weekNum].exercises = exercises;
  const week = WEEKS.find(w => w.num === weekNum);
  const exercise = week.exercises[index];
  addXP(exercise.xp, 'Task Complete!');

  if (week.achievementTrigger && week.achievementTrigger.exerciseIndex === index) {
    setTimeout(() => unlockAchievement(week.achievementTrigger.id), 1000);
  }

  renderExercise(week, state.weeks[weekNum]);
  renderSidebarNav();
}

function toggleBonus(weekNum) {
  if (!state.weeks[weekNum]) state.weeks[weekNum] = { lessonComplete: false, exercises: [], bonus: false };
  if (state.weeks[weekNum].bonus) return;
  state.weeks[weekNum].bonus = true;
  const week = WEEKS.find(w => w.num === weekNum);
  addXP(week.xpBonus, 'Bonus Challenge Complete!');
  renderExercise(week, state.weeks[weekNum]);
  renderSidebarNav();
}

function saveReflection(weekNum, value) {
  state.reflections[weekNum] = value;
  saveState();
}

function submitReflection(weekNum) {
  const textarea = document.querySelector('.reflection-area');
  if (!textarea.value.trim()) {
    showToast('\u270D\uFE0F', 'Write something first!', 'Even a sentence counts');
    return;
  }
  state.reflections[weekNum] = textarea.value;
  addXP(25, 'Reflection Submitted!');
  const week = WEEKS.find(w => w.num === weekNum);
  renderExercise(week, state.weeks[weekNum]);
}

// ---- Flip Card System ----
function flipCard(weekNum, sectionIndex, elementId) {
  if (!state.weeks[weekNum]) state.weeks[weekNum] = { lessonComplete: false, exercises: [], bonus: false, flippedCards: [] };
  if (!state.weeks[weekNum].flippedCards) state.weeks[weekNum].flippedCards = [];

  const el = document.getElementById(elementId);
  const flipped = state.weeks[weekNum].flippedCards;

  if (el.classList.contains('flipped')) {
    el.classList.remove('flipped');
  } else {
    el.classList.add('flipped');
    if (!flipped.includes(sectionIndex)) {
      flipped.push(sectionIndex);
      state.weeks[weekNum].flippedCards = flipped;
      addXP(10, 'Card Explored!');
      renderSidebarNav();
    }
  }
  saveState();
}
