WEEKS.push({
  num: 1,
  title: 'Your Mac Essentials',
  subtitle: 'Getting comfortable with the machine you already own',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'Your Mac Essentials',
    sections: [
      {
        heading: 'Your Mac vs. Your iPhone',
        content: '<p>You\'ve been using your iPhone for years, so you already know more than you think. Your Mac works with the same Apple account, the same iCloud, and many of the same apps. The difference is <em>scope</em>.</p>' +
          '<p>Think of it this way: if your iPhone is like your pocket notepad &mdash; great for reading, quick notes, and staying in touch &mdash; then your Mac is like your full office. It has the big desk, the filing cabinets, the printer, and room to spread out multiple projects at once. You can have your treatment plan open in Word, your CE tracker in Excel, your email in one corner, and a research article in another &mdash; all visible at the same time.</p>' +
          '<p>Here are the key differences:</p>' +
          '<table class="ref-table">' +
          '<tr><th>Feature</th><th>iPhone</th><th>Mac</th></tr>' +
          '<tr><td>Apps</td><td>One app fills the screen</td><td>Multiple windows side by side</td></tr>' +
          '<tr><td>Files</td><td>Hidden away inside apps</td><td>Visible in Finder, organized your way</td></tr>' +
          '<tr><td>Typing</td><td>On-screen keyboard</td><td>Full keyboard with shortcuts</td></tr>' +
          '<tr><td>Mouse/Trackpad</td><td>Touch only</td><td>Precise cursor control</td></tr>' +
          '<tr><td>Software</td><td>App Store only</td><td>App Store + downloaded programs</td></tr>' +
          '</table>' +
          '<p>Everything you\'ve learned on your iPhone &mdash; tapping, scrolling, pinching to zoom &mdash; transfers naturally to your Mac\'s trackpad. You\'re not starting from scratch. You\'re moving into a bigger office.</p>'
      },
      {
        heading: 'The Desktop and Finder',
        content: '<p>When your Mac starts up, the first thing you see is the <strong>Desktop</strong>. Think of it as the top of your desk at the office &mdash; it\'s where you can place files you\'re actively working on. But just like a physical desk, it works best when it\'s not buried under papers.</p>' +
          '<p>At the bottom of your screen, you\'ll see a row of app icons called the <strong>Dock</strong> (we\'ll cover that next). At the very top is the <strong>Menu Bar</strong>, which changes depending on which app you\'re using &mdash; just like how the options on a toolbar change depending on which program is in front of you.</p>' +
          '<p>The most important app on your Mac is <strong>Finder</strong> &mdash; it\'s the smiling blue face icon that\'s always in your Dock. Finder is your filing cabinet. It\'s how you browse, organize, move, copy, and find every file on your computer. When you click on Finder, a window opens showing your files and folders.</p>' +
          '<p>On the left side of every Finder window, you\'ll see a <strong>sidebar</strong> with shortcuts to important locations:</p>' +
          '<ul>' +
          '<li><strong>Desktop</strong> &mdash; files sitting on your desktop background</li>' +
          '<li><strong>Documents</strong> &mdash; your main document storage</li>' +
          '<li><strong>Downloads</strong> &mdash; where files from the internet land</li>' +
          '<li><strong>iCloud Drive</strong> &mdash; files synced across your devices</li>' +
          '</ul>' +
          '<p>You can drag folders into this sidebar to create your own shortcuts. For example, you might drag your "Practice" folder there so it\'s always one click away.</p>'
      },
      {
        heading: 'Spotlight &mdash; Your Secret Weapon',
        content: '<p>Imagine having an assistant who could instantly find any file, open any app, do math, convert measurements, and look up definitions &mdash; all in under a second. That\'s <strong>Spotlight</strong>.</p>' +
          '<p>To open Spotlight, press <kbd>&#8984;</kbd> + <kbd>Space</kbd> (the Command key plus the spacebar). A small search bar appears in the center of your screen. Just start typing what you want.</p>' +
          '<p>Here\'s what Spotlight can do:</p>' +
          '<ul>' +
          '<li><strong>Open apps:</strong> Type "Word" and hit Enter to launch Microsoft Word</li>' +
          '<li><strong>Find files:</strong> Type "treatment plan" and it finds any file with those words</li>' +
          '<li><strong>Do math:</strong> Type "147 + 283" and see the answer instantly</li>' +
          '<li><strong>Define words:</strong> Type "define countertransference" for a quick definition</li>' +
          '<li><strong>Search the web:</strong> Type anything and press Enter to search online</li>' +
          '</ul>' +
          '<p>Once you get in the habit of using Spotlight, you\'ll find it\'s faster than clicking through folders or scrolling through your Dock. Many experienced Mac users say it\'s the single feature they couldn\'t live without.</p>' +
          '<p>Here\'s a good way to start: every time you want to open an app, instead of looking for it in the Dock, press <kbd>&#8984;</kbd> + <kbd>Space</kbd>, type the first few letters of the app\'s name, and press Enter. Within a week, this will feel like second nature.</p>'
      },
      {
        heading: 'The Dock',
        content: '<p>The <strong>Dock</strong> is the row of icons at the bottom of your screen. It\'s your quick-access shelf &mdash; the apps and tools you use most often, always within reach.</p>' +
          '<p>The Dock has two sections, separated by a thin line:</p>' +
          '<ul>' +
          '<li><strong>Left side:</strong> Your favorite apps (ones you\'ve chosen to keep there)</li>' +
          '<li><strong>Right side:</strong> Recently opened apps, plus your Downloads folder and Trash</li>' +
          '</ul>' +
          '<p><strong>Customizing your Dock:</strong></p>' +
          '<ul>' +
          '<li><strong>Add an app:</strong> Drag it from Finder (Applications folder) to the left side of the Dock</li>' +
          '<li><strong>Remove an app:</strong> Drag it off the Dock and hold for a moment &mdash; it will vanish with a small "poof." The app itself is not deleted, just the shortcut.</li>' +
          '<li><strong>Rearrange:</strong> Click and drag any icon to a new position</li>' +
          '</ul>' +
          '<p>A small dot under an icon means that app is currently running. Your Mac can run many apps at the same time without any trouble.</p>' +
          '<p>To adjust the Dock\'s size or position, go to <strong>System Settings &rarr; Desktop &amp; Dock</strong>. You can make the icons larger if you prefer, move the Dock to the left or right side of the screen, or turn on "magnification" so icons grow larger when you hover over them.</p>'
      },
      {
        heading: 'Trackpad Gestures',
        content: '<p>Your Mac\'s trackpad understands more than just clicks. It recognizes <strong>gestures</strong> &mdash; simple finger movements that let you navigate quickly. If you\'ve used an iPhone, several of these will feel familiar.</p>' +
          '<table class="ref-table">' +
          '<tr><th>Gesture</th><th>How to Do It</th><th>What It Does</th></tr>' +
          '<tr><td>Click</td><td>Press down on the trackpad</td><td>Select items, open files</td></tr>' +
          '<tr><td>Secondary Click</td><td>Click with two fingers</td><td>Right-click menu (copy, paste, etc.)</td></tr>' +
          '<tr><td>Scroll</td><td>Slide two fingers up or down</td><td>Scroll through pages and documents</td></tr>' +
          '<tr><td>Zoom</td><td>Pinch two fingers apart or together</td><td>Zoom in or out (just like iPhone)</td></tr>' +
          '<tr><td>Swipe Between Pages</td><td>Swipe left or right with two fingers</td><td>Go back/forward in Safari</td></tr>' +
          '<tr><td>Mission Control</td><td>Swipe up with three fingers</td><td>See all open windows at once</td></tr>' +
          '<tr><td>Show Desktop</td><td>Spread out with thumb and three fingers</td><td>Push all windows aside to see Desktop</td></tr>' +
          '<tr><td>Swipe Between Desktops</td><td>Swipe left or right with three fingers</td><td>Switch between virtual desktops</td></tr>' +
          '</table>' +
          '<p>You can customize these gestures in <strong>System Settings &rarr; Trackpad</strong>. Each gesture has a short video demonstration right there in the settings, so you can practice along.</p>' +
          '<p>Don\'t try to memorize them all at once. Start with <strong>two-finger scroll</strong> and <strong>two-finger click</strong> (right-click). Once those feel natural, add one more gesture per week.</p>'
      },
      {
        heading: 'Keyboard Shortcuts &mdash; The Real Superpower',
        content: '<p>Keyboard shortcuts let you do common tasks in a fraction of a second, without lifting your hands from the keyboard. The key to shortcuts on a Mac is the <kbd>&#8984;</kbd> (Command) key, which sits right next to the spacebar.</p>' +
          '<p>Here are the shortcuts that will save you the most time:</p>' +
          '<table class="ref-table">' +
          '<tr><th>Shortcut</th><th>What It Does</th><th>When to Use It</th></tr>' +
          '<tr><td><kbd>&#8984;</kbd> + <kbd>C</kbd></td><td>Copy</td><td>Copy selected text or files</td></tr>' +
          '<tr><td><kbd>&#8984;</kbd> + <kbd>V</kbd></td><td>Paste</td><td>Paste what you copied</td></tr>' +
          '<tr><td><kbd>&#8984;</kbd> + <kbd>Z</kbd></td><td>Undo</td><td>Take back your last action &mdash; a lifesaver</td></tr>' +
          '<tr><td><kbd>&#8984;</kbd> + <kbd>S</kbd></td><td>Save</td><td>Save your current document</td></tr>' +
          '<tr><td><kbd>&#8984;</kbd> + <kbd>Q</kbd></td><td>Quit</td><td>Close the entire app</td></tr>' +
          '<tr><td><kbd>&#8984;</kbd> + <kbd>W</kbd></td><td>Close window</td><td>Close just the current window</td></tr>' +
          '<tr><td><kbd>&#8984;</kbd> + <kbd>Tab</kbd></td><td>Switch apps</td><td>Jump between open apps</td></tr>' +
          '<tr><td><kbd>&#8984;</kbd> + <kbd>Space</kbd></td><td>Spotlight</td><td>Open Spotlight search</td></tr>' +
          '</table>' +
          '<p>A note about <kbd>&#8984;</kbd> + <kbd>Z</kbd> (Undo): this is perhaps the most reassuring shortcut on the entire computer. If you accidentally delete text, move a file to the wrong place, or make any mistake at all &mdash; just press <kbd>&#8984;</kbd> + <kbd>Z</kbd> and it takes you back one step. You can press it multiple times to undo several steps. Nothing you do is permanent as long as you remember this shortcut.</p>' +
          '<p>The best way to learn these: pick two or three, and use them every day this week. By next week, they\'ll be automatic.</p>'
      },
      {
        heading: 'Screenshots',
        content: '<p>Taking a screenshot on your Mac is simple and incredibly useful. Need to save a confirmation number from a website? Capture an error message to show someone? Document a telehealth setup? Screenshots are the answer.</p>' +
          '<p>There are two main screenshot shortcuts:</p>' +
          '<ul>' +
          '<li><kbd>&#8984;</kbd> + <kbd>Shift</kbd> + <kbd>3</kbd> &mdash; <strong>Full screen screenshot.</strong> Captures everything on your screen. The image file appears on your Desktop.</li>' +
          '<li><kbd>&#8984;</kbd> + <kbd>Shift</kbd> + <kbd>4</kbd> &mdash; <strong>Area screenshot.</strong> Your cursor turns into a crosshair. Click and drag to select just the area you want to capture. This is great for grabbing a specific section of a webpage or document.</li>' +
          '</ul>' +
          '<p>After you take a screenshot, a small thumbnail appears briefly in the bottom-right corner of your screen. You can:</p>' +
          '<ul>' +
          '<li>Click the thumbnail to annotate or crop the screenshot before saving</li>' +
          '<li>Ignore it and it will save automatically to your Desktop</li>' +
          '</ul>' +
          '<p>There\'s also <kbd>&#8984;</kbd> + <kbd>Shift</kbd> + <kbd>5</kbd>, which opens a screenshot toolbar with options for recording your screen as a video &mdash; useful if you ever need to show someone how to do something on their computer.</p>'
      },
      {
        heading: 'Installing and Removing Apps',
        content: '<p>There are two ways to install apps on your Mac:</p>' +
          '<p><strong>1. The App Store</strong> (the blue icon with an "A" in your Dock): This works just like the App Store on your iPhone. Search for an app, click "Get" or the price button, and it installs automatically. Apps from the App Store are reviewed by Apple for safety.</p>' +
          '<p><strong>2. Downloading from a website:</strong> Some apps (like Zoom or Microsoft Office) are downloaded from the developer\'s website. When you download one of these, you\'ll typically get a <code>.dmg</code> file. Double-click it, and you\'ll see the app icon and an Applications folder. Drag the app icon into the Applications folder, and you\'re done.</p>' +
          '<p>Your Mac may ask, "Are you sure you want to open an application downloaded from the Internet?" This is normal &mdash; just click <strong>Open</strong> if you trust the source.</p>' +
          '<p><strong>Removing apps:</strong></p>' +
          '<ul>' +
          '<li><strong>App Store apps:</strong> Open Launchpad (pinch with thumb and three fingers on the trackpad), press and hold on the app until icons wiggle, then click the X &mdash; just like on your iPhone.</li>' +
          '<li><strong>Other apps:</strong> Open Finder, go to Applications, and drag the app to the Trash. Then empty the Trash.</li>' +
          '</ul>' +
          '<p>Removing an app from the Dock does <em>not</em> delete it &mdash; it only removes the shortcut. The app stays in your Applications folder.</p>'
      }
    ],
    tips: [
      { icon: '&#128161;', text: '<strong>Spotlight is your best friend:</strong> Whenever you\'re not sure where something is, press <kbd>&#8984;</kbd> + <kbd>Space</kbd> and type what you\'re looking for. It finds apps, files, emails, and more.' },
      { icon: '&#128161;', text: '<strong>Keep your Desktop clean:</strong> Think of your Desktop like the top of your office desk. A few active files are fine, but if it gets cluttered, create folders in Documents and file things away.' },
      { icon: '&#128161;', text: '<strong>Use <kbd>&#8984;</kbd> + <kbd>Tab</kbd> to switch apps:</strong> Hold <kbd>&#8984;</kbd> and tap <kbd>Tab</kbd> repeatedly to cycle through open apps. This is much faster than clicking on the Dock.' },
      { icon: '&#128161;', text: '<strong>Set up Hot Corners:</strong> Go to System Settings &rarr; Desktop &amp; Dock &rarr; Hot Corners. You can set a screen corner to activate Mission Control, show your Desktop, or start a screen saver when you move your cursor there. Great for quickly hiding your screen when someone walks into your office.' }
    ],
    videos: [
      { title: 'Mac Tips for Beginners', url: 'https://www.youtube.com/results?search_query=mac+tips+for+beginners+2025', duration: 'Search for latest' },
      { title: 'Mac Keyboard Shortcuts You Need to Know', url: 'https://www.youtube.com/results?search_query=mac+keyboard+shortcuts+beginners+2025', duration: 'Search for latest' }
    ]
  },
  exercises: [
    { text: 'Open Spotlight (<kbd>&#8984;</kbd> + <kbd>Space</kbd>) and use it to open System Settings. Browse through a few sections to see what\'s available.', xp: 20 },
    { text: 'Customize your Dock: add Microsoft Word and Excel to the left side, remove any apps you never use, and adjust the Dock size in System Settings.', xp: 25 },
    { text: 'Set up Hot Corners: go to System Settings &rarr; Desktop &amp; Dock &rarr; Hot Corners. Set one corner to "Mission Control" and another to "Desktop."', xp: 25 },
    { text: 'Practice these 10 keyboard shortcuts at least twice each: <kbd>&#8984;</kbd>+C, <kbd>&#8984;</kbd>+V, <kbd>&#8984;</kbd>+Z, <kbd>&#8984;</kbd>+S, <kbd>&#8984;</kbd>+Q, <kbd>&#8984;</kbd>+W, <kbd>&#8984;</kbd>+Tab, <kbd>&#8984;</kbd>+Space, <kbd>&#8984;</kbd>+Shift+3, <kbd>&#8984;</kbd>+Shift+4. Open a blank document in Notes and try Copy, Paste, Undo, and Save.', xp: 50 },
    { text: 'Take a full screenshot using <kbd>&#8984;</kbd> + <kbd>Shift</kbd> + <kbd>3</kbd>. Find the image file on your Desktop and open it to verify it worked.', xp: 15 },
    { text: 'Take an area screenshot using <kbd>&#8984;</kbd> + <kbd>Shift</kbd> + <kbd>4</kbd>. Select just a portion of your screen &mdash; try capturing a single paragraph or image.', xp: 15 },
    { text: 'Open Mission Control (swipe up with three fingers or use your Hot Corner). Create a second Desktop by clicking the "+" button in the top-right. Practice swiping between desktops with three fingers.', xp: 25 },
    { text: 'Install a free app from the App Store (try "Amphetamine" &mdash; it keeps your Mac from sleeping during long sessions, which is useful for telehealth). Then open Launchpad to see all your installed apps.', xp: 25 }
  ],
  bonus: 'Explore System Settings &rarr; Accessibility. Turn on "Zoom" (under Vision) to be able to zoom into any part of your screen by holding <kbd>Control</kbd> and scrolling. Also try increasing the cursor size under Display &rarr; Pointer. Customize three settings that make your Mac more comfortable to use.',
  achievementTrigger: { id: 'mac-starter', exerciseIndex: 3 }
});

// Week 2: Files & Digital Organization
WEEKS.push({
  num: 2,
  title: 'Files & Digital Organization',
  subtitle: 'Building a filing system that works as well as your office does',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'Files & Digital Organization',
    sections: [
      {
        heading: 'The File System &mdash; Your Digital Office',
        content: '<p>Every file on your Mac lives in an organized structure, just like a well-organized office has rooms, filing cabinets, drawers, and folders. Understanding this structure is the key to never losing a file again.</p>' +
          '<p>Here\'s how your Mac is organized:</p>' +
          '<div class="ascii-diagram">' +
          '&#x1F4BB; Your Mac (Macintosh HD)\n' +
          '  &#x2514;&#x2500;&#x2500; &#x1F464; Users\n' +
          '        &#x2514;&#x2500;&#x2500; &#x1F3E0; david\n' +
          '              &#x251C;&#x2500;&#x2500; &#x1F4C1; Desktop\n' +
          '              &#x251C;&#x2500;&#x2500; &#x1F4C1; Documents\n' +
          '              &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; Practice\n' +
          '              &#x2502;     &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; Templates\n' +
          '              &#x2502;     &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; CE Materials\n' +
          '              &#x2502;     &#x2502;     &#x2514;&#x2500;&#x2500; &#x1F4C1; Client Resources\n' +
          '              &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; Research\n' +
          '              &#x2502;     &#x2514;&#x2500;&#x2500; &#x1F4C1; Personal\n' +
          '              &#x251C;&#x2500;&#x2500; &#x1F4C1; Downloads\n' +
          '              &#x251C;&#x2500;&#x2500; &#x1F4C1; Pictures\n' +
          '              &#x2514;&#x2500;&#x2500; &#x1F4C1; Music' +
          '</div>' +
          '<p>Think of it this way: your Mac is the building. Your user folder ("david") is your personal office suite. Inside it, <strong>Documents</strong> is your main filing cabinet, <strong>Desktop</strong> is the surface of your desk, and <strong>Downloads</strong> is the inbox tray where things from the internet arrive before you file them properly.</p>' +
          '<p>The most important habit to build: when you create or receive a file, <em>put it in the right folder immediately</em>. It takes five seconds now and saves you fifteen minutes of searching later.</p>'
      },
      {
        heading: 'File Extensions &mdash; What They Mean',
        content: '<p>Every file on your computer has a <strong>name</strong> and an <strong>extension</strong> &mdash; the few letters after the dot at the end. The extension tells your Mac what kind of file it is and which app should open it.</p>' +
          '<p>By default, your Mac hides these extensions, but it\'s very helpful to see them. We\'ll turn them on in the exercises.</p>' +
          '<table class="ref-table">' +
          '<tr><th>Extension</th><th>What It Is</th><th>Opens With</th></tr>' +
          '<tr><td>.docx</td><td>Word document</td><td>Microsoft Word</td></tr>' +
          '<tr><td>.xlsx</td><td>Excel spreadsheet</td><td>Microsoft Excel</td></tr>' +
          '<tr><td>.pptx</td><td>PowerPoint presentation</td><td>Microsoft PowerPoint</td></tr>' +
          '<tr><td>.pdf</td><td>Portable document (can\'t be easily edited)</td><td>Preview or Adobe Reader</td></tr>' +
          '<tr><td>.jpg, .png</td><td>Image files</td><td>Preview</td></tr>' +
          '<tr><td>.txt</td><td>Plain text file</td><td>TextEdit</td></tr>' +
          '<tr><td>.zip</td><td>Compressed archive (a bundle of files)</td><td>Double-click to unzip</td></tr>' +
          '</table>' +
          '<p>Why does this matter for your practice? When you email a treatment plan, you want to send a <code>.pdf</code> so the recipient can\'t accidentally change it. When you\'re still working on it, you keep it as a <code>.docx</code> so you can edit it in Word. Knowing the difference helps you choose the right format for the right situation.</p>' +
          '<p>If you ever see a file extension you don\'t recognize, just search for it in Spotlight or Google &mdash; "what is a .heic file?" for example.</p>'
      },
      {
        heading: 'Creating a Folder System for Your Practice',
        content: '<p>A good folder system is like a well-organized filing cabinet: everything has a home, and you can find what you need in seconds. Here\'s a structure designed specifically for a therapy practice:</p>' +
          '<div class="ascii-diagram">' +
          '&#x1F4C1; Documents\n' +
          '  &#x251C;&#x2500;&#x2500; &#x1F4C1; Practice\n' +
          '  &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; Templates\n' +
          '  &#x2502;     &#x2502;     &#x251C;&#x2500;&#x2500; Treatment Plan Template.docx\n' +
          '  &#x2502;     &#x2502;     &#x251C;&#x2500;&#x2500; Session Notes Template.docx\n' +
          '  &#x2502;     &#x2502;     &#x2514;&#x2500;&#x2500; Referral Letter Template.docx\n' +
          '  &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; CE Materials\n' +
          '  &#x2502;     &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; 2025 Completed\n' +
          '  &#x2502;     &#x2502;     &#x2514;&#x2500;&#x2500; &#x1F4C1; 2025 In Progress\n' +
          '  &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; Client Resources\n' +
          '  &#x2502;     &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; Handouts\n' +
          '  &#x2502;     &#x2502;     &#x2514;&#x2500;&#x2500; &#x1F4C1; Worksheets\n' +
          '  &#x2502;     &#x2514;&#x2500;&#x2500; &#x1F4C1; Professional Development\n' +
          '  &#x251C;&#x2500;&#x2500; &#x1F4C1; Research\n' +
          '  &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; Neuroscience\n' +
          '  &#x2502;     &#x251C;&#x2500;&#x2500; &#x1F4C1; Treatment Models\n' +
          '  &#x2502;     &#x2514;&#x2500;&#x2500; &#x1F4C1; Substance Use\n' +
          '  &#x2514;&#x2500;&#x2500; &#x1F4C1; Personal\n' +
          '        &#x251C;&#x2500;&#x2500; &#x1F4C1; Financial\n' +
          '        &#x2514;&#x2500;&#x2500; &#x1F4C1; Medical' +
          '</div>' +
          '<p>You don\'t need to create all of these right away. Start with the top-level folders (<strong>Practice</strong>, <strong>Research</strong>, <strong>Personal</strong>) and add subfolders as you need them. The goal is that when you save a new file, you always know exactly where it should go.</p>' +
          '<p>To create a new folder: open Finder, navigate to where you want the folder, and press <kbd>&#8984;</kbd> + <kbd>Shift</kbd> + <kbd>N</kbd>. Type the name and press Enter.</p>'
      },
      {
        heading: 'iCloud Drive &mdash; Your Files Everywhere',
        content: '<p>iCloud Drive is Apple\'s system for keeping your files synchronized across all your devices. When you save a file to iCloud Drive on your Mac, it automatically appears on your iPhone too &mdash; and vice versa.</p>' +
          '<p>This is incredibly useful for your practice. Imagine you\'re at a conference and want to reference a handout you created on your Mac. If it\'s in iCloud Drive, you can pull it up on your iPhone instantly.</p>' +
          '<p><strong>How to set it up:</strong></p>' +
          '<ol>' +
          '<li>Open <strong>System Settings</strong> (use Spotlight: <kbd>&#8984;</kbd> + <kbd>Space</kbd>, type "System Settings")</li>' +
          '<li>Click your name at the top (your Apple ID)</li>' +
          '<li>Click <strong>iCloud</strong></li>' +
          '<li>Click <strong>iCloud Drive</strong> and make sure it\'s turned on</li>' +
          '<li>You can choose to sync your Desktop and Documents folders automatically</li>' +
          '</ol>' +
          '<p><strong>Important notes:</strong></p>' +
          '<ul>' +
          '<li>iCloud gives you 5 GB of free storage. If you need more, plans start at $0.99/month for 50 GB.</li>' +
          '<li>Files in iCloud Drive are encrypted, which is important for any practice-related materials.</li>' +
          '<li>A cloud icon with a download arrow next to a file means it\'s stored online but not downloaded to this device yet. Double-click to download it.</li>' +
          '</ul>' +
          '<p>One practical tip: keep your most-used templates in iCloud Drive so you can access them from any device, but keep sensitive client-related documents on your Mac\'s local storage with proper security measures.</p>'
      },
      {
        heading: 'Security Basics &mdash; Protecting Your Practice Files',
        content: '<p>As a therapist, you handle sensitive information every day. Your digital files deserve the same level of protection as the locked filing cabinet in your office. Here are the essential security measures for your Mac:</p>' +
          '<p><strong>1. Strong Passwords</strong></p>' +
          '<ul>' +
          '<li>Your Mac login password should be strong &mdash; at least 12 characters, mixing letters, numbers, and symbols</li>' +
          '<li>Never use the same password for multiple accounts</li>' +
          '<li>Consider using a password manager (your Mac has one built in called <strong>Passwords</strong>, accessible from System Settings)</li>' +
          '</ul>' +
          '<p><strong>2. FileVault Encryption</strong></p>' +
          '<p>FileVault encrypts your entire hard drive. If your Mac were ever lost or stolen, no one could read your files without your password. This is especially important for HIPAA compliance and protecting any practice-related documents on your computer.</p>' +
          '<ul>' +
          '<li>Go to <strong>System Settings &rarr; Privacy &amp; Security &rarr; FileVault</strong></li>' +
          '<li>Click <strong>Turn On</strong> if it\'s not already enabled</li>' +
          '<li>Save your recovery key in a safe place (write it down and store it securely)</li>' +
          '</ul>' +
          '<p><strong>3. Screen Lock</strong></p>' +
          '<ul>' +
          '<li>Set your Mac to lock automatically: System Settings &rarr; Lock Screen</li>' +
          '<li>Choose "Require password after screen saver begins or display is turned off" and set it to <strong>Immediately</strong></li>' +
          '<li>Use the Hot Corner you set up last week to quickly start the screen saver when you step away from your desk</li>' +
          '</ul>' +
          '<p><strong>4. Software Updates</strong></p>' +
          '<p>Always install macOS updates when they appear. They contain security fixes that protect your computer. Go to System Settings &rarr; General &rarr; Software Update to check for updates.</p>'
      }
    ],
    tips: [
      { icon: '&#128161;', text: '<strong>Date-prefix your files:</strong> Name important files starting with the date: "2025-01-15 Treatment Plan Review.docx". This way, files sort chronologically and you can always find the latest version.' },
      { icon: '&#128161;', text: '<strong>Clean Downloads weekly:</strong> Your Downloads folder fills up fast. Every Friday, take two minutes to move important files to their proper folders and delete the rest. Think of it like clearing your office inbox.' },
      { icon: '&#128161;', text: '<strong>New folder shortcut:</strong> Press <kbd>&#8984;</kbd> + <kbd>Shift</kbd> + <kbd>N</kbd> in Finder to create a new folder instantly. Much faster than right-clicking.' },
      { icon: '&#128161;', text: '<strong>Find anything fast:</strong> Press <kbd>&#8984;</kbd> + <kbd>F</kbd> in Finder to search for files by name, kind, or date. You can also type directly in the Finder search bar.' }
    ],
    videos: [
      { title: 'Organize Files and Folders on Mac', url: 'https://www.youtube.com/results?search_query=organize+files+folders+mac+finder+2025', duration: 'Search for latest' }
    ]
  },
  exercises: [
    { text: 'Turn on file extensions: Open Finder, go to Finder &rarr; Settings (in the menu bar) &rarr; Advanced, and check "Show all filename extensions." Now you\'ll always know what type each file is.', xp: 15 },
    { text: 'Create your practice folder structure in Documents: Make a "Practice" folder with subfolders for Templates, CE Materials, Client Resources, and Professional Development. Also create "Research" and "Personal" folders.', xp: 40 },
    { text: 'Move any loose files from your Desktop into appropriate folders. Aim for no more than five items remaining on your Desktop.', xp: 25 },
    { text: 'Clean your Downloads folder: open it in Finder, sort by Date Added, move anything important to the right folder, and delete files you no longer need. Empty the Trash when done.', xp: 40 },
    { text: 'Set up iCloud Drive: Go to System Settings &rarr; [Your Name] &rarr; iCloud &rarr; iCloud Drive. Turn it on and explore the options. Check if your Documents folder is syncing.', xp: 25 },
    { text: 'Practice AirDrop: Open a photo in Photos or Finder, click the Share button (the square with an arrow), and AirDrop it to your iPhone. (Make sure both devices have Wi-Fi and Bluetooth on.)', xp: 20 },
    { text: 'Create a zip file: Select two or three files in Finder (hold <kbd>&#8984;</kbd> and click each one), then right-click and choose "Compress." This creates a .zip file you can email.', xp: 15 },
    { text: 'Use Finder search: Press <kbd>&#8984;</kbd> + <kbd>F</kbd> in Finder and search for a document you know exists. Try searching by file name, then try filtering by file type (click the "Kind" dropdown).', xp: 20 }
  ],
  bonus: 'Enable FileVault encryption on your Mac (System Settings &rarr; Privacy &amp; Security &rarr; FileVault). Write down your recovery key and store it in a safe place. Also set your Lock Screen to require a password immediately. This brings your Mac security up to a level appropriate for handling practice-related documents.',
  achievementTrigger: { id: 'file-organizer', exerciseIndex: 3 }
});

// Week 3: Productivity & Scheduling
WEEKS.push({
  num: 3,
  title: 'Productivity & Scheduling',
  subtitle: 'Managing your practice schedule and professional life with built-in apps',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'Productivity & Scheduling',
    sections: [
      {
        heading: 'Why Scheduling Matters for Your Practice',
        content: '<p>Running a therapy practice means juggling many different responsibilities: client sessions, supervision meetings, CE deadlines, insurance paperwork, consultation groups, and personal commitments. When all of that lives only in your head or on scattered sticky notes, things inevitably slip through the cracks.</p>' +
          '<p>Your Mac comes with four built-in apps that work beautifully together to keep everything organized: <strong>Calendar</strong>, <strong>Reminders</strong>, <strong>Notes</strong>, and <strong>Safari</strong>. The best part? They sync automatically across your Mac and iPhone through iCloud, so you always have your schedule and notes with you.</p>' +
          '<p>Over the years, you\'ve developed excellent systems for managing your practice. This week, we\'re going to translate those systems into digital tools that can send you alerts, repeat on schedules, and be searched instantly. Think of it as upgrading from a paper planner to a planner that actively helps you remember things.</p>' +
          '<p>None of these apps require an internet connection to use (except for syncing), and they\'re all free. You don\'t need to buy anything or sign up for any new services.</p>'
      },
      {
        heading: 'Apple Calendar for Your Practice',
        content: '<p>Apple Calendar is your digital appointment book. It does everything a paper planner does, plus it sends reminders, handles recurring appointments automatically, and lets you see your schedule on any device.</p>' +
          '<p><strong>Setting up separate calendars with colors:</strong></p>' +
          '<p>The real power of Apple Calendar is creating separate, color-coded calendars for different areas of your life. This lets you see at a glance what your week looks like:</p>' +
          '<ul>' +
          '<li><strong>Client Sessions</strong> (blue) &mdash; individual and group sessions</li>' +
          '<li><strong>Supervision &amp; Consultation</strong> (green) &mdash; peer meetings, supervision</li>' +
          '<li><strong>CE &amp; Training</strong> (orange) &mdash; workshops, webinars, study time</li>' +
          '<li><strong>Administrative</strong> (red) &mdash; billing, insurance, paperwork</li>' +
          '<li><strong>Personal</strong> (purple) &mdash; appointments, family, self-care</li>' +
          '</ul>' +
          '<p>To create a new calendar: Open Calendar, go to <strong>File &rarr; New Calendar</strong>, give it a name, then right-click it in the sidebar to set the color.</p>' +
          '<p><strong>Recurring events:</strong> For weekly client sessions, create the event once, then click it, click "Edit," and set it to repeat weekly. Calendar will create it automatically for every future week. You can also set an end date if the client is approved for a set number of sessions.</p>' +
          '<p><strong>Alerts:</strong> For each event, you can set one or two alerts &mdash; for example, 30 minutes before a session starts, or one day before a CE deadline. Go to the event, click "Alert," and choose your timing.</p>'
      },
      {
        heading: 'Reminders for Follow-Ups',
        content: '<p>While Calendar is for events that happen at a specific time, <strong>Reminders</strong> is for tasks and to-do items &mdash; things you need to do, but perhaps not at an exact moment.</p>' +
          '<p>Reminders is perfect for the kind of follow-up tasks that are part of running a practice:</p>' +
          '<ul>' +
          '<li>Follow up with Dr. Martinez about a referral</li>' +
          '<li>Submit CE hours to the licensing board by March 15</li>' +
          '<li>Order new intake forms from the printer</li>' +
          '<li>Review and update treatment plan templates</li>' +
          '<li>Call insurance company about claim #4472</li>' +
          '</ul>' +
          '<p><strong>Creating lists:</strong> Just like your color-coded calendars, you can create separate Reminder lists for different areas:</p>' +
          '<ul>' +
          '<li><strong>Practice Tasks</strong> &mdash; day-to-day administrative items</li>' +
          '<li><strong>CE Deadlines</strong> &mdash; continuing education requirements with due dates</li>' +
          '<li><strong>Referrals</strong> &mdash; people to contact, follow up with</li>' +
          '<li><strong>Personal</strong> &mdash; non-work to-dos</li>' +
          '</ul>' +
          '<p>To create a new list: Open Reminders, click <strong>Add List</strong> in the bottom-left corner, give it a name and choose a color.</p>' +
          '<p><strong>Due dates and alerts:</strong> When you add a reminder, click the info button (the "i" icon) to set a due date, a time alert, or even a location-based alert (like "remind me about this when I arrive at the office").</p>' +
          '<p>The key habit: every time you think "I need to remember to do that," open Reminders and add it with a due date. Get it out of your head and into the app.</p>'
      },
      {
        heading: 'Notes for Professional Use',
        content: '<p>Apple Notes is a versatile app that\'s far more powerful than it looks. It supports formatted text, checklists, tables, photos, scanned documents, and even hand-drawn sketches.</p>' +
          '<p>Here are some practical ways to use Notes in your practice:</p>' +
          '<p><strong>Organized folders:</strong></p>' +
          '<ul>' +
          '<li><strong>Workshop Notes</strong> &mdash; capture key points from CE workshops and conferences</li>' +
          '<li><strong>Reading Notes</strong> &mdash; summaries and reflections on professional articles and books</li>' +
          '<li><strong>Session Observations</strong> &mdash; general patterns, themes, and clinical insights (no client-identifying information)</li>' +
          '<li><strong>Quick Reference</strong> &mdash; DSM criteria you look up often, insurance phone numbers, frequently needed codes</li>' +
          '</ul>' +
          '<p>To create folders: Open Notes, then go to the sidebar and click "New Folder" at the bottom.</p>' +
          '<p><strong>Useful features:</strong></p>' +
          '<ul>' +
          '<li><strong>Pin important notes</strong> to the top of a folder (right-click &rarr; Pin Note)</li>' +
          '<li><strong>Lock sensitive notes</strong> with a password (right-click &rarr; Lock Note)</li>' +
          '<li><strong>Scan documents</strong> using your iPhone camera (great for paper forms)</li>' +
          '<li><strong>Search across all notes</strong> with <kbd>&#8984;</kbd> + <kbd>F</kbd></li>' +
          '</ul>' +
          '<p>A great habit: after every CE workshop or professional conference, take five minutes to write a Notes summary with three key takeaways. These accumulate into a valuable personal reference library over time.</p>'
      },
      {
        heading: 'Safari for Research',
        content: '<p>Safari is your Mac\'s built-in web browser. While you can use any browser (Chrome, Firefox), Safari is optimized for Mac and uses less battery power. Most importantly for this lesson, Safari has a feature called <strong>Tab Groups</strong> that is perfect for organizing your professional research.</p>' +
          '<p><strong>What are Tab Groups?</strong></p>' +
          '<p>A Tab Group is a saved collection of tabs organized around a topic. Instead of having 30 tabs open and losing track of which is which, you can create groups like:</p>' +
          '<ul>' +
          '<li><strong>Neuroscience Research</strong> &mdash; articles on brain science and therapy</li>' +
          '<li><strong>Treatment Models</strong> &mdash; DBT, CBT, motivational interviewing resources</li>' +
          '<li><strong>CE Opportunities</strong> &mdash; websites where you find continuing education courses</li>' +
          '<li><strong>Substance Use Resources</strong> &mdash; SAMHSA, NIDA, treatment databases</li>' +
          '<li><strong>Insurance &amp; Billing</strong> &mdash; insurance portals, billing platforms</li>' +
          '</ul>' +
          '<p><strong>How to create a Tab Group:</strong></p>' +
          '<ol>' +
          '<li>Open Safari</li>' +
          '<li>Click the sidebar button in the toolbar (or press <kbd>&#8984;</kbd> + <kbd>Shift</kbd> + <kbd>L</kbd>)</li>' +
          '<li>Click "New Empty Tab Group" or "New Tab Group with [X] Tabs" to save your currently open tabs</li>' +
          '<li>Name the group</li>' +
          '</ol>' +
          '<p>The tabs in each group are saved and synced across your devices. You can switch between groups by clicking in the sidebar. When you switch to a different group, your current tabs are saved and replaced with the tabs from the new group. Nothing is lost.</p>' +
          '<p><strong>Other useful Safari features:</strong></p>' +
          '<ul>' +
          '<li><strong>Reader Mode:</strong> Click the "Reader" button in the address bar to strip away ads and distractions from articles</li>' +
          '<li><strong>Add to Reading List:</strong> Right-click a link and choose "Add to Reading List" to save articles for later</li>' +
          '<li><strong>Bookmarks:</strong> Press <kbd>&#8984;</kbd> + <kbd>D</kbd> to bookmark a page you want to revisit</li>' +
          '</ul>'
      }
    ],
    tips: [
      { icon: '&#128161;', text: '<strong>Color code everything:</strong> Use consistent colors across Calendar, Reminders, and Notes. If "CE &amp; Training" is orange in Calendar, make your CE Reminders list orange too. This creates visual consistency across all your planning tools.' },
      { icon: '&#128161;', text: '<strong>Always set due dates:</strong> A reminder without a due date is easy to forget. Even if the deadline is flexible, give it a date. You can always change it later. The point is to have your Mac remind you before things slip.' },
      { icon: '&#128161;', text: '<strong>Use Tab Groups to reduce clutter:</strong> Instead of keeping dozens of tabs open, organize them into Tab Groups. When you\'re done researching a topic for the day, switch to a different group. Your research tabs will be there when you come back.' }
    ],
    videos: [
      { title: 'Apple Calendar Tips and Tricks', url: 'https://www.youtube.com/results?search_query=apple+calendar+tips+tricks+mac+2025', duration: 'Search for latest' },
      { title: 'Organizing Your Life with Apple Apps', url: 'https://www.youtube.com/results?search_query=apple+reminders+notes+productivity+mac+2025', duration: 'Search for latest' }
    ]
  },
  exercises: [
    { text: 'Create at least three color-coded calendars in Apple Calendar: "Client Sessions" (blue), "CE &amp; Training" (orange), and "Personal" (purple). Add one or two more if you\'d like (Supervision, Administrative, etc.).', xp: 25 },
    { text: 'Add three recurring events to your calendar: a weekly session that repeats, a monthly consultation meeting, and a personal appointment. Set alerts for each one (e.g., 30 minutes before for sessions, 1 day before for meetings).', xp: 25 },
    { text: 'Create at least three Reminder lists: "Practice Tasks," "CE Deadlines," and "Personal." Color-code them to match your calendars where possible.', xp: 20 },
    { text: 'Add five tasks to your Reminder lists, each with a due date. Include at least one CE deadline and one follow-up task. Set at least two of them to alert you at a specific time.', xp: 25 },
    { text: 'Create three folders in Apple Notes: "Workshop Notes," "Reading Notes," and "Quick Reference." In Quick Reference, create a note with important phone numbers, website logins (not passwords), or codes you look up frequently. Pin that note.', xp: 25 },
    { text: 'Set up three Tab Groups in Safari: "Research," "CE Opportunities," and "Insurance &amp; Billing." Open two or three relevant websites in each group. Try switching between groups.', xp: 25 },
    { text: 'Do a weekly planning session: open Calendar and Reminders side by side, review your upcoming week, add any missing appointments or tasks, and make sure everything has an alert. This should take about 10 minutes.', xp: 35 },
    { text: 'Write down a professional goal (e.g., "Complete 10 CE hours this quarter" or "Learn a new treatment modality"). Break it into three to five concrete steps and add each step as a Reminder with a due date.', xp: 20 }
  ],
  bonus: 'Create a "Weekly Review" recurring event every Friday at 4 PM. In the Notes field of that event, write a checklist: (1) Review next week\'s calendar, (2) Process all open Reminders, (3) File or delete this week\'s Downloads, (4) Update CE hour tracking. Commit to doing this review every Friday for the next month.',
  achievementTrigger: { id: 'time-master', exerciseIndex: 3 }
});

// Week 4: Email & Communication
WEEKS.push({
  num: 4,
  title: 'Email & Communication',
  subtitle: 'Professional communication tools for your practice',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'Email & Communication',
    sections: [
      {
        heading: 'Gmail Essentials',
        content: '<p>You already use Gmail, which is great &mdash; it\'s one of the most powerful email services available. But most people only scratch the surface of what Gmail can do. This section will help you use Gmail like a professional communication hub rather than just a mailbox.</p>' +
          '<p><strong>Labels &mdash; Your email filing system:</strong></p>' +
          '<p>Gmail uses <strong>labels</strong> instead of folders. The difference? A single email can have multiple labels, while a folder can only hold a file in one place. Think of labels as colored sticky tabs you put on a physical letter &mdash; you can put more than one on the same piece of mail.</p>' +
          '<p>Suggested labels for your practice:</p>' +
          '<ul>' +
          '<li><strong>Referrals</strong> &mdash; incoming and outgoing referral correspondence</li>' +
          '<li><strong>Insurance</strong> &mdash; claims, authorizations, correspondence</li>' +
          '<li><strong>CE/Training</strong> &mdash; workshop confirmations, certificates, materials</li>' +
          '<li><strong>Colleagues</strong> &mdash; professional networking, consultation</li>' +
          '<li><strong>Administrative</strong> &mdash; office supplies, billing, scheduling platforms</li>' +
          '</ul>' +
          '<p><strong>Filters &mdash; Automatic sorting:</strong></p>' +
          '<p>Filters automatically label, archive, or forward emails based on rules you set. For example, you can create a filter that automatically labels any email from your insurance company with "Insurance" &mdash; no manual sorting needed.</p>' +
          '<p><strong>Search operators &mdash; Find any email instantly:</strong></p>' +
          '<table class="ref-table">' +
          '<tr><th>Search</th><th>What It Does</th><th>Example</th></tr>' +
          '<tr><td>from:</td><td>Emails from a specific person</td><td>from:dr.martinez</td></tr>' +
          '<tr><td>to:</td><td>Emails you sent to someone</td><td>to:insurance@company.com</td></tr>' +
          '<tr><td>subject:</td><td>Emails with specific subject line</td><td>subject:referral</td></tr>' +
          '<tr><td>has:attachment</td><td>Emails with attached files</td><td>has:attachment from:board</td></tr>' +
          '<tr><td>before: / after:</td><td>Emails by date</td><td>after:2025/01/01 subject:CE</td></tr>' +
          '<tr><td>is:starred</td><td>Emails you\'ve starred</td><td>is:starred label:referrals</td></tr>' +
          '</table>' +
          '<p><strong>Templates:</strong> Gmail lets you create reusable email templates &mdash; pre-written messages you can insert with a few clicks. This is perfect for messages you send regularly. We\'ll set these up in the exercises.</p>'
      },
      {
        heading: 'Professional Email Writing',
        content: '<p>In your practice, email is often your first point of contact with other professionals. Well-written emails reflect your professionalism and make communication smoother. Here are some templates and best practices tailored to your work:</p>' +
          '<p><strong>Referral Letter Email:</strong></p>' +
          '<div class="ascii-diagram">' +
          'Subject: Client Referral &mdash; [General Description]\n\n' +
          'Dear Dr. [Name],\n\n' +
          'I am writing to refer a client who I believe\n' +
          'would benefit from [type of service]. The client\n' +
          'has provided consent for this referral.\n\n' +
          'Presenting concerns include [general categories\n' +
          'only &mdash; no identifying details in email].\n\n' +
          'Please let me know your current availability\n' +
          'and intake process. I am happy to provide\n' +
          'additional information via secure channels.\n\n' +
          'Warm regards,\n' +
          'David [Last Name], LMFT, LADT' +
          '</div>' +
          '<p><strong>Insurance Correspondence:</strong></p>' +
          '<div class="ascii-diagram">' +
          'Subject: Authorization Request &mdash; [Claim/Auth #]\n\n' +
          'To Whom It May Concern,\n\n' +
          'I am writing regarding [authorization request/\n' +
          'claim inquiry] for services rendered on [date].\n\n' +
          '[Specific request or question]\n\n' +
          'My provider information:\n' +
          'NPI: [number]\n' +
          'Tax ID: [number]\n\n' +
          'Thank you for your prompt attention.\n\n' +
          'David [Last Name], LMFT, LADT' +
          '</div>' +
          '<p><strong>Important email etiquette:</strong></p>' +
          '<ul>' +
          '<li>Never include client-identifying information in regular email &mdash; use secure messaging for clinical details</li>' +
          '<li>Always include your credentials in your signature (LMFT, LADT)</li>' +
          '<li>Use "Reply All" sparingly &mdash; only when everyone on the thread needs to see your response</li>' +
          '<li>Re-read before sending. A two-second review prevents embarrassing mistakes</li>' +
          '</ul>'
      },
      {
        heading: 'Video Calls and Telehealth',
        content: '<p>Video calls have become an essential part of modern practice &mdash; for telehealth sessions, consultation groups, CE webinars, and meetings with colleagues. The two main tools you\'ll use are <strong>Zoom</strong> and <strong>FaceTime</strong>.</p>' +
          '<p><strong>Zoom Basics:</strong></p>' +
          '<p>Zoom is the standard for professional video meetings. Here\'s what you need to know:</p>' +
          '<ul>' +
          '<li><strong>Joining a meeting:</strong> Click the link in the email or calendar invitation. Zoom opens automatically.</li>' +
          '<li><strong>Starting a meeting:</strong> Open Zoom, click "New Meeting" to start one, or "Schedule" to set one up for later.</li>' +
          '<li><strong>Key controls during a call:</strong> Mute/Unmute (bottom-left), Start/Stop Video, Share Screen, Chat</li>' +
          '<li><strong>Gallery view vs. Speaker view:</strong> Gallery shows everyone in a grid; Speaker view focuses on whoever is talking</li>' +
          '</ul>' +
          '<p><strong>HIPAA Considerations for Telehealth:</strong></p>' +
          '<p>If you conduct telehealth sessions, keep these guidelines in mind:</p>' +
          '<ul>' +
          '<li>Use a <strong>HIPAA-compliant platform</strong> &mdash; Zoom offers a healthcare plan with a signed Business Associate Agreement (BAA)</li>' +
          '<li>Always use a <strong>waiting room</strong> so clients don\'t enter before you\'re ready</li>' +
          '<li>Use a <strong>password</strong> for every meeting</li>' +
          '<li>Conduct sessions in a <strong>private space</strong> with the door closed</li>' +
          '<li>Use <strong>headphones</strong> so client audio doesn\'t carry</li>' +
          '<li>Do not record sessions unless you have explicit written consent and a secure storage plan</li>' +
          '</ul>' +
          '<p><strong>FaceTime:</strong></p>' +
          '<p>FaceTime is Apple\'s video calling app. It\'s simpler than Zoom and great for quick calls with colleagues or family. It\'s built into your Mac and iPhone. Just open FaceTime, type a contact\'s name or number, and click the video button. FaceTime calls are end-to-end encrypted.</p>'
      },
      {
        heading: 'Contact Management',
        content: '<p>Your Mac\'s <strong>Contacts</strong> app syncs with your iPhone through iCloud. Taking a few minutes to organize it can save you time every day.</p>' +
          '<p><strong>Creating contact groups:</strong></p>' +
          '<p>Groups let you organize your contacts by relationship type, which is useful both for finding people quickly and for sending emails to multiple people at once.</p>' +
          '<p>Suggested groups for your practice:</p>' +
          '<ul>' +
          '<li><strong>Referral Network</strong> &mdash; psychiatrists, psychologists, other therapists you refer to or receive referrals from</li>' +
          '<li><strong>Colleagues</strong> &mdash; consultation group members, professional friends</li>' +
          '<li><strong>Insurance Contacts</strong> &mdash; representatives and phone numbers for each insurance company</li>' +
          '<li><strong>CE Providers</strong> &mdash; organizations where you take continuing education</li>' +
          '<li><strong>Professional Organizations</strong> &mdash; licensing boards, professional associations</li>' +
          '</ul>' +
          '<p><strong>How to create a group:</strong></p>' +
          '<ol>' +
          '<li>Open the Contacts app</li>' +
          '<li>Go to <strong>File &rarr; New Group</strong></li>' +
          '<li>Name the group</li>' +
          '<li>Drag contacts from your "All Contacts" list into the group</li>' +
          '</ol>' +
          '<p><strong>Adding detailed contact information:</strong></p>' +
          '<p>For professional contacts, fill in as much as possible: office phone, cell phone, email, physical address, website, and use the <strong>Notes</strong> field to add helpful details like "Specializes in adolescent trauma" or "Preferred referral for Spanish-speaking clients." This turns your Contacts app into a personal professional directory.</p>'
      }
    ],
    tips: [
      { icon: '&#128161;', text: '<strong>Gmail search operators save time:</strong> Instead of scrolling through hundreds of emails, use operators like <code>from:dr.jones has:attachment</code> to find exactly what you need in seconds.' },
      { icon: '&#128161;', text: '<strong>Create email templates for messages you send often:</strong> In Gmail, go to Settings &rarr; Advanced &rarr; Templates &rarr; Enable. Then compose a message, click the three dots (More options), and choose "Templates &rarr; Save draft as template."' },
      { icon: '&#128161;', text: '<strong>Test your Zoom setup before important calls:</strong> Go to zoom.us/test to check your camera, microphone, and speaker before a telehealth session or important meeting. Nothing disrupts a session like technical difficulties in the first five minutes.' },
      { icon: '&#128161;', text: '<strong>Set up an email signature:</strong> In Gmail Settings &rarr; General &rarr; Signature, create a professional signature with your name, credentials, phone number, and practice information. It will appear automatically at the bottom of every email.' }
    ],
    videos: [
      { title: 'Gmail Tips and Tricks', url: 'https://www.youtube.com/results?search_query=gmail+tips+tricks+labels+filters+2025', duration: 'Search for latest' },
      { title: 'Zoom Tutorial for Beginners', url: 'https://www.youtube.com/results?search_query=zoom+tutorial+beginners+2025', duration: 'Search for latest' }
    ]
  },
  exercises: [
    { text: 'Create at least four Gmail labels: "Referrals," "Insurance," "CE/Training," and "Colleagues." Color-code each one by clicking the three dots next to the label name and choosing "Label color."', xp: 25 },
    { text: 'Set up two Gmail filters: (1) Automatically label emails from your most common insurance company, and (2) Automatically label emails from a CE provider. In Gmail, click the search bar dropdown, enter the criteria, then click "Create filter."', xp: 30 },
    { text: 'Draft two email templates in Gmail: a referral inquiry template and a general professional introduction. Enable Templates in Gmail Settings &rarr; See all settings &rarr; Advanced &rarr; Templates. Compose each message, then save it as a template via the three-dot menu.', xp: 30 },
    { text: 'Organize your Contacts into groups: create at least three groups (e.g., "Referral Network," "Colleagues," "Insurance Contacts") and add relevant contacts to each group. Add notes to at least three contacts with helpful details.', xp: 40 },
    { text: 'Practice a Zoom call: If you have Zoom installed, start a test meeting (you can meet with yourself). Practice muting/unmuting, turning your camera on and off, switching between Gallery and Speaker view, and sharing your screen. If you don\'t have Zoom, download it from zoom.us.', xp: 25 },
    { text: 'Make a FaceTime call to a friend or family member from your Mac. Notice how the call quality compares to a phone call, and try the full-screen button.', xp: 20 },
    { text: 'Explore Gmail Settings: Go to Settings (gear icon) &rarr; "See all settings." Review General (signature, undo send time, default reply behavior), Labels, and Filters. Set your Undo Send time to 30 seconds for a longer window to catch mistakes.', xp: 30 }
  ],
  bonus: 'Create a professional email signature in Gmail that includes your full name, credentials (LMFT, LADT), phone number, and a note about confidentiality (e.g., "This email may contain confidential information. If you received it in error, please notify the sender and delete the message."). Also set up a vacation auto-responder template for when you take time off.',
  achievementTrigger: { id: 'communicator', exerciseIndex: 3 }
});

// Week 5: Microsoft Office for Your Practice
WEEKS.push({
  num: 5,
  title: 'Microsoft Office for Your Practice',
  subtitle: 'Creating professional documents, spreadsheets, and presentations',
  time: '2-3 hours',
  xpLesson: 100,
  xpExercise: 200,
  xpBonus: 50,
  lesson: {
    title: 'Microsoft Office for Your Practice',
    sections: [
      {
        heading: 'Word for Your Practice',
        content: '<p>You\'re already familiar with Microsoft Word, so this isn\'t about starting from scratch &mdash; it\'s about using Word more efficiently and creating professional documents that serve your practice well.</p>' +
          '<p><strong>Templates for your practice:</strong></p>' +
          '<p>One of the most time-saving things you can do is create reusable templates &mdash; documents with all the formatting and standard text already in place, so you just fill in the specifics each time.</p>' +
          '<p>Useful templates to create:</p>' +
          '<ul>' +
          '<li><strong>Treatment Plan Template</strong> &mdash; with sections for presenting problem, goals, objectives, interventions, and review dates</li>' +
          '<li><strong>Session Notes Template</strong> &mdash; with fields for date, session number, themes discussed, interventions used, homework assigned, and next session plan</li>' +
          '<li><strong>Professional Letter Template</strong> &mdash; with your letterhead, credentials, and standard closing</li>' +
          '<li><strong>Referral Letter Template</strong> &mdash; with standard referral language and consent documentation</li>' +
          '</ul>' +
          '<p><strong>Essential formatting tools:</strong></p>' +
          '<table class="ref-table">' +
          '<tr><th>Feature</th><th>How to Access It</th><th>When to Use It</th></tr>' +
          '<tr><td>Headings</td><td>Home tab &rarr; Styles</td><td>Section titles in treatment plans</td></tr>' +
          '<tr><td>Bold / Italic</td><td><kbd>&#8984;</kbd>+<kbd>B</kbd> / <kbd>&#8984;</kbd>+<kbd>I</kbd></td><td>Emphasizing key points</td></tr>' +
          '<tr><td>Bullet Lists</td><td>Home tab &rarr; Bullets button</td><td>Goals, objectives, interventions</td></tr>' +
          '<tr><td>Numbered Lists</td><td>Home tab &rarr; Numbering button</td><td>Step-by-step procedures</td></tr>' +
          '<tr><td>Tables</td><td>Insert tab &rarr; Table</td><td>Tracking grids, schedules</td></tr>' +
          '<tr><td>Headers/Footers</td><td>Insert tab &rarr; Header or Footer</td><td>Your name, credentials, page numbers</td></tr>' +
          '<tr><td>Page Break</td><td><kbd>&#8984;</kbd>+<kbd>Enter</kbd></td><td>Starting a new page cleanly</td></tr>' +
          '</table>' +
          '<p><strong>Saving as a template:</strong> After creating a document you want to reuse, go to <strong>File &rarr; Save as Template</strong>. Next time you need it, go to File &rarr; New from Template, and your custom template will be there. The original stays untouched while you work on a new copy.</p>'
      },
      {
        heading: 'Excel Basics for Tracking',
        content: '<p>Excel is a spreadsheet program &mdash; it organizes information into rows and columns, and can do calculations automatically. You don\'t need to become an Excel expert, but learning the basics will give you a powerful way to track important numbers in your practice.</p>' +
          '<p><strong>Understanding the basics:</strong></p>' +
          '<ul>' +
          '<li>Each box in the grid is called a <strong>cell</strong></li>' +
          '<li>Cells are identified by their column letter and row number: <strong>A1</strong> is the top-left cell, <strong>B3</strong> is column B, row 3</li>' +
          '<li>You can type text, numbers, or formulas into any cell</li>' +
          '<li>Columns go left to right (A, B, C...), rows go top to bottom (1, 2, 3...)</li>' +
          '</ul>' +
          '<p><strong>Practical uses for your practice:</strong></p>' +
          '<p><em>1. CE Hours Tracker:</em></p>' +
          '<table class="ref-table">' +
          '<tr><th>A: Date</th><th>B: Course Title</th><th>C: Provider</th><th>D: Hours</th><th>E: Category</th></tr>' +
          '<tr><td>2025-01-15</td><td>Trauma-Informed Care Update</td><td>PESI</td><td>6</td><td>Clinical</td></tr>' +
          '<tr><td>2025-02-08</td><td>Ethics in Substance Use Treatment</td><td>NAADAC</td><td>3</td><td>Ethics</td></tr>' +
          '<tr><td>2025-03-22</td><td>Neuroscience of Addiction</td><td>CAPE</td><td>4</td><td>Clinical</td></tr>' +
          '<tr><td colspan="3"><strong>Total Hours:</strong></td><td><strong>=SUM(D2:D4)</strong></td><td></td></tr>' +
          '</table>' +
          '<p><em>2. Simple Billing Tracker:</em></p>' +
          '<p>Track sessions, billing codes, amounts, and payment status in a simple spreadsheet.</p>' +
          '<p><strong>Essential formulas:</strong></p>' +
          '<table class="ref-table">' +
          '<tr><th>Formula</th><th>What It Does</th><th>Example</th></tr>' +
          '<tr><td>=SUM(D2:D20)</td><td>Adds up a range of numbers</td><td>Total CE hours</td></tr>' +
          '<tr><td>=AVERAGE(D2:D20)</td><td>Calculates the average</td><td>Average session length</td></tr>' +
          '<tr><td>=COUNT(D2:D20)</td><td>Counts how many cells have numbers</td><td>Number of sessions completed</td></tr>' +
          '<tr><td>=TODAY()</td><td>Shows today\'s date</td><td>Date tracking</td></tr>' +
          '</table>' +
          '<p>To enter a formula, click on a cell, type the formula starting with <strong>=</strong>, and press Enter. Excel calculates the result automatically and updates it whenever you change the source numbers.</p>'
      },
      {
        heading: 'PowerPoint for Presentations',
        content: '<p>If you\'ve ever given a workshop, in-service training, or presentation to colleagues, PowerPoint is the tool for creating professional slides. Even if you don\'t present often, knowing the basics is useful for creating handouts and visual materials.</p>' +
          '<p><strong>Getting started:</strong></p>' +
          '<ol>' +
          '<li>Open PowerPoint and choose a design template (the simpler, the better &mdash; your content is what matters)</li>' +
          '<li>The first slide is your <strong>Title Slide</strong> &mdash; add your presentation title and your name with credentials</li>' +
          '<li>Click "New Slide" in the toolbar to add more slides</li>' +
          '</ol>' +
          '<p><strong>Slide design principles:</strong></p>' +
          '<ul>' +
          '<li><strong>Less is more:</strong> Keep text to key points (5-7 words per bullet, 5-7 bullets per slide maximum)</li>' +
          '<li><strong>One idea per slide:</strong> If you\'re tempted to cram more in, make another slide instead</li>' +
          '<li><strong>Use images:</strong> A relevant photo or diagram is more engaging than a wall of text</li>' +
          '<li><strong>Consistent fonts:</strong> Stick to the template\'s fonts rather than mixing different ones</li>' +
          '<li><strong>Large text:</strong> Body text should be at least 24-point so people in the back of the room can read it</li>' +
          '</ul>' +
          '<p><strong>Adding images:</strong></p>' +
          '<ul>' +
          '<li>Go to <strong>Insert &rarr; Pictures</strong> to add images from your Mac</li>' +
          '<li>Go to <strong>Insert &rarr; Online Pictures</strong> to search for stock images</li>' +
          '<li>Click and drag the corners of an image to resize it (hold <kbd>Shift</kbd> to keep proportions)</li>' +
          '</ul>' +
          '<p><strong>Presenting:</strong></p>' +
          '<p>When you\'re ready to present, press <kbd>&#8984;</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd> to start the slideshow from the beginning, or click "Slide Show" in the menu. Use arrow keys or click to advance. Press <kbd>Esc</kbd> to exit the slideshow.</p>' +
          '<p>A practical use case: creating a brief presentation for a CE workshop you\'re leading, or a training for colleagues on a treatment approach you specialize in.</p>'
      }
    ],
    tips: [
      { icon: '&#128161;', text: '<strong>Office keyboard shortcuts carry over:</strong> The shortcuts you learned in Week 1 &mdash; <kbd>&#8984;</kbd>+<kbd>C</kbd>, <kbd>&#8984;</kbd>+<kbd>V</kbd>, <kbd>&#8984;</kbd>+<kbd>Z</kbd>, <kbd>&#8984;</kbd>+<kbd>S</kbd> &mdash; all work in Word, Excel, and PowerPoint. You already know them.' },
      { icon: '&#128161;', text: '<strong>Use templates to save time:</strong> Don\'t create documents from scratch every time. Build one good template, save it properly, and reuse it. The 30 minutes you spend creating a template saves hours over the course of a year.' },
      { icon: '&#128161;', text: '<strong>Turn on AutoSave:</strong> If you\'re signed into your Microsoft account and saving to OneDrive or iCloud, AutoSave (top-left corner of Word/Excel/PowerPoint) will save your work continuously. No more losing work to a crash or power outage.' },
      { icon: '&#128161;', text: '<strong>Save as PDF for sharing:</strong> When you need to send a document that others shouldn\'t edit (like a completed treatment plan or handout), go to File &rarr; Save As and choose PDF. This preserves your formatting and prevents accidental changes.' }
    ],
    videos: [
      { title: 'Microsoft Word Basics for Beginners', url: 'https://www.youtube.com/results?search_query=microsoft+word+basics+beginners+mac+2025', duration: 'Search for latest' },
      { title: 'Excel for Beginners', url: 'https://www.youtube.com/results?search_query=excel+beginners+tutorial+mac+2025', duration: 'Search for latest' }
    ]
  },
  exercises: [
    { text: 'Create a Treatment Plan Template in Word: Include sections for Client ID (no names in templates), Presenting Problem, Treatment Goals (numbered list), Objectives for Each Goal (bulleted sub-items), Planned Interventions, Estimated Duration, and Review Date. Use Heading styles for section titles and save it as a template.', xp: 40 },
    { text: 'Practice formatting in Word: Open your template and apply Heading 1 to section titles, Heading 2 to subsections, bold to key terms, and bulleted lists for objectives. Add a header with your name and credentials, and a footer with page numbers.', xp: 25 },
    { text: 'Create a CE Hours Tracker in Excel: Set up columns for Date, Course Title, Provider, Hours, and Category (Clinical, Ethics, Supervision, etc.). Enter at least three example courses. In a cell below the Hours column, use the =SUM() formula to calculate total hours.', xp: 40 },
    { text: 'Practice Excel formulas: In your CE tracker, add a cell that uses =AVERAGE() to calculate average hours per course. Add another cell that uses =COUNT() to show total number of courses completed. Label each formula cell clearly.', xp: 25 },
    { text: 'Create a simple PowerPoint presentation (3-5 slides) on a topic you know well &mdash; perhaps a brief overview of a treatment approach you use. Include a title slide with your credentials, content slides with bullet points, and at least one image.', xp: 25 },
    { text: 'Practice saving in different formats: Open your Word template, then use File &rarr; Save As to save it as a PDF. Open the PDF in Preview to verify it looks correct. Then save your Excel tracker as a PDF too.', xp: 20 },
    { text: 'Explore Word\'s built-in templates: Go to File &rarr; New from Template and browse the available categories. Find at least two templates that could be useful for your practice (professional letters, reports, flyers). Open one and explore how it\'s structured.', xp: 25 }
  ],
  bonus: 'Create a comprehensive Professional Letter Template in Word with your full letterhead: name, credentials (LMFT, LADT), practice address, phone, email, and license numbers. Include placeholders for date, recipient, subject, body, and closing. Format it with professional fonts and spacing. Save it as both a Word template (.dotx) and a PDF. This becomes your go-to for any official correspondence.',
  achievementTrigger: { id: 'office-pro', exerciseIndex: 3 }
});
