<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac & AI Foundations</title>
<style>
/* ============================================
   MAC & AI FOUNDATIONS — Apple-Inspired Design
   ============================================ */

:root {
  --bg: #ffffff;
  --bg-secondary: #f5f5f7;
  --bg-tertiary: #e8e8ed;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #86868b;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --purple: #af52de;
  --teal: #5ac8fa;
  --gold: #ffd60a;
  --card-bg: #ffffff;
  --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
  --card-shadow-hover: 0 4px 24px rgba(0,0,0,0.12);
  --sidebar-bg: rgba(245,245,247,0.8);
  --sidebar-width: 280px;
  --border: #d2d2d7;
  --border-light: #e5e5ea;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --bg-secondary: #1c1c1e;
    --bg-tertiary: #2c2c2e;
    --text: #f5f5f7;
    --text-secondary: #98989d;
    --text-tertiary: #6e6e73;
    --card-bg: #1c1c1e;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.3);
    --card-shadow-hover: 0 4px 24px rgba(0,0,0,0.5);
    --sidebar-bg: rgba(28,28,30,0.8);
    --border: #38383a;
    --border-light: #2c2c2e;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100vh;
}

/* ---- Layout ---- */
.app { display: flex; height: 100vh; }

/* ---- Sidebar ---- */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
  transition: transform var(--transition);
  position: relative;
}
.sidebar-resize-handle {
  position: absolute;
  top: 0;
  right: -3px;
  width: 6px;
  height: 100%;
  cursor: col-resize;
  z-index: 10;
  background: transparent;
  transition: background 0.2s;
}
.sidebar-resize-handle:hover,
.sidebar-resize-handle.active {
  background: var(--accent);
  opacity: 0.4;
}
body.sidebar-resizing { cursor: col-resize; user-select: none; -webkit-user-select: none; }
body.sidebar-resizing .main { pointer-events: none; }
.sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border-light); }
.sidebar-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.sidebar-header .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.xp-display { padding: 16px 20px; border-bottom: 1px solid var(--border-light); }
.xp-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.xp-label .level-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--accent); color: white; }
.xp-label .xp-text { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
.xp-bar-bg { height: 6px; background: var(--bg-tertiary); border-radius: 3px; overflow: hidden; }
.xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--teal)); border-radius: 3px; transition: width 0.8s cubic-bezier(0.25, 0.1, 0.25, 1); width: 0%; }
.nav-section { padding: 8px 0; }
.nav-section-title { padding: 8px 20px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 20px; cursor: pointer; transition: background var(--transition); font-size: 14px; color: var(--text); text-decoration: none; position: relative; }
.nav-item:hover { background: rgba(0,0,0,0.04); }
.nav-item.active { background: rgba(0,113,227,0.1); color: var(--accent); font-weight: 600; }
@media (prefers-color-scheme: dark) {
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active { background: rgba(0,113,227,0.2); }
}
.nav-item .week-num { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border-radius: 50%; background: var(--bg-tertiary); color: var(--text-secondary); flex-shrink: 0; }
.nav-item.active .week-num { background: var(--accent); color: white; }
.nav-item .week-info { flex: 1; min-width: 0; }
.nav-item .week-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress-ring-small { width: 28px; height: 28px; flex-shrink: 0; }
.progress-ring-small circle { fill: none; stroke-width: 3; }
.progress-ring-small .ring-bg { stroke: var(--bg-tertiary); }
.progress-ring-small .ring-fill { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; transform: rotate(-90deg); transform-origin: center; }
.week-complete-check { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: var(--green); border-radius: 50%; color: white; font-size: 14px; }

/* ---- Main Content ---- */
.main { flex: 1; overflow-y: auto; padding: 0; scroll-behavior: smooth; }
.content-wrapper { max-width: 800px; margin: 0 auto; padding: 40px 32px 80px; }

/* ---- Dashboard ---- */
.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
.stat-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 20px; box-shadow: var(--card-shadow); transition: box-shadow var(--transition), transform var(--transition); }
.stat-card:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-1px); }
.stat-card .stat-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 8px; }
.stat-card .stat-value { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
.stat-card .stat-detail { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.progress-ring-large { width: 160px; height: 160px; margin: 0 auto; }
.progress-ring-large circle { fill: none; stroke-width: 8; }
.progress-ring-large .ring-bg { stroke: var(--bg-tertiary); }
.progress-ring-large .ring-fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(0.25, 0.1, 0.25, 1); transform: rotate(-90deg); transform-origin: center; }
.progress-center-text { text-align: center; margin-top: -100px; margin-bottom: 60px; }
.progress-center-text .pct { font-size: 36px; font-weight: 700; }
.progress-center-text .pct-label { font-size: 13px; color: var(--text-secondary); }
.weekly-bars { margin: 24px 0; }
.weekly-bar-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.weekly-bar-label { width: 60px; font-size: 13px; font-weight: 500; color: var(--text-secondary); flex-shrink: 0; }
.weekly-bar-track { flex: 1; height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; }
.weekly-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; background: var(--accent); }
.weekly-bar-fill.complete { background: var(--green); }
.weekly-bar-pct { width: 36px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.achievement-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 24px 0; }
.achievement-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: var(--radius-sm); transition: all var(--transition); }
.achievement-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 24px; background: var(--bg-tertiary); transition: all var(--transition); }
.achievement-item.unlocked .achievement-icon { background: linear-gradient(135deg, var(--gold), var(--orange)); box-shadow: 0 2px 12px rgba(255,149,0,0.3); }
.achievement-item.locked .achievement-icon { opacity: 0.3; filter: grayscale(1); }
.achievement-name { font-size: 10px; font-weight: 600; text-align: center; color: var(--text-secondary); }
.timeline { display: flex; align-items: center; gap: 0; margin: 24px 0; padding: 16px 0; }
.timeline-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-tertiary); flex-shrink: 0; transition: all var(--transition); position: relative; }
.timeline-dot.completed { background: var(--green); color: white; }
.timeline-dot.current { background: var(--accent); color: white; box-shadow: 0 0 0 4px rgba(0,113,227,0.2); }
.timeline-line { flex: 1; height: 2px; background: var(--bg-tertiary); }
.timeline-line.completed { background: var(--green); }

/* ---- Section Headers ---- */
.section-header { margin-bottom: 32px; }
.section-header h2 { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }
.section-header .section-subtitle { font-size: 17px; color: var(--text-secondary); line-height: 1.5; }
.section-meta { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--text-tertiary); }
.section-meta span { display: flex; align-items: center; gap: 4px; }

/* ---- Content Cards ---- */
.content-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--card-shadow); transition: box-shadow var(--transition); }
.content-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.01em; }
.content-card p { font-size: 15px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 12px; }
.content-card p:last-child { margin-bottom: 0; }
.content-card ul, .content-card ol { padding-left: 20px; margin-bottom: 12px; }
.content-card li { font-size: 15px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 4px; }

/* ---- Exercise Items ---- */
.exercise-progress { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; padding: 12px 16px; background: var(--bg-secondary); border-radius: var(--radius-sm); }
.exercise-progress-text { font-size: 13px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
.exercise-dots { display: flex; gap: 6px; flex: 1; }
.exercise-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-tertiary); transition: all var(--transition); }
.exercise-dot.filled { background: var(--green); }
.exercise-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm); transition: background var(--transition); cursor: pointer; margin-bottom: 4px; }
.exercise-item:hover { background: var(--bg-secondary); }
.exercise-checkbox { width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: all var(--transition); cursor: pointer; }
.exercise-checkbox.checked { background: var(--green); border-color: var(--green); animation: checkBounce 0.4s ease; }
.exercise-checkbox.checked::after { content: '\2713'; color: white; font-size: 13px; font-weight: 700; }
@keyframes checkBounce { 0% { transform: scale(1); } 30% { transform: scale(1.3); } 60% { transform: scale(0.9); } 100% { transform: scale(1); } }
.exercise-text { font-size: 15px; line-height: 1.5; flex: 1; }
.exercise-item.completed .exercise-text { color: var(--text-tertiary); text-decoration: line-through; }
.exercise-xp { font-size: 12px; font-weight: 600; color: var(--accent); white-space: nowrap; padding: 2px 8px; background: rgba(0,113,227,0.08); border-radius: 12px; }

/* ---- Tips, Videos, Tables ---- */
.tip-card { background: linear-gradient(135deg, rgba(0,113,227,0.05), rgba(90,200,250,0.05)); border: 1px solid rgba(0,113,227,0.15); border-radius: var(--radius); padding: 16px 20px; margin: 16px 0; display: flex; gap: 12px; align-items: flex-start; }
.tip-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
.tip-content { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }
.tip-content strong { color: var(--text); font-weight: 600; }
.video-card { display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: var(--bg-secondary); border-radius: var(--radius-sm); margin: 12px 0; cursor: pointer; transition: all var(--transition); text-decoration: none; color: var(--text); }
.video-card:hover { background: var(--bg-tertiary); transform: translateX(4px); }
.video-icon { width: 40px; height: 40px; background: #ff0000; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; flex-shrink: 0; }
.video-info { flex: 1; }
.video-title { font-size: 14px; font-weight: 600; }
.video-duration { font-size: 12px; color: var(--text-tertiary); }
.ref-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
.ref-table th { text-align: left; padding: 10px 12px; background: var(--bg-secondary); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); border-bottom: 1px solid var(--border-light); }
.ref-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); color: var(--text-secondary); }
.ref-table code { background: var(--bg-secondary); padding: 2px 6px; border-radius: 4px; font-family: 'SF Mono', Menlo, monospace; font-size: 13px; }

/* ---- Flip Cards ---- */
.flip-container { perspective: 1200px; margin-bottom: 16px; }
.flip-card { transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1); transform-style: preserve-3d; position: relative; }
.flip-container.flipped .flip-card { transform: rotateY(180deg); }
.flip-front, .flip-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-back { transform: rotateY(180deg); position: absolute; top: 0; left: 0; right: 0; min-height: 100%; }
.flip-container.flipped .flip-back { position: relative; }
.flip-container:not(.flipped) .flip-back { display: none; }
.flip-container.flipped .flip-front { display: none; }
.flip-front { cursor: pointer; transition: box-shadow var(--transition), transform var(--transition); }
.flip-front:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-2px); }
.flip-back { cursor: pointer; }
.why-card { background: linear-gradient(135deg, rgba(52,199,89,0.06), rgba(0,113,227,0.06)); border: 1px solid rgba(52,199,89,0.15); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; }
.why-card p { color: var(--text-secondary); font-size: 14px; line-height: 1.7; }
.resource-link { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--bg-secondary); border-radius: var(--radius-sm); margin: 6px 0; font-size: 13px; color: var(--accent); text-decoration: none; transition: all var(--transition); }
.resource-link:hover { background: var(--bg-tertiary); transform: translateX(4px); }

/* ---- Exercise Help ---- */
.help-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--accent); cursor: pointer; padding: 4px 10px; border-radius: 12px; background: rgba(0,113,227,0.08); border: none; font-weight: 500; transition: all var(--transition); margin-left: 8px; }
.help-toggle:hover { background: rgba(0,113,227,0.15); }
.help-content { display: none; margin-top: 10px; padding: 14px 16px; background: var(--bg-secondary); border-radius: var(--radius-sm); border-left: 3px solid var(--accent); font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
.help-content.visible { display: block; }
.help-content ol { padding-left: 18px; margin: 8px 0; }
.help-content li { margin-bottom: 6px; }
.help-content .expected-result { margin-top: 10px; padding: 8px 12px; background: rgba(52,199,89,0.08); border-radius: var(--radius-sm); font-size: 12px; color: var(--green); }

/* ---- Diagrams ---- */
.ascii-diagram { background: linear-gradient(160deg, #1a1a2e, #16213e, #0f3460); border: 1px solid rgba(90,200,250,0.2); border-radius: var(--radius); padding: 28px 24px; font-family: 'SF Mono', Menlo, monospace; font-size: 13px; line-height: 1.6; overflow-x: auto; margin: 20px 0; white-space: pre; color: #5ac8fa; box-shadow: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(90,200,250,0.1); position: relative; letter-spacing: 0.02em; }
@media (prefers-color-scheme: light) { .ascii-diagram { background: linear-gradient(160deg, #f0f4ff, #e8eeff, #dde6ff); border-color: rgba(0,113,227,0.2); color: #0050a0; box-shadow: 0 4px 24px rgba(0,0,0,0.06), inset 0 1px 0 rgba(0,113,227,0.08); } }

/* ---- Toasts & Overlays ---- */
.xp-toast { position: fixed; top: 20px; right: 20px; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 16px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 12px; z-index: 1000; transform: translateX(120%); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.xp-toast.show { transform: translateX(0); }
.xp-toast .toast-icon { font-size: 24px; }
.xp-toast .toast-text { font-size: 14px; font-weight: 600; }
.xp-toast .toast-xp { font-size: 18px; font-weight: 700; color: var(--accent); }
.level-up-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.level-up-overlay.show { opacity: 1; pointer-events: all; }
.level-up-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 48px; text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.3); transform: scale(0.8); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); max-width: 380px; }
.level-up-overlay.show .level-up-card { transform: scale(1); }
.level-up-card .level-emoji { font-size: 64px; margin-bottom: 16px; }
.level-up-card h2 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.level-up-card .new-level { font-size: 17px; color: var(--accent); font-weight: 600; margin-bottom: 24px; }
.level-up-card button { background: var(--accent); color: white; border: none; padding: 12px 32px; border-radius: 980px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all var(--transition); }
.level-up-card button:hover { background: var(--accent-hover); transform: scale(1.02); }
.confetti-piece { position: fixed; width: 10px; height: 10px; z-index: 2001; pointer-events: none; }

/* ---- Other Elements ---- */
kbd { display: inline-block; padding: 2px 8px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin: 0 2px; }
.code-block { background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 16px; font-family: 'SF Mono', Menlo, monospace; font-size: 13px; line-height: 1.6; overflow-x: auto; margin: 12px 0; color: var(--text); position: relative; cursor: pointer; transition: box-shadow var(--transition); }
.code-block:hover { box-shadow: 0 0 0 2px var(--accent); }
.code-block::after { content: 'Click to copy'; position: absolute; top: 4px; right: 8px; font-size: 10px; font-weight: 600; color: var(--text-tertiary); opacity: 0; transition: opacity 0.2s; font-family: -apple-system, sans-serif; }
.code-block:hover::after { opacity: 1; }
.code-block.copied::after { content: 'Copied!'; color: var(--green); opacity: 1; }
.prompt-block { background: linear-gradient(135deg, rgba(175,82,222,0.06), rgba(0,113,227,0.06)); border: 1px solid rgba(175,82,222,0.2); border-radius: var(--radius); padding: 20px; font-family: 'SF Mono', Menlo, monospace; font-size: 13px; line-height: 1.7; overflow-x: auto; margin: 12px 0; color: var(--text); position: relative; cursor: pointer; white-space: pre-wrap; }
.prompt-block:hover { box-shadow: 0 0 0 2px var(--purple); }
.prompt-block::before { content: 'PROMPT TEMPLATE'; position: absolute; top: 6px; right: 10px; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: var(--purple); font-family: -apple-system, sans-serif; opacity: 0.6; }
.prompt-block::after { content: 'Click to copy'; position: absolute; bottom: 6px; right: 10px; font-size: 10px; font-weight: 600; color: var(--text-tertiary); opacity: 0; transition: opacity 0.2s; font-family: -apple-system, sans-serif; }
.prompt-block:hover::after { opacity: 1; }
.prompt-block.copied::after { content: 'Copied!'; color: var(--green); opacity: 1; }
.bonus-card { background: linear-gradient(135deg, rgba(255,149,0,0.06), rgba(255,214,10,0.06)); border: 1px solid rgba(255,149,0,0.2); border-radius: var(--radius); padding: 16px 20px; margin-top: 24px; }
.bonus-card h4 { font-size: 14px; font-weight: 700; color: var(--orange); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.bonus-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.lesson-complete-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 32px; transition: all var(--transition); }
.lesson-complete-btn:hover { background: var(--accent-hover); transform: scale(1.01); }
.lesson-complete-btn.completed { background: var(--green); cursor: default; }
.lesson-complete-btn.completed:hover { transform: none; }
